    <rect x="80" y="230" width="140" height="70" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
    <text x="150" y="255" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
