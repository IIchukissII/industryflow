  <g id="protocol">
    <rect x="280" y="220" width="120" height="90" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="5"/>
    <text x="340" y="245" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      HTTP POST
    </text>
    <text x="340" y="268" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      JSON Payload
    </text>
    <text x="340" y="288" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Authentication
    </text>
    <text x="340" y="303" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Token
    </text>
    <path d="M 220 175 L 280 260" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 220 265 L 280 265" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 220 355 L 280 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <g id="ingestion-service">
    <rect x="470" y="140" width="200" height="250" fill="#FFF9C4" stroke="#F57F17" stroke-width="3" rx="5"/>
    <text x="570" y="165" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Ingestion Service
    </text>
    <text x="570" y="180" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      FastAPI:8003
    </text>
    <rect x="490" y="190" width="160" height="45" fill="white" stroke="#F57F17" stroke-width="1" rx="3"/>
    <text x="570" y="210" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Authentication
    </text>
    <text x="570" y="226" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Token Validation
    </text>
    <rect x="490" y="245" width="160" height="45" fill="white" stroke="#F57F17" stroke-width="1" rx="3"/>
    <text x="570" y="265" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Data Validation
    </text>
    <text x="570" y="281" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Schema Check
    </text>
    <rect x="490" y="300" width="160" height="45" fill="white" stroke="#F57F17" stroke-width="1" rx="3"/>
    <text x="570" y="320" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Message Publisher
    </text>
    <text x="570" y="336" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Kafka (kafka:29092)
    </text>
    <rect x="490" y="355" width="160" height="25" fill="white" stroke="#F57F17" stroke-width="1" rx="3"/>
    <text x="570" y="372" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Tenant Routing
    </text>
    <path d="M 400 265 L 470 265" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <g id="output">
    <rect x="740" y="220" width="180" height="90" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="5"/>
    <text x="830" y="250" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      To Message Broker
    </text>
    <text x="830" y="272" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      Kafka Topic:
    </text>
    <text x="830" y="290" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
      sensor-data-raw
    </text>
    <path d="M 670 265 L 740 265" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  <rect x="100" y="450" width="800" height="180" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="5"/>
  <text x="500" y="480" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer Characteristics
  </text>
  <text x="120" y="515" font-size="12" font-weight="bold" font-family="Arial" style="white-space: pre;">
    Purpose:
  </text>
  <text x="130" y="535" font-size="11" font-family="Arial" style="white-space: pre;">
    • Receive sensor measurements from industrial equipment
  </text>
  <text x="130" y="553" font-size="11" font-family="Arial" style="white-space: pre;">
    • Authenticate devices using token-based security
  </text>
  <text x="130" y="571" font-size="11" font-family="Arial" style="white-space: pre;">
    • Validate data structure and tenant information
  </text>
  <text x="130" y="589" font-size="11" font-family="Arial" style="white-space: pre;">
    • Publish validated messages to message broker
  </text>
  <text x="520" y="515" font-size="12" font-weight="bold" font-family="Arial" style="white-space: pre;">
    Design Principles:
  </text>
  <text x="530" y="535" font-size="11" font-family="Arial" style="white-space: pre;">
    • Dedicated FastAPI service (port 8003)
  </text>
  <text x="530" y="553" font-size="11" font-family="Arial" style="white-space: pre;">
    • High throughput (10k+ events/sec)
  </text>
  <text x="530" y="571" font-size="11" font-family="Arial" style="white-space: pre;">
    • Stateless processing with JWT tokens
  </text>
  <text x="530" y="589" font-size="11" font-family="Arial" style="white-space: pre;">
    • Async I/O with uvicorn (2 workers)
  </text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <text x="500" y="680" font-size="10" text-anchor="middle" font-family="Arial" fill="#666" style="white-space: pre;">
  </text>
</svg>