<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: white;">
  
  <!-- FLOW 1: Ingestion Flow -->
  <g id="flow1">
    <rect x="80" y="100" width="1040" height="180" fill="#E3F2FD" stroke="#1976D2" stroke-width="3" rx="5"/>
    <text x="600" y="130" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">
      Flow 1: Data Ingestion Pipeline
    </text>
    
    <rect x="120" y="150" width="130" height="60" fill="white" stroke="#1976D2" stroke-width="2" rx="3"/>
    <text x="185" y="175" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">IoT Devices</text>
    <text x="185" y="193" font-size="10" text-anchor="middle" font-family="Arial">Sensor Data</text>
    
    <path d="M 250 180 L 300 180" stroke="#1976D2" stroke-width="3" fill="none" marker-end="url(#arrowhead-blue)"/>
    
    <rect x="300" y="150" width="150" height="60" fill="white" stroke="#1976D2" stroke-width="2" rx="3"/>
    <text x="375" y="175" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Ingestion Service</text>
    <text x="375" y="193" font-size="10" text-anchor="middle" font-family="Arial">FastAPI:8003</text>
    
    <path d="M 450 180 L 500 180" stroke="#1976D2" stroke-width="3" fill="none" marker-end="url(#arrowhead-blue)"/>
    
    <rect x="500" y="150" width="130" height="60" fill="white" stroke="#1976D2" stroke-width="2" rx="3"/>
    <text x="565" y="175" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Kafka</text>
    <text x="565" y="193" font-size="10" text-anchor="middle" font-family="Arial">kafka:29092</text>
    
    <path d="M 630 180 L 680 180" stroke="#1976D2" stroke-width="3" fill="none" marker-end="url(#arrowhead-blue)"/>
    
    <rect x="680" y="150" width="150" height="60" fill="white" stroke="#1976D2" stroke-width="2" rx="3"/>
    <text x="755" y="175" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Spark Streaming</text>
    <text x="755" y="193" font-size="10" text-anchor="middle" font-family="Arial">2 Jobs (local[*])</text>
    
    <path d="M 830 180 L 880 180" stroke="#1976D2" stroke-width="3" fill="none" marker-end="url(#arrowhead-blue)"/>
    
    <rect x="880" y="150" width="150" height="60" fill="white" stroke="#1976D2" stroke-width="2" rx="3"/>
    <text x="955" y="175" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">TimescaleDB</text>
    <text x="955" y="193" font-size="10" text-anchor="middle" font-family="Arial">PostgreSQL:5432</text>
    
    <text x="600" y="245" font-size="11" text-anchor="middle" font-family="Arial" fill="#555">
      Purpose: Real-time sensor data ingestion from industrial equipment to time-series database
    </text>
    <text x="600" y="263" font-size="11" text-anchor="middle" font-family="Arial" fill="#555">
      Characteristics: High throughput | Low latency | Fault tolerance | Exactly-once semantics
    </text>
  </g>
  
  <!-- FLOW 2: ML Inference Flow -->
  <g id="flow2">
    <rect x="80" y="320" width="1040" height="180" fill="#E0F2F1" stroke="#00897B" stroke-width="3" rx="5"/>
    <text x="600" y="350" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">
      Flow 2: ML Inference Pipeline
    </text>
    
    <rect x="120" y="370" width="150" height="60" fill="white" stroke="#00897B" stroke-width="2" rx="3"/>
    <text x="195" y="395" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">TimescaleDB</text>
    <text x="195" y="413" font-size="10" text-anchor="middle" font-family="Arial">Real-time Data</text>
    
    <path d="M 270 400 L 330 400" stroke="#00897B" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
    
    <rect x="330" y="370" width="150" height="60" fill="white" stroke="#00897B" stroke-width="2" rx="3"/>
    <text x="405" y="395" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">ML Service</text>
    <text x="405" y="413" font-size="10" text-anchor="middle" font-family="Arial">API:8002</text>
    
    <path d="M 480 400 L 540 400" stroke="#00897B" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
    
    <rect x="540" y="370" width="150" height="60" fill="white" stroke="#00897B" stroke-width="2" rx="3"/>
    <text x="615" y="395" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Feature Eng.</text>
    <text x="615" y="413" font-size="10" text-anchor="middle" font-family="Arial">Preprocessing</text>
    
    <path d="M 690 400 L 750 400" stroke="#00897B" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
    
    <rect x="750" y="370" width="150" height="60" fill="white" stroke="#00897B" stroke-width="2" rx="3"/>
    <text x="825" y="395" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Prediction</text>
    <text x="825" y="413" font-size="10" text-anchor="middle" font-family="Arial">Inference</text>
    
    <path d="M 900 400 L 960 400" stroke="#00897B" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
    
    <rect x="960" y="370" width="130" height="60" fill="white" stroke="#00897B" stroke-width="2" rx="3"/>
    <text x="1025" y="395" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Alert Service</text>
    <text x="1025" y="413" font-size="10" text-anchor="middle" font-family="Arial">API:8001</text>
    
    <text x="600" y="465" font-size="11" text-anchor="middle" font-family="Arial" fill="#555">
      Purpose: Real-time anomaly detection using trained machine learning models
    </text>
    <text x="600" y="483" font-size="11" text-anchor="middle" font-family="Arial" fill="#555">
      Characteristics: &lt;50ms inference | XGBoost/RandomForest models | Alert Detector worker | Kafka alerts topic
    </text>
  </g>
  
  <!-- FLOW 3: Training Flow -->
  <g id="flow3">
    <rect x="80" y="540" width="1040" height="180" fill="#FFF3E0" stroke="#F57C00" stroke-width="3" rx="5"/>
    <text x="600" y="570" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial">
      Flow 3: Model Training Pipeline
    </text>
    
    <rect x="120" y="590" width="150" height="60" fill="white" stroke="#F57C00" stroke-width="2" rx="3"/>
    <text x="195" y="615" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">TimescaleDB</text>
    <text x="195" y="633" font-size="10" text-anchor="middle" font-family="Arial">Historical Data</text>

    <path d="M 270 620 L 340 620" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>

    <rect x="340" y="590" width="150" height="60" fill="white" stroke="#F57C00" stroke-width="2" rx="3"/>
    <text x="415" y="615" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Jupyter (8888)</text>
    <text x="415" y="633" font-size="10" text-anchor="middle" font-family="Arial">Notebook Training</text>

    <path d="M 490 620 L 560 620" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>

    <rect x="560" y="590" width="180" height="60" fill="white" stroke="#F57C00" stroke-width="2" rx="3"/>
    <text x="650" y="615" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Training + Validation</text>
    <text x="650" y="633" font-size="10" text-anchor="middle" font-family="Arial">Feature Eng, Train, Test</text>

    <path d="M 740 620 L 810 620" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowhead-orange)"/>

    <rect x="810" y="590" width="280" height="60" fill="white" stroke="#F57C00" stroke-width="2" rx="3"/>
    <text x="950" y="615" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial">Model Registry</text>
    <text x="950" y="633" font-size="10" text-anchor="middle" font-family="Arial">MLflow (5000) + MinIO (9000)</text>
    
    <text x="600" y="685" font-size="11" text-anchor="middle" font-family="Arial" fill="#555">
      Purpose: Periodic model training using historical sensor data for anomaly detection
    </text>
    <text x="600" y="703" font-size="11" text-anchor="middle" font-family="Arial" fill="#555">
      Characteristics: Batch processing | Experiment tracking | Model versioning | Performance validation
    </text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976D2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00897B"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#F57C00"/>
    </marker>
  </defs>
  
</svg>
