<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 1000 570" style="background: white;">
  <rect x="100" y="120" width="800" height="100" fill="#E3F2FD" stroke="#1976D2" stroke-width="3" rx="8"/>
  <text x="500" y="165" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer 1: Data Ingestion Layer
  </text>
  <text x="500" y="190" font-size="13" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Ingestion Service (FastAPI:8003) | JWT Authentication | Kafka Publishing
  </text>
  <path d="M 500 220 L 500 260" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="100" y="260" width="800" height="100" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3" rx="8"/>
  <text x="500" y="305" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer 2: Stream Processing Layer
  </text>
  <text x="500" y="330" font-size="13" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Kafka + Zookeeper | Spark Master + Worker | Streaming + Aggregations (1min, 5min, 1hr)
  </text>
  <path d="M 500 360 L 500 400" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="100" y="400" width="800" height="100" fill="#E1F5FE" stroke="#0277BD" stroke-width="3" rx="8"/>
  <text x="500" y="445" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer 3: Storage Layer
  </text>
  <text x="500" y="470" font-size="13" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    TimescaleDB (PostgreSQL 15:5432) | Redis Cache (6379) | MinIO Object Storage (9000)
  </text>
  <rect x="100" y="540" width="380" height="100" fill="#E0F2F1" stroke="#00897B" stroke-width="3" rx="8"/>
  <text x="290" y="580" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer 4: MLOps Layer
  </text>
  <text x="290" y="605" font-size="12" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    MLflow Tracking (5000) | Jupyter (8888)
  </text>
  <text x="290" y="622" font-size="12" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    ML Service API (8002) | MinIO Model Registry
  </text>
  <rect x="520" y="540" width="380" height="100" fill="#FCE4EC" stroke="#C2185B" stroke-width="3" rx="8"/>
  <text x="710" y="580" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer 5: Application Layer
  </text>
  <text x="710" y="600" font-size="11" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    API Gateway (8000) | Alert API (8001)
  </text>
  <text x="710" y="615" font-size="11" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Frontend (3000) | ML Service (8002)
  </text>
  <text x="710" y="630" font-size="11" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Monitoring: Prometheus, Grafana, Loki
  </text>
  <path d="M 500 500 L 290 540" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 500 L 710 540" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="100" y="680" width="800" height="80" fill="#FFF9C4" stroke="#F57F17" stroke-width="2" rx="8"/>
  <text x="500" y="705" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Architecture Principles
  </text>
  <text x="500" y="728" font-size="12" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Multi-tenant Isolation | Fault Tolerance | Horizontal Scalability
  </text>
  <text x="500" y="748" font-size="12" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Real-time Processing | Machine Learning Integration
  </text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
</svg>