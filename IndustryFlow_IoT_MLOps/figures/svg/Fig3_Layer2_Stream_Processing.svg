<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 75 1000 375" style="background: white;">
  <rect x="80" y="140" width="160" height="80" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="5"/>
  <text x="160" y="170" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    From Ingestion
  </text>
  <text x="160" y="190" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Sensor Data
  </text>
  <text x="160" y="208" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Messages
  </text>
  <rect x="310" y="100" width="260" height="180" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3" rx="5"/>
  <text x="440" y="130" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Apache Kafka + Zookeeper
  </text>
  <text x="440" y="150" font-size="12" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    kafka:29092 | zookeeper:2181
  </text>
  <rect x="330" y="170" width="220" height="40" fill="white" stroke="#7B1FA2" stroke-width="2" rx="3"/>
  <text x="440" y="193" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Topic: sensor-data-raw
  </text>
  <rect x="330" y="220" width="65" height="40" fill="white" stroke="#7B1FA2" stroke-width="1" rx="3"/>
  <text x="362" y="235" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">Partition 0</text>
  <text x="362" y="248" font-size="9" text-anchor="middle" font-family="Arial" style="white-space: pre;">Tenant A</text>
  <rect x="405" y="220" width="65" height="40" fill="white" stroke="#7B1FA2" stroke-width="1" rx="3"/>
  <text x="437" y="235" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">Partition 1</text>
  <text x="437" y="248" font-size="9" text-anchor="middle" font-family="Arial" style="white-space: pre;">Tenant B</text>
  <rect x="480" y="220" width="65" height="40" fill="white" stroke="#7B1FA2" stroke-width="1" rx="3"/>
  <text x="512" y="235" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">Partition 2</text>
  <text x="512" y="248" font-size="9" text-anchor="middle" font-family="Arial" style="white-space: pre;">Tenant C</text>
  <path d="M 240 180 L 310 180" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="260" y="175" font-size="9" font-family="Arial" style="white-space: pre;">Publish</text>
  <rect x="650" y="100" width="360" height="180" fill="#E8F5E9" stroke="#388E3C" stroke-width="3" rx="5"/>
  <text x="830" y="130" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Apache Spark Cluster
  </text>
  <text x="830" y="150" font-size="12" text-anchor="middle" font-family="Arial" fill="#555" style="white-space: pre;">
    Master:7077,8080 | Worker:8081 | local[*]
  </text>
  <rect x="670" y="170" width="150" height="50" fill="white" stroke="#388E3C" stroke-width="2" rx="3"/>
  <text x="745" y="190" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Spark Streaming
  </text>
  <text x="745" y="208" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Raw Data Processing
  </text>
  <rect x="840" y="170" width="150" height="50" fill="white" stroke="#388E3C" stroke-width="2" rx="3"/>
  <text x="915" y="190" font-size="12" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Spark Aggregations
  </text>
  <text x="915" y="208" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    1min, 5min, 1hour
  </text>
  <rect x="670" y="230" width="150" height="35" fill="white" stroke="#388E3C" stroke-width="1" rx="3"/>
  <text x="745" y="250" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Exactly-once Semantics
  </text>
  <rect x="840" y="230" width="150" height="35" fill="white" stroke="#388E3C" stroke-width="1" rx="3"/>
  <text x="915" y="250" font-size="10" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Checkpointing
  </text>
  <path d="M 570 190 L 650 190" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="595" y="185" font-size="9" font-family="Arial" style="white-space: pre;">Consume</text>
  <rect x="390" y="360" width="320" height="80" fill="#E1F5FE" stroke="#0277BD" stroke-width="2" rx="5"/>
  <text x="550" y="390" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    To Storage Layer
  </text>
  <text x="550" y="410" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Processed Time-series Data
  </text>
  <text x="550" y="428" font-size="11" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Aggregated Statistics
  </text>
  <path d="M 830 280 L 830 320 L 550 320 L 550 360" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="700" y="300" font-size="9" font-family="Arial" style="white-space: pre;">Write</text>
  <rect x="80" y="490" width="940" height="140" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="5"/>
  <text x="550" y="520" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial" style="white-space: pre;">
    Layer Characteristics
  </text>
  <text x="100" y="555" font-size="12" font-weight="bold" font-family="Arial" style="white-space: pre;">
    Message Broker (Kafka):
  </text>
  <text x="110" y="575" font-size="11" font-family="Arial" style="white-space: pre;">
    • Fault-tolerant buffering (Replication Factor: 1)
  </text>
  <text x="110" y="593" font-size="11" font-family="Arial" style="white-space: pre;">
    • 12 partitions for tenant_id isolation
  </text>
  <text x="110" y="611" font-size="11" font-family="Arial" style="white-space: pre;">
    • 168 hours message retention
  </text>
  <text x="450" y="555" font-size="12" font-weight="bold" font-family="Arial" style="white-space: pre;">
    Stream Processing (Spark):
  </text>
  <text x="460" y="575" font-size="11" font-family="Arial" style="white-space: pre;">
    • Two separate jobs: Streaming + Aggregations
  </text>
  <text x="460" y="593" font-size="11" font-family="Arial" style="white-space: pre;">
    • Exactly-once semantics with checkpointing
  </text>
  <text x="460" y="611" font-size="11" font-family="Arial" style="white-space: pre;">
    • Direct writes to TimescaleDB (JDBC)
  </text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  <text x="550" y="680" font-size="10" text-anchor="middle" font-family="Arial" fill="#666" style="white-space: pre;">
  </text>
</svg>