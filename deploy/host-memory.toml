# The platform's measured need (ADR-0050; manual: docs/getting-started.md, Resource budget). A service's memory
# follows its software and its load, not the host: each service's need is a measurement on the reference host,
# dated, never chosen, in two parts: resident, the pages in use (anon, shmem, kernel, mapped code), which must
# sit in memory; and cold, the pages held but untouched, which may sit in swap. scripts/host-memory.py derives
# from it and the host's memory, swap and processors every limit and heap, the ingest capacity and the notebook
# pool; the chart's memory comes from it too (ADR-0050 dec 7).
#
# headroom: each part's margin over its measurement.
# margin_mib: the least margin of a service's resident part over its measurement: a small service's bursts
#   (an nginx reload's workers, a burst of TLS connections) are an amount, not a fraction. It also keeps every
#   limit above 0, which Docker reads as none.
# [reference]: the highest ingest rate the need was measured at, on which host; the need below it is taken as
#   at it, and no capacity above it is derived (ADR-0050 Deferred).
# [ingest]: the rate the ingest path and the stream engines carry per processor at their objective, measured.
# [floor]: the smallest host the platform is held to (ADR-0050 dec 6): 8 GB as the reference host reports it,
#   and its swap. A guard fails when the platform, the reserve and one authoring session's guarantee no longer
#   fit it.
# [reserve]: what runs beside the containers, measured: the host's own processes (Docker, containerd, the
#   kernel's own memory outside every cgroup) and the one-shot jobs (the backup); times the headroom. A
#   container's page cache is charged to the container, not here.
# [sessions.<profile>]: one notebook session's need on its profile's reference journey (ADR-0050 dec 5;
#   docs/operations/capacity.md#a-notebook-session): its resident part times the headroom is the guarantee the
#   notebook pool gives it; it has no size.
# A heap is a fraction of its service's memory limit, chosen so that at the reference rate it is the heap the
# measurement ran with; Postgres settings likewise, of timescaledb's limit or of the reserve.
# effective_cache_size is the planner's guess of the cache it reads through: half the reserve, as before.

headroom = 1.10
margin_mib = 16

[reference]
readings_per_second = 500
host_mib = 7765
measured = 2026-11-26

[ingest]
# 500 readings/s sustained for 56 minutes on 4 processors, p95 within the objective (capacity.md).
readings_per_second_per_cpu = 125
measured = 2026-10-18

[floor]
memory_mib = 7765
swap_mib = 8191

# [chart]: the measured services the Helm chart runs, each as a container of its own, and those whose chart
#   probe runs Python inside the container (a kubelet's HTTP probe runs none) (ADR-0050 dec 7); a chart
#   workload is named as its compose service. `unmeasured`: the chart's long-running containers no
#   measurement holds yet ("<workload>/<container>"), which keep the chart's own memory until one does.

[chart]
services = ["alert-service-detector", "api-gateway", "frontend", "ingestion-service", "kafka", "kafka-exporter",
            "minio", "ml-service-api", "mlflow", "notebook-cold-broker", "notebook-hub", "notebook-sql-proxy",
            "notebook-sso", "notebook-tracking-gateway", "ops-agent", "postgres-exporter", "quota-redis", "redis",
            "redis-exporter", "spark-aggregations", "spark-streaming", "timescaledb", "zookeeper"]
python_probes = ["alert-service-detector", "spark-aggregations", "spark-streaming"]

[chart.unmeasured]
# The ingestion pods' metrics listener: an nginx the chart runs beside each replica; Compose has none.
"ingestion-service/metrics-listener" = "chart only; measured on the first cluster"
# The hub's proxy: on Compose the hub starts it inside its own container, measured with the hub.
"notebook-proxy/chp" = "measured with notebook-hub on a single host; apart only on a cluster"

# [probe]: a healthcheck that runs Python inside the container (compose or its image) starts an interpreter
#   every interval, charged to the container; measured as its peak, added to both limits of each service
#   with probe = "python". A sampler at 10 s catches it only by chance, so it is counted on its own.

[probe]
python_mib = 19
measured = 2026-11-25

[sessions.authoring]
resident_mib = 570
cold_mib = 1077
measured = 2026-11-26

[sessions.analytics]
resident_mib = 51
cold_mib = 112
measured = 2026-11-26

[reserve]
host_mib = 605
one_shot_mib = 85
measured = 2026-11-25

[postgres]
POSTGRES_SHARED_BUFFERS = { of = "limit", fraction = 0.3302 }
POSTGRES_MAINTENANCE_WORK_MEM = { of = "limit", fraction = 0.1101 }
POSTGRES_EFFECTIVE_CACHE_SIZE = { of = "reserve", fraction = 0.5 }

# Each service's need at the reference rate, measured with its journeys (docs/operations/capacity.md#memory). The
# cold need includes a start's peak: a start touches every page once, and what it does not keep may sit in swap.

