# The single host's memory budget (ADR-0050; manual: docs/getting-started.md, Memory budget).
# A service's memory follows the software and the load, not the host: each tier is the platform's need at
# one ingest rate, measured on a reference host (docs/operations/capacity.md#memory), never chosen. The
# need has two parts: resident, the pages in use (anon, shmem, kernel, mapped code), which must sit in
# memory; and cold, the pages held but untouched, which may sit in swap. Each service has a weight in both.
# scripts/host-memory.py derives every limit and heap from the tier, and the notebook share from what the
# platform leaves of the host.
#
# headroom: each part's margin over its measurement.
# margin_mib: the least margin of a service's resident part over its measurement: a small service's bursts
#   (an nginx reload's workers, a burst of TLS connections) are an amount, not a fraction. It also keeps every
#   limit above 0, which Docker reads as none.
# [reserve]: what runs beside the containers, measured: the host's own processes (Docker, containerd, the
#   kernel's own memory outside every cgroup) and the one-shot jobs (the backup); times the headroom. A
#   container's page cache is charged to the container, not here.
# [sessions.<profile>]: one notebook session's size and need (ADR-0050 dec 5). size_mib is the profile's size,
#   the same on every host and under both spawners (the hub's PROFILE_RESOURCES, held equal by a guard); its
#   need is measured like a service's on the reference journey (docs/operations/capacity.md#memory). A
#   session's memory limit is its size, never below its resident part times the headroom; its swap is its
#   cold part times the headroom. A notebook share below one authoring session's limit is written as 0, and
#   the hub refuses every start.
# tier: the default; an operator sets MEMORY_TIER in .env.
# A heap is a fraction of its service's memory limit, chosen so that at the measured tier it is the heap
# the measurement ran with; Postgres settings likewise, of timescaledb's limit or of the reserve.
# effective_cache_size is the planner's guess of the cache it reads through: half the reserve, as before.

headroom = 1.10
margin_mib = 16
tier = "250/s"

# [probe]: a healthcheck that runs Python inside the container (compose or its image) starts an interpreter
#   every interval, charged to the container; measured as its peak, added to both limits of each service
#   with probe = "python". A sampler at 10 s catches it only by chance, so it is counted on its own.

[probe]
python_mib = 19
measured = 2026-11-25

[sessions.authoring]
size_mib = 4096
resident_mib = 570
cold_mib = 1077
measured = 2026-11-26

[sessions.analytics]
size_mib = 1024
resident_mib = 51
cold_mib = 112
measured = 2026-11-26

[reserve]
host_mib = 605
one_shot_mib = 85
measured = 2026-11-25

[tiers."250/s"]
resident_mib = 6072
cold_mib = 3220
readings_per_second = 250
reference_host_mib = 7765
measured = 2026-11-26

[tiers."500/s"]
resident_mib = 6077
cold_mib = 3219
readings_per_second = 500
reference_host_mib = 7765
measured = 2026-11-26

[postgres]
POSTGRES_SHARED_BUFFERS = { of = "limit", fraction = 0.3302 }
POSTGRES_MAINTENANCE_WORK_MEM = { of = "limit", fraction = 0.1101 }
POSTGRES_EFFECTIVE_CACHE_SIZE = { of = "reserve", fraction = 0.5 }

