[services.spark-streaming]
share = 0.135
heap = { kind = "size", var = "SPARK_STREAMING_DRIVER_MEMORY", fraction = 0.65, min_mib = 512 }

[services.spark-aggregations]
share = 0.160
heap = { kind = "size", var = "SPARK_AGGREGATIONS_DRIVER_MEMORY", fraction = 0.65, min_mib = 512 }

[services.api-gateway]
