#
# Notebook hub runtime (ADR-0011/0012/0014). REFERENCE — renders via `helm template` but has
# NOT been validated on a cluster. Components:
#   * RBAC for the hub to manage per-user pods (KubeSpawner).
#   * The hub Deployment + Service.
#   * The configurable-http-proxy (chp) Deployment + Service the hub manages.
#   * The SSO reverse proxy that serves the notebook origin: the ticket exchange, the notebook
#     session checked against api-gateway, the verified identity forwarded to the hub, overwriting
#     any client-supplied identity (ADR-0014, ADR-0048).
#   * The notebooks Ingress: the notebook origin's own host (→ SSO proxy).
# The single-user pod isolation NetworkPolicy lives in networkpolicy.yaml (same toggle).
{{- if .Values.notebookHub.enabled }}
{{- $fullname := include "industryflow.fullname" . }}
{{- $hubSvc := printf "%s-notebook-hub" $fullname }}
{{- $proxySvc := printf "%s-notebook-proxy" $fullname }}
{{- $ssoSvc := printf "%s-notebook-sso" $fullname }}
{{- $apiSvc := printf "%s-api-gateway" $fullname }}
{{- $apiPort := (index .Values.apps "api-gateway").port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-notebook-hub
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-notebook-hub
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-hub
rules:
  # KubeSpawner manages per-user pods (and their PVCs/events) in this namespace.
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-notebook-hub
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-notebook-hub
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-notebook-hub
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $hubSvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-hub
spec:
  selector:
    app.kubernetes.io/name: notebook-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: hub
      port: {{ .Values.notebookHub.hub.port }}
      targetPort: {{ .Values.notebookHub.hub.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $hubSvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-hub
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-hub
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $fullname }}-notebook-hub
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.tenantDelete.enabled }}
      {{- /* ADR-0034 dec 10: the reclaim service reads the platform database. */}}
      initContainers:
        {{- include "industryflow.schemaReadyInitContainer" (dict "ctx" . "user" "notebook_hub_reclaim_user" "workload" "notebook-hub" "passwordKey" "NOTEBOOK_HUB_RECLAIM_DB_PASSWORD") | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.notebookHub.hub.image "tag" .Values.image.tag "digest" .Values.notebookHub.hub.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: hub
              containerPort: {{ .Values.notebookHub.hub.port }}
          env:
            # Spawner profile (ADR-0018): Kubernetes runs KubeSpawner. The image also ships
            # DockerSpawner for the compose profile; this selects KubeSpawner here.
            - name: NOTEBOOK_SPAWNER
              value: "kube"
            # Mount the hub under a path prefix so the frontend can embed it same-origin (ADR-0014):
            # <app-host>/jupyter/ → SSO proxy → hub. Propagates to chp + every single-user server.
            - name: NOTEBOOK_BASE_URL
              value: {{ .Values.notebookHub.baseUrl | quote }}
            # Framed by the platform origin only; the hub does not start unless its own differs (ADR-0048).
            - name: NOTEBOOK_PLATFORM_ORIGIN
              value: {{ include "industryflow.platformOrigin" . | quote }}
            - name: NOTEBOOK_ORIGIN
              value: {{ include "industryflow.notebookOrigin" . | quote }}
            # Per-profile single-user images (ADR-0011 dec 5): the spawn hook picks one by role.
            - name: NOTEBOOK_IMAGE_AUTHORING
              value: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.notebookHub.singleUser.authoring.image "tag" .Values.image.tag "digest" .Values.notebookHub.singleUser.authoring.digest) | quote }}
            - name: NOTEBOOK_IMAGE_ANALYTICS
              value: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.notebookHub.singleUser.analytics.image "tag" .Values.image.tag "digest" .Values.notebookHub.singleUser.analytics.digest) | quote }}
            # Platform roles that get the authoring profile (ADR-0014 dec 4).
            - name: NOTEBOOK_AUTHORING_ROLES
              value: {{ .Values.notebookHub.authoringRoles | quote }}
            # Capability store (ADR-0015) — the same Redis the rest of the platform uses.
            - name: REDIS_URL
              value: {{ printf "redis://%s:%v/0" (include "industryflow.redisHost" .) .Values.infra.redis.port | quote }}
            # chp lives in a sibling container/service; the hub configures it over its API.
            - name: CONFIGPROXY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-hub") }}
                  key: CONFIGPROXY_AUTH_TOKEN
            - name: JUPYTERHUB_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-hub") }}
                  key: JUPYTERHUB_COOKIE_SECRET
            # Encrypts auth_state (the verified tenant/role carried to spawn); enable_auth_state.
            - name: JUPYTERHUB_CRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-hub") }}
                  key: JUPYTERHUB_CRYPT_KEY
            # The secret the SSO proxy presents on hub traffic (ADR-0014 dec 3); the hub honours a
            # forwarded identity only with it, and does not start without it.
            - name: NOTEBOOK_SSO_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-hub") }}
                  key: NOTEBOOK_SSO_PROXY_SECRET
            # chp is the sibling Deployment: the hub configures it over its API and starts none.
            - name: CONFIGPROXY_API_URL
              value: "http://{{ $proxySvc }}:8001"
            # Where chp and the single-user pods reach the hub API: its Service.
            - name: HUB_CONNECT_IP
              value: {{ $hubSvc | quote }}
            # Where authoring kernels reach the SQL access proxy (ADR-0015); forwarded to authoring
            # spawns only. The kernel presents its SQL capability handle as the password.
            - name: INDUSTRYFLOW_SQL_PROXY_URL
              value: {{ printf "postgresql://%s-notebook-sql-proxy:%v/%s" $fullname .Values.notebookHub.sqlProxy.port .Values.infra.timescaledb.database | quote }}
            # Where authoring kernels reach the experiment-tracking gateway (ADR-0019); forwarded to
            # authoring spawns only. The kernel presents its tracking capability as the MLflow bearer.
            - name: INDUSTRYFLOW_TRACKING_URL
              value: {{ printf "http://%s-notebook-tracking-gateway:%v" $fullname .Values.notebookHub.trackingGateway.port | quote }}
            {{- if .Values.coldExport.enabled }}
            # Where authoring kernels reach the cold-store broker (ADR-0025 read side); forwarded to
            # authoring spawns only. The kernel presents its cold capability handle as the bearer.
            - name: INDUSTRYFLOW_COLD_BROKER_URL
              value: {{ printf "http://%s-notebook-cold-broker:%v" $fullname .Values.notebookHub.coldBroker.port | quote }}
            {{- end }}
            {{- if .Values.tenantDelete.enabled }}
            # The reclaim service's database identity (ADR-0020 dec 6): it reads the deletion record
            # and records the notebook volumes reclaimed, nothing else.
            - name: NOTEBOOK_RECLAIM_DB_HOST
              value: {{ include "industryflow.dbHost" . | quote }}
            - name: NOTEBOOK_RECLAIM_DB_PORT
              value: {{ .Values.infra.timescaledb.port | quote }}
            - name: NOTEBOOK_RECLAIM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-hub") }}
                  key: NOTEBOOK_HUB_RECLAIM_DB_PASSWORD
            {{- if .Values.tls.db.enabled }}
            - name: NOTEBOOK_RECLAIM_DB_SSLMODE
              value: {{ .Values.tls.db.sslmode | quote }}
            - name: NOTEBOOK_RECLAIM_DB_SSLROOTCERT
              value: {{ printf "%s/ca.crt" .Values.tls.db.mountPath | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.notebookHub.hub.resources | nindent 12 }}
          {{- if and .Values.tenantDelete.enabled .Values.tls.db.enabled }}
          volumeMounts:
            - name: db-ca
              mountPath: {{ printf "%s/ca.crt" .Values.tls.db.mountPath }}
              subPath: ca.crt
              readOnly: true
          {{- end }}
      {{- if .Values.tenantDelete.enabled }}
      volumes:
        {{- include "industryflow.schemaReadyVolumes" . | nindent 8 }}
        {{- if .Values.tls.db.enabled }}
        - name: db-ca
          secret:
            secretName: {{ .Values.tls.db.secretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $proxySvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-proxy
spec:
  selector:
    app.kubernetes.io/name: notebook-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: public
      port: {{ .Values.notebookHub.proxy.port }}
      targetPort: 8000
    - name: api
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $proxySvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: chp
          image: {{ .Values.notebookHub.proxy.image | quote }}
          command:
            - configurable-http-proxy
            - --ip=0.0.0.0
            - --port=8000
            - --api-ip=0.0.0.0
            - --api-port=8001
            - --default-target=http://{{ $hubSvc }}:{{ .Values.notebookHub.hub.port }}
            - --error-target=http://{{ $hubSvc }}:{{ .Values.notebookHub.hub.port }}/hub/error
          env:
            - name: CONFIGPROXY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-hub") }}
                  key: CONFIGPROXY_AUTH_TOKEN
          ports:
            - name: public
              containerPort: 8000
            - name: api
              containerPort: 8001
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ssoSvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-sso
data:
  # A template: the nginx image renders it into conf.d at start (envsubst, filtered to
  # NOTEBOOK_SSO_PROXY_SECRET), so the secret comes from the Secret, never from this ConfigMap.
  default.conf.template: |
    # SSO reverse proxy (ADR-0014, ADR-0048): everything the notebook origin serves. The origin is
    # entered by spending a platform-minted ticket for a notebook session (/enter); every request is
    # checked against the platform's session verification through that notebook session, and the
    # verified identity is forwarded to the hub proxy, overwriting any client-supplied identity
    # (ADR-0002 anti-spoofing). Included inside http{}, so the map directive is valid here.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
    # The proxy's credential to the hub (ADR-0014 dec 3): the hub honours a forwarded identity only
    # on a request carrying it, because single-user pods reach the hub API too. Sent on hub routes
    # only, never on /user/ traffic (single-user servers run user code). Matched on the raw path,
    # and withheld from any path another hop might route differently.
    map $request_uri $if_hub_route {
        default 0;
        "~^{{ .Values.notebookHub.baseUrl }}hub/" 1;
    }
    map $request_uri $if_ambiguous_path {
        default 0;
        "~^[^?]*(\.\.|%2[eEfF]|%5[cC]|//|\\\\)" 1;
    }
    map "$if_hub_route$if_ambiguous_path" $if_sso_proxy_secret {
        default "";
        "10"    "${NOTEBOOK_SSO_PROXY_SECRET}";
    }
    # The notebook session cookie is the only one the session check reads; the platform's own cookies
    # reach this origin (a sibling host is the same site) and are honoured nowhere here (ADR-0048
    # dec 2). Nothing behind the proxy gets any of them: chp hands /user/ traffic to the single-user
    # server, where user code runs (ADR-0014 dec 5).
    map $http_cookie $if_notebook_session {
        default "";
        "~(?:^|;[ ]*)if_nb=([^;]*)" "if_nb=$1";
    }
    map $http_cookie $if_cookie_no_access {
        default $http_cookie;
        "~^(.*?)(?:^|;[ ]*)if_access=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_access $if_cookie_no_csrf {
        default $if_cookie_no_access;
        "~^(.*?)(?:^|;[ ]*)if_csrf=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_csrf $if_cookie_no_refresh {
        default $if_cookie_no_csrf;
        "~^(.*?)(?:^|;[ ]*)if_refresh=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_refresh $if_cookie_no_notebook {
        default $if_cookie_no_refresh;
        "~^(.*?)(?:^|;[ ]*)if_nb=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_notebook $if_hub_cookie {
        default $if_cookie_no_notebook;
        "~^;[ ]*(.*)$" "$1";
    }
    # A browser without a notebook session: a page in the platform's frame is told so, a top-level one
    # is sent to the platform's notebooks page, which enters again.
    map $http_sec_fetch_dest $if_no_session_top_level {
        default 0;
        document 1;
    }
    server {
        listen {{ .Values.notebookHub.ssoProxy.port }};
        absolute_redirect off;

        # Subrequest to the gateway: checks the notebook session and returns the verified identity in
        # X-IF-* response headers (ADR-0014 dec 2).
        location = /_notebook_auth {
            internal;
            proxy_pass http://{{ $apiSvc }}:{{ $apiPort }}{{ .Values.notebookHub.ssoProxy.verifyPath }};
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $if_notebook_session;
            proxy_set_header X-Original-URI $request_uri;
        }

        # The notebook origin's one public entry (ADR-0048 dec 3, ADR-0014 dec 6): a platform page posts
        # its ticket here; the gateway spends it and answers with the notebook session cookie. The
        # Origin and Host it judges by pass unchanged; no cookie is sent.
        location = /enter {
            limit_except POST { deny all; }
            client_max_body_size 4k;
            proxy_pass http://{{ $apiSvc }}:{{ $apiPort }}/auth/notebook-entry;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_intercept_errors on;
            error_page 401 403 = @no_session;
        }

        # The platform's sign-out signs out of the hub (ADR-0014 dec 7) without knowing its path.
        location = /logout {
            return 302 {{ .Values.notebookHub.baseUrl }}hub/logout;
        }

        location = / {
            return 302 {{ .Values.notebookHub.baseUrl }};
        }

        location / {
            auth_request /_notebook_auth;
            # Capture the verified identity from the subrequest response.
            auth_request_set $if_user    $upstream_http_x_if_user;
            auth_request_set $if_company $upstream_http_x_if_company_id;
            auth_request_set $if_role    $upstream_http_x_if_role;

            # Forward the verified identity; these always overwrite anything the client sent.
            proxy_set_header X-IF-User       $if_user;
            proxy_set_header X-IF-Company-Id $if_company;
            proxy_set_header X-IF-Role       $if_role;
            # Always set, so a client-supplied value never passes; empty (not sent) off hub routes.
            proxy_set_header X-IF-SSO-Proxy-Secret $if_sso_proxy_secret;
            # No platform cookie and not the notebook session's (the maps above).
            proxy_set_header Cookie $if_hub_cookie;

            proxy_pass http://{{ $proxySvc }}:{{ .Values.notebookHub.proxy.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Notebook traffic is websocket-heavy.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            error_page 401 = @no_session;
        }

        location @no_session {
            if ($if_no_session_top_level) {
                return 302 {{ include "industryflow.platformOrigin" . }}/notebooks;
            }
            default_type text/html;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors {{ include "industryflow.platformOrigin" . }}" always;
            add_header Cache-Control "no-store" always;
            return 401 '<!doctype html><title>Notebooks</title><p>Your notebook session has ended. <a href="{{ include "industryflow.platformOrigin" . }}/notebooks" target="_top">Open notebooks again</a>.</p>';
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $ssoSvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-sso
spec:
  selector:
    app.kubernetes.io/name: notebook-sso
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.notebookHub.ssoProxy.port }}
      targetPort: {{ .Values.notebookHub.ssoProxy.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $ssoSvc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-sso
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-sso
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.notebookHub.ssoProxy.image | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.notebookHub.ssoProxy.port }}
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: "^NOTEBOOK_SSO_PROXY_SECRET$"
            - name: NOTEBOOK_SSO_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-sso") }}
                  key: NOTEBOOK_SSO_PROXY_SECRET
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: {{ $ssoSvc }}
{{- if .Values.ingress.enabled }}
---
# The notebook origin (ADR-0048 dec 6): a sibling host of the platform's, its every path to the SSO
# proxy, which takes the ticket exchange and serves the hub. No path of the platform's host reaches it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-notebooks
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.notebookHub.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.notebookHub.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $ssoSvc }}
                port:
                  number: {{ .Values.notebookHub.ssoProxy.port }}
{{- end }}
{{- end }}
