apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "industryflow.fullname" . }}-config
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
data:
  # Resolved connection endpoints (in-cluster service names or external hosts).
  DB_HOST: {{ include "industryflow.dbHost" . | quote }}
  TIMESCALEDB_HOST: {{ include "industryflow.dbHost" . | quote }}
  TIMESCALEDB_PORT: {{ .Values.infra.timescaledb.port | quote }}
  TIMESCALEDB_DB: {{ .Values.infra.timescaledb.database | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ include "industryflow.kafkaBootstrap" . | quote }}
  REDIS_HOST: {{ include "industryflow.redisHost" . | quote }}
  REDIS_URL: {{ printf "redis://%s:%v/0" (include "industryflow.redisHost" .) .Values.infra.redis.port | quote }}
  MLFLOW_TRACKING_URI: {{ include "industryflow.mlflowUri" . | quote }}
  MLFLOW_S3_ENDPOINT_URL: {{ include "industryflow.minioEndpoint" . | quote }}
  # ML service URL the alert worker calls for ML inference + drift evaluation (ADR-0021).
  # Release-scoped so it matches the in-cluster Service DNS (the app default 'ml-service-api'
  # only resolves under compose, not here).
  ML_SERVICE_URL: {{ printf "http://%s-ml-service-api:%v" (include "industryflow.fullname" .) 8002 | quote }}
  {{- if .Values.notebookHub.enabled }}
  # The upload plane (ADR-0030). Both are gated on the notebook plane because the tracking gateway
  # IS the upload surface — it holds the only credential that may write the artifact store. Without
  # it there is nowhere to take a handle, so minting one would hand a caller a ticket to a door that
  # does not exist. A deployment without the gateway accepts no externally-authored models, and the
  # mint surface says so plainly rather than issuing something unusable.
  #
  # The store is named for its purpose rather than reusing REDIS_URL, matching how every other plane
  # names its own: what is in it is capabilities, and a service that only mints them should say so.
  # NOT the Redis feature store ADR-0023 rev 1 removed from ml_service — that was a second windowing
  # substrate and it stays gone. What is written here is a revocable, single-tenant handle and
  # nothing whose loss is worse than that (ADR-0015 dec 7).
  CAPABILITY_REDIS_URL: {{ printf "redis://%s:%v/0" (include "industryflow.redisHost" .) .Values.infra.redis.port | quote }}
  # Where an uploader takes a minted handle — advertised with it so a client need not know the
  # platform's topology. Release-scoped, like ML_SERVICE_URL above.
  UPLOAD_GATEWAY_URL: {{ printf "http://%s-notebook-tracking-gateway:%v" (include "industryflow.fullname" .) .Values.notebookHub.trackingGateway.port | quote }}
  {{- end }}
  # Spark S3A checkpoint endpoint (ADR-0006). Used only when CHECKPOINT_LOCATION is an s3a:// URI
  # (the scale-out path); the default local mode ignores it.
  MINIO_ENDPOINT: {{ include "industryflow.minioEndpoint" . | quote }}
  {{- if .Values.tls.db.enabled }}
  # DB TLS (ADR-0017): clients connect verify-full against the internal CA. The asyncpg/libpq
  # callers read these; ca.crt is mounted per-workload at tls.db.mountPath.
  DB_SSLMODE: {{ .Values.tls.db.sslmode | quote }}
  DB_SSLROOTCERT: {{ printf "%s/ca.crt" .Values.tls.db.mountPath | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
