{{- if .Values.ingress.enabled }}
{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "industryflow.fullname" . }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $name, $app := .Values.apps }}
        {{- if and $app.enabled $app.ingress }}
        - {{ $app.ingress.host }}
        {{- end }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range $name, $app := .Values.apps }}
    {{- if and $app.enabled $app.ingress }}
    - host: {{ $app.ingress.host }}
      http:
        paths:
          - path: {{ $app.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "industryflow.fullname" $root }}-{{ $name }}
                port:
                  number: {{ $app.port }}
    {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.mtls.enabled }}
---
# mTLS device-ingestion edge (ADR-0002 / ADR-0007): a dedicated Ingress that makes the
# ingress-nginx controller verify device client certificates against the device CA and
# forward the verified cert to ingestion-service (ssl-client-cert), realizing the single
# TLS edge of ADR-0009 dec 5.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "industryflow.fullname" . }}-ingest
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "{{ .Release.Namespace }}/{{ .Values.ingress.mtls.caSecret }}"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "{{ .Values.ingress.mtls.verifyDepth }}"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.mtls.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.mtls.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "industryflow.fullname" . }}-ingestion-service
                port:
                  number: {{ (index .Values.apps "ingestion-service").port }}
{{- end }}
