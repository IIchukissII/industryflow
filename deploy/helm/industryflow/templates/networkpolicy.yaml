{{- if and .Values.networkPolicy.enabled (index .Values.apps "ingestion-service").enabled }}
# Restrict ingestion-service ingress to the cluster TLS edge (the ingress controller) so the
# verified-identity headers cannot be spoofed by any other pod (ADR-0002 dec 3, ADR-0009 dec 5): the
# controller's pods, selected by namespace AND pod labels, not every pod of its namespace.
{{- $controllerPods := .Values.networkPolicy.ingressControllerPodLabels | default dict }}
{{- if not $controllerPods }}
{{- fail "networkPolicy.ingressControllerPodLabels is empty: the policy would admit every pod of the controller's namespace (ADR-0009 dec 5)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-ingestion-from-edge-only
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.ingressControllerNamespace is required" .Values.networkPolicy.ingressControllerNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $controllerPods | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ (index .Values.apps "ingestion-service").port }}
    {{- with (index .Values.apps "ingestion-service").metricsListener }}
    {{- $promPods := $.Values.observability.prometheusPodLabels | default dict }}
    {{- if not $promPods }}
    {{- fail "observability.prometheusPodLabels is empty: the policy would admit every pod of the monitoring namespace to ingestion's metrics listener" }}
    {{- end }}
    # The monitoring stack's Prometheus, to the metrics-only listener and nothing else.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "observability.monitoringNamespace is required" $.Values.observability.monitoringNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $promPods | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
---
# Least privilege (ADR-0002): ingestion is mTLS-only and stateless. Its only egress is to
# Kafka (produce) and DNS — it must NOT be able to reach TimescaleDB or Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-ingestion-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka brokers only.
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "kafka" "name" "kafka" "port" .Values.infra.kafka.port) | trim | nindent 4 }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (index .Values.apps "api-gateway").enabled }}
---
# Least privilege: the API gateway is a read path over TimescaleDB + Redis. It does not
# produce or consume Kafka, so it must NOT be able to reach the message bus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-api-gateway-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # TimescaleDB.
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "timescaledb" "name" "timescaledb" "port" .Values.infra.timescaledb.port) | trim | nindent 4 }}
    # Redis.
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "redis" "name" "redis" "port" .Values.infra.redis.port) | trim | nindent 4 }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.notebookHub.enabled }}
---
# Notebook single-user pods run untrusted, user-authored code (ADR-0011). Their egress is
# restricted to the hub API, the tenant-scoped data API and the mediators (SQL proxy, tracking
# gateway, cold broker, object store), plus DNS — no lateral reach to other services or tenants
# (ADR-0011 dec 7). The pods carry these labels from the spawner (identity.py).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-singleuser-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-singleuser
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The hub API: a single-user server registers, authenticates its user (OAuth) and reports
    # activity there. A forwarded identity is not honoured on this path without the SSO proxy's
    # secret (ADR-0014 dec 3), which the pod does not hold.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-hub
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.hub.port }}
    # The tenant-scoped data API only (ADR-0011 dec 4); per-tenant data scoping is enforced
    # server-side, not by reachability.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: {{ (index .Values.apps "api-gateway").port }}
    # The SQL access proxy only (ADR-0015) — never TimescaleDB directly. The kernel authenticates
    # with its SQL capability handle; tenant scoping is enforced by the proxy's SET ROLE, not here.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-sql-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.sqlProxy.port }}
    # The experiment-tracking gateway (ADR-0019): the kernel's MLflow client reaches it here to log
    # runs/register models; tenant namespacing is enforced by the gateway, not by reachability.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-tracking-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.trackingGateway.port }}
    {{- if .Values.coldExport.enabled }}
    # The cold-store broker (ADR-0025 dec 5): the kernel lists + requests pre-signed URLs here.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-cold-broker
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.coldBroker.port }}
    {{- end }}
    # The object store, for the pre-signed GET itself — both the tracking gateway (artifacts,
    # ADR-0019) and the cold broker (Parquet, ADR-0025) 307-redirect the kernel straight here so the
    # bytes move directly. The URLs are signed + tenant-scoped; the pod holds no object-store
    # credential, so reachability alone grants nothing.
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "minio" "name" "minio" "port" .Values.infra.minio.apiPort) | trim | nindent 4 }}
---
# Who may reach the hub (ADR-0014 dec 3): chp (routing browser traffic) and the single-user pods
# (the hub API they need). The SSO proxy's secret is the control on the login route; this narrows
# reachability to those two callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-hub-ingress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-hub
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-proxy
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-singleuser
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.hub.port }}
---
# Who may reach chp: its public port only from the SSO proxy (the one browser entry, ADR-0014
# dec 3), its API port only from the hub, which configures its routes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-proxy-ingress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-sso
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-hub
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8001
---
{{- if .Values.notebookHub.enabled }}
# The tracking gateway reaches only MLflow (proxy the REST API), Redis (capability lookup) and the
# object store (artifact list; pre-signing is offline), plus DNS. It is the sole bridge between
# untrusted kernels and MLflow + the artifact store (ADR-0019).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-tracking-gateway-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-tracking-gateway
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "redis" "name" "redis" "port" .Values.infra.redis.port) | trim | nindent 4 }}
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "mlflow" "name" "mlflow" "port" .Values.infra.mlflow.port) | trim | nindent 4 }}
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "minio" "name" "minio" "port" .Values.infra.minio.apiPort) | trim | nindent 4 }}
{{- end }}
---
{{- if .Values.coldExport.enabled }}
# The cold-store broker reaches only Redis (capability lookup) and the object store (list objects),
# plus DNS. Pre-signing itself is an offline crypto op. It is the sole bridge between untrusted
# kernels and the cold layer's object store (ADR-0025 dec 5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-cold-broker-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-cold-broker
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "redis" "name" "redis" "port" .Values.infra.redis.port) | trim | nindent 4 }}
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "minio" "name" "minio" "port" .Values.infra.minio.apiPort) | trim | nindent 4 }}
{{- end }}
---
# The SQL proxy reaches only TimescaleDB (privileged login) and Redis (capability lookup), plus
# DNS. It is the sole bridge between untrusted kernels and the database (ADR-0015).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-sql-proxy-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-sql-proxy
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "timescaledb" "name" "timescaledb" "port" .Values.infra.timescaledb.port) | trim | nindent 4 }}
    {{- include "industryflow.egressTo" (dict "ctx" . "dep" "redis" "name" "redis" "port" .Values.infra.redis.port) | trim | nindent 4 }}
{{- end }}
