{{- if and .Values.networkPolicy.enabled (index .Values.apps "ingestion-service").enabled }}
# Restrict ingestion-service ingress to the cluster TLS edge (the ingress controller) so the
# verified-identity headers cannot be spoofed by any other pod (ADR-0002 dec 3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-ingestion-from-edge-only
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - protocol: TCP
          port: {{ (index .Values.apps "ingestion-service").port }}
---
# Least privilege (ADR-0002): ingestion is mTLS-only and stateless. Its only egress is to
# Kafka (produce) and DNS — it must NOT be able to reach TimescaleDB or Redis, even though
# the shared Secret hands every pod the DB credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-ingestion-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka brokers only.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: {{ .Values.infra.kafka.port }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (index .Values.apps "api-gateway").enabled }}
---
# Least privilege: the API gateway is a read path over TimescaleDB + Redis. It does not
# produce or consume Kafka, so it must NOT be able to reach the message bus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-api-gateway-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # TimescaleDB.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: timescaledb
      ports:
        - protocol: TCP
          port: {{ .Values.infra.timescaledb.port }}
    # Redis.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: {{ .Values.infra.redis.port }}
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.notebookHub.enabled }}
---
# Notebook single-user pods run untrusted, user-authored code (ADR-0011). Their egress is
# restricted to the tenant-scoped data API, the SQL proxy, and DNS only — no lateral reach to
# other services or tenants (ADR-0011 dec 7). The experiment-tracking gateway is added here when
# that phase lands. The pods carry these labels from the spawner (identity.py).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-singleuser-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-singleuser
  policyTypes:
    - Egress
  egress:
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The tenant-scoped data API only (ADR-0011 dec 4); per-tenant data scoping is enforced
    # server-side, not by reachability.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: {{ (index .Values.apps "api-gateway").port }}
    # The SQL access proxy only (ADR-0015) — never TimescaleDB directly. The kernel authenticates
    # with its SQL capability handle; tenant scoping is enforced by the proxy's SET ROLE, not here.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-sql-proxy
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.sqlProxy.port }}
    {{- if .Values.coldExport.enabled }}
    # The cold-store broker (ADR-0025 dec 5): the kernel lists + requests pre-signed URLs here.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: notebook-cold-broker
      ports:
        - protocol: TCP
          port: {{ .Values.notebookHub.coldBroker.port }}
    {{- if .Values.infra.minio.inCluster }}
    # The object store, for the pre-signed GET itself — the broker 307-redirects the kernel here so
    # the Parquet bytes move directly (ADR-0025 dec 1). The URL is signed + prefix-scoped; the pod
    # holds no object-store credential, so reachability alone grants nothing.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: {{ .Values.infra.minio.apiPort }}
    {{- end }}
    {{- end }}
---
{{- if .Values.coldExport.enabled }}
# The cold-store broker reaches only Redis (capability lookup) and the object store (list objects),
# plus DNS. Pre-signing itself is an offline crypto op. It is the sole bridge between untrusted
# kernels and the cold layer's object store (ADR-0025 dec 5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-cold-broker-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-cold-broker
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: {{ .Values.infra.redis.port }}
    {{- if .Values.infra.minio.inCluster }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: {{ .Values.infra.minio.apiPort }}
    {{- end }}
{{- end }}
---
# The SQL proxy reaches only TimescaleDB (privileged login) and Redis (capability lookup), plus
# DNS. It is the sole bridge between untrusted kernels and the database (ADR-0015).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "industryflow.fullname" . }}-notebook-sql-proxy-egress
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notebook-sql-proxy
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.infra.timescaledb.inCluster }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: timescaledb
      ports:
        - protocol: TCP
          port: {{ .Values.infra.timescaledb.port }}
    {{- end }}
    {{- if .Values.infra.redis.inCluster }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: {{ .Values.infra.redis.port }}
    {{- end }}
{{- end }}
