{{- if .Values.infra.minio.inCluster }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" . }}-minio
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.infra.minio.apiPort }}
      targetPort: 9000
    - name: console
      port: {{ .Values.infra.minio.consolePort }}
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "industryflow.fullname" . }}-minio
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: minio
spec:
  serviceName: {{ include "industryflow.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.infra.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.secretName" . }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.secretName" . }}
                  key: MINIO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.infra.minio.storage }}
{{- end }}
