#
# Notebook SQL access proxy (ADR-0015). Authoring kernels connect with a normal Postgres driver,
# presenting their SQL capability handle as the password; the proxy resolves it, logs in to
# TimescaleDB as that tenant's own login (tenant_sqlproxy_<uuid>, confined to the tenant by the
# database — enrolling its verifier through the `notebook_sql_proxy` role on first use), SET ROLEs
# into the tenant's read-only role, and relays. The single-user egress NetworkPolicy
# (networkpolicy.yaml) permits the kernel→proxy hop. One replica: cancellation keys are
# process-local, so a kernel's CancelRequest must reach the replica holding its session.
{{- if .Values.notebookHub.enabled }}
{{- $fullname := include "industryflow.fullname" . }}
{{- $svc := printf "%s-notebook-sql-proxy" $fullname }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-sql-proxy
spec:
  selector:
    app.kubernetes.io/name: notebook-sql-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: pgwire
      port: {{ .Values.notebookHub.sqlProxy.port }}
      targetPort: pgwire
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: notebook-sql-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-sql-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notebook-sql-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.securityContext.enabled }}
      # Non-root (the image runs as uid 10001) + seccomp — admission-policy friendly.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      initContainers:
        {{- include "industryflow.schemaReadyInitContainer" (dict "ctx" . "user" "notebook_sql_proxy" "workload" "notebook-sql-proxy" "passwordKey" "NOTEBOOK_SQL_PROXY_DB_PASSWORD") | nindent 8 }}
      containers:
        - name: sql-proxy
          image: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.notebookHub.sqlProxy.image "tag" .Values.image.tag "digest" .Values.notebookHub.sqlProxy.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: pgwire
              containerPort: {{ .Values.notebookHub.sqlProxy.port }}
          env:
            - name: SQL_PROXY_HOST
              value: "0.0.0.0"
            - name: SQL_PROXY_PORT
              value: {{ .Values.notebookHub.sqlProxy.port | quote }}
            - name: SQL_PROXY_REDIS_URL
              value: {{ printf "redis://%s:%v/0" (include "industryflow.redisHost" .) .Values.infra.redis.port | quote }}
            - name: SQL_PROXY_DB_HOST
              value: {{ include "industryflow.dbHost" . | quote }}
            - name: SQL_PROXY_DB_PORT
              value: {{ .Values.infra.timescaledb.port | quote }}
            - name: SQL_PROXY_DB_NAME
              value: {{ .Values.infra.timescaledb.database | quote }}
            # The enrolment role created by 13-notebook-sql-proxy-role.sh (a member of nothing).
            - name: SQL_PROXY_DB_USER
              value: "notebook_sql_proxy"
            - name: SQL_PROXY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-sql-proxy") }}
                  key: NOTEBOOK_SQL_PROXY_DB_PASSWORD
            # Derives each per-tenant login's password; never given to the database.
            - name: SQL_PROXY_TENANT_LOGIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "notebook-sql-proxy") }}
                  key: NOTEBOOK_SQL_PROXY_TENANT_KEY
            # Upstream TLS to TimescaleDB (ADR-0017): verify the server cert against the same
            # internal CA every DB client trusts, mounted below at tls.db.mountPath.
            {{- if .Values.tls.db.enabled }}
            - name: SQL_PROXY_DB_SSLMODE
              value: {{ .Values.tls.db.sslmode | quote }}
            - name: SQL_PROXY_DB_SSLROOTCERT
              value: {{ printf "%s/ca.crt" .Values.tls.db.mountPath | quote }}
            {{- else }}
            - name: SQL_PROXY_DB_SSLMODE
              value: "disable"
            {{- end }}
          {{- if .Values.tls.db.enabled }}
          volumeMounts:
            - name: db-ca
              mountPath: {{ printf "%s/ca.crt" .Values.tls.db.mountPath }}
              subPath: ca.crt
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.notebookHub.sqlProxy.resources | nindent 12 }}
      volumes:
        {{- include "industryflow.schemaReadyVolumes" . | nindent 8 }}
        {{- if .Values.tls.db.enabled }}
        - name: db-ca
          secret:
            secretName: {{ .Values.tls.db.secretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
{{- end }}
