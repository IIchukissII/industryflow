{{- $root := . -}}
{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
{{- $sc := $root.Values.securityContext }}
{{- /* Per-app opt-out (apps.<name>.hardened=false) for images not yet non-root-ready (e.g. frontend nginx). */}}
{{- $scOn := $sc.enabled }}
{{- if hasKey $app "hardened" }}{{- $scOn = and $sc.enabled $app.hardened }}{{- end }}
{{- $rorfs := $sc.readOnlyRootFilesystem }}
{{- if hasKey $app "readOnlyRootFilesystem" }}{{- $rorfs = $app.readOnlyRootFilesystem }}{{- end }}
{{- $wpaths := default $sc.writablePaths $app.writablePaths }}
{{- $hasPVC := and $app.persistence $app.persistence.enabled }}
{{- $writableMounts := and $scOn $rorfs (gt (len $wpaths) 0) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" $root }}-{{ $name }}
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ $app.replicas | default 1 }}
  {{- if and $app.persistence $app.persistence.enabled }}
  # Single-writer ReadWriteOnce checkpoint volume — Recreate avoids two pods racing for it
  # during a rollout (a rolling update would deadlock on the RWO claim).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $scOn }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $app.runAsUser | default $sc.runAsUser }}
        runAsGroup: {{ $app.runAsGroup | default $sc.runAsGroup }}
        fsGroup: {{ $app.fsGroup | default $sc.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "industryflow.image" (dict "registry" $root.Values.image.registry "image" $app.image "tag" $root.Values.image.tag "digest" $app.digest) | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $scOn }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $rorfs }}
            capabilities:
              drop: ["ALL"]
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "industryflow.fullname" $root }}-config
            {{- if $app.secretKeys }}
            - secretRef:
                name: {{ include "industryflow.workloadSecretName" (dict "ctx" $root "workload" $name) }}
            {{- end }}
          {{- if has "MINIO_ACCESS_KEY" ($app.secretKeys | default list) }}
          {{- /* MinIO creds are consumed as S3/AWS creds (e.g. the MLflow client loading model artifacts). */}}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" $root "workload" $name) }}
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" $root "workload" $name) }}
                  key: MINIO_SECRET_KEY
          {{- end }}
          {{- if $app.port }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          {{- end }}
          {{- if $app.probe }}
          livenessProbe:
            httpGet:
              path: {{ $app.probe.path }}
              port: {{ $app.probe.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ $app.probe.path }}
              port: {{ $app.probe.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          {{- with $app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $hasPVC $writableMounts }}
          volumeMounts:
            {{- if $hasPVC }}
            - name: data
              mountPath: {{ $app.persistence.mountPath }}
            {{- end }}
            {{- if $writableMounts }}
            {{- /* Read-only root FS still needs writable scratch dirs (e.g. /tmp). */}}
            {{- range $i, $p := $wpaths }}
            - name: writable-{{ $i }}
              mountPath: {{ $p }}
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or $hasPVC $writableMounts }}
      volumes:
        {{- if $hasPVC }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "industryflow.fullname" $root }}-{{ $name }}-data
        {{- end }}
        {{- if $writableMounts }}
        {{- range $i, $p := $wpaths }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
        {{- end }}
      {{- end }}
{{- if and $app.persistence $app.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "industryflow.fullname" $root }}-{{ $name }}-data
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $app.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $app.persistence.size }}
{{- end }}
{{- if $app.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" $root }}-{{ $name }}
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: {{ $app.port }}
{{- end }}
{{- end }}
{{- end }}
