{{- if .Values.infra.timescaledb.inCluster }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" . }}-timescaledb
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: timescaledb
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.infra.timescaledb.port }}
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "industryflow.fullname" . }}-timescaledb
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: timescaledb
spec:
  serviceName: {{ include "industryflow.fullname" . }}-timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll the pod when the init scripts change. (NB: the entrypoint only re-runs them on
        # an EMPTY data volume; on an existing volume this restart is a no-op for init.)
        checksum/db-init: {{ include (print $.Template.BasePath "/configmap-db-init.yaml") . | sha256sum }}
        checksum/pg-hba: {{ include (print $.Template.BasePath "/configmap-pg-hba.yaml") . | sha256sum }}
    spec:
      {{- if .Values.tls.db.enabled }}
      initContainers:
        # Stage the server cert into a postgres-owned dir with private-key perms. postgres refuses
        # to start if ssl_key_file is group/world-readable, but a Secret volume mounts root-owned
        # 0644 — so copy it out, chmod 0600, and chown to the postgres uid (mirrors the compose
        # db-cert-init one-shot; ADR-0017).
        - name: db-cert-init
          image: {{ .Values.tls.db.initImage | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              cp /tls/tls.crt /certs/db.crt
              cp /tls/tls.key /certs/db.key
              cp /tls/ca.crt  /certs/ca.crt
              chmod 0644 /certs/db.crt /certs/ca.crt
              chmod 0600 /certs/db.key
              chown {{ .Values.tls.db.postgresUser }}:{{ .Values.tls.db.postgresUser }} /certs/db.crt /certs/db.key /certs/ca.crt
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: db-tls-secret
              mountPath: /tls
              readOnly: true
            - name: db-certs
              mountPath: /certs
      {{- end }}
      containers:
        - name: timescaledb
          image: {{ .Values.infra.timescaledb.image | quote }}
          # Use the hardened pg_hba.conf (mounted below) instead of the image's permissive default.
          {{- if .Values.tls.db.enabled }}
          # TLS + SCRAM (ADR-0017): the hardened pg_hba is hostssl+scram, so ssl must be on and
          # passwords stored as scram-sha-256. Passed as -c flags (the canonical postgresql.conf
          # lines) so the image's own defaults/entrypoint stay intact.
          args:
            - postgres
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/certs/db.crt
            - -c
            - ssl_key_file=/etc/postgresql/certs/db.key
            - -c
            - ssl_ca_file=/etc/postgresql/certs/ca.crt
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - password_encryption=scram-sha-256
          {{- else }}
          args: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.infra.timescaledb.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "timescaledb") }}
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "timescaledb") }}
                  key: DB_PASSWORD
            {{- /* Per-service role passwords consumed by 00-create-roles.sh at first init. */}}
            {{- $tsSecret := include "industryflow.workloadSecretName" (dict "ctx" . "workload" "timescaledb") }}
            {{- $roleKeys := list "API_GATEWAY_DB_PASSWORD" "SPARK_STREAMING_DB_PASSWORD" "ALERT_SERVICE_DB_PASSWORD" "ML_SERVICE_DB_PASSWORD" "MLFLOW_DB_PASSWORD" "METRICS_DB_PASSWORD" }}
            {{- /* The notebook SQL proxy role (ADR-0015) is created at init from this password. */}}
            {{- if .Values.notebookHub.enabled }}{{ $roleKeys = append $roleKeys "NOTEBOOK_SQL_PROXY_DB_PASSWORD" }}{{- end }}
            {{- range $key := $roleKeys }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $tsSecret }}
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: pg-hba
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
            {{- if .Values.tls.db.enabled }}
            - name: db-certs
              mountPath: /etc/postgresql/certs
              readOnly: true
            {{- end }}
          {{- with .Values.infra.timescaledb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: db-init
          configMap:
            name: {{ include "industryflow.fullname" . }}-db-init
            # Executable so the postgres entrypoint runs 00-create-roles.sh as a subprocess
            # (rather than sourcing it), matching the compose bind-mount behaviour.
            defaultMode: 0755
        - name: pg-hba
          configMap:
            name: {{ include "industryflow.fullname" . }}-pg-hba
        {{- if .Values.tls.db.enabled }}
        - name: db-tls-secret
          secret:
            secretName: {{ .Values.tls.db.secretName | quote }}
        - name: db-certs
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.infra.timescaledb.storage }}
{{- end }}
