#
# Infrastructure agent (ADR-0045, ADR-0046). A receiver for the operator's Alertmanager: it reads the
# operator's Prometheus, Loki and Alertmanager, has a model write a note over an API, and writes the
# note to Loki. It holds the webhook secret and the model key only: no database, broker, object-store
# or dashboard credential. Off by default (observability.opsAgent.enabled).
# REFERENCE: renders via `helm template`; the agent itself is compose/box-validated.
{{- $agent := .Values.observability.opsAgent }}
{{- if $agent.enabled }}
{{- if and (not .Values.secrets.existingSecret) (lt (len (.Values.secrets.data.OPS_AGENT_WEBHOOK_SECRET | default "")) 32) }}
{{- fail "observability.opsAgent.enabled needs secrets.data.OPS_AGENT_WEBHOOK_SECRET of at least 32 characters (ADR-0046 dec 1)" }}
{{- end }}
{{- if not (and $agent.prometheusUrl $agent.lokiUrl $agent.alertmanagerUrl) }}
{{- fail "observability.opsAgent.enabled needs prometheusUrl, lokiUrl and alertmanagerUrl: the operator's monitoring stack (ADR-0016 dec 4)" }}
{{- end }}
{{- $fullname := include "industryflow.fullname" . }}
{{- $svc := printf "%s-ops-agent" $fullname }}
{{- $secret := include "industryflow.workloadSecretName" (dict "ctx" . "workload" "ops-agent") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: ops-agent
spec:
  selector:
    app.kubernetes.io/name: ops-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $agent.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: ops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ops-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ops-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: ops-agent
          image: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" $agent.image "tag" .Values.image.tag "digest" $agent.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $agent.port }}
          env:
            - name: OPS_AGENT_PORT
              value: {{ $agent.port | quote }}
            - name: OPS_AGENT_PROMETHEUS_URL
              value: {{ $agent.prometheusUrl | quote }}
            - name: OPS_AGENT_LOKI_URL
              value: {{ $agent.lokiUrl | quote }}
            - name: OPS_AGENT_ALERTMANAGER_URL
              value: {{ $agent.alertmanagerUrl | quote }}
            - name: OPS_AGENT_LOG_SELECTOR
              value: {{ $agent.logSelector | default (printf "{namespace=\"%s\", app=\"%%s\"}" .Release.Namespace) | quote }}
            - name: OPS_AGENT_MODEL_PROVIDER
              value: {{ $agent.modelProvider | quote }}
            - name: OPS_AGENT_MODEL
              value: {{ $agent.model | quote }}
            - name: OPS_AGENT_MODEL_BASE_URL
              value: {{ $agent.modelBaseUrl | quote }}
            - name: OPS_AGENT_EFFORT
              value: {{ $agent.effort | quote }}
            {{- range $key := list "OPS_AGENT_WEBHOOK_SECRET" "OPS_AGENT_MODEL_API_KEY" "ANTHROPIC_API_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml $agent.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if not .Values.secrets.existingSecret }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" . "workload" "ops-agent" "keys" (list "OPS_AGENT_WEBHOOK_SECRET" "OPS_AGENT_MODEL_API_KEY" "ANTHROPIC_API_KEY")) }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Only the operator's monitoring namespace reaches the receiver; the agent reaches DNS, that namespace
# and the model endpoint's ports, and nothing in the platform (ADR-0046 dec 7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $svc }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops-agent
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $agent.monitoringNamespace }}
      ports:
        - port: {{ $agent.port }}
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $agent.monitoringNamespace }}
    - ports:
        {{- range $agent.modelPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
{{- end }}
{{- end }}
