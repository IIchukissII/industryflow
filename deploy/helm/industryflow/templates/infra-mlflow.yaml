{{- if .Values.infra.mlflow.inCluster }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" . }}-mlflow
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.infra.mlflow.port }}
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" . }}-mlflow
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: mlflow
          image: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.infra.mlflow.image "tag" .Values.image.tag "digest" .Values.infra.mlflow.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            # mlflow keeps some local state; leave the root FS writable here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          {{- end }}
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "industryflow.fullname" . }}-config
            - secretRef:
                name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
          env:
            # MLflow stores artifacts in MinIO over the S3 API — boto reads AWS_* names.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
                  key: MINIO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          {{- if .Values.tls.db.enabled }}
          # CA for the Postgres backend store over TLS (ADR-0017). The backend-store-uri must
          # carry ?sslmode=verify-full&sslrootcert=<mountPath>/ca.crt (as the compose path does).
          volumeMounts:
            - name: db-ca
              mountPath: {{ printf "%s/ca.crt" .Values.tls.db.mountPath }}
              subPath: ca.crt
              readOnly: true
          {{- end }}
      {{- if .Values.tls.db.enabled }}
      volumes:
        - name: db-ca
          secret:
            secretName: {{ .Values.tls.db.secretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
{{- end }}
