{{- if .Values.infra.mlflow.inCluster }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" . }}-mlflow
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.infra.mlflow.port }}
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" . }}-mlflow
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mlflow
          image: "{{ .Values.image.registry }}/{{ .Values.infra.mlflow.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "industryflow.fullname" . }}-config
            - secretRef:
                name: {{ include "industryflow.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
{{- end }}
