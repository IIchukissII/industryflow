{{- if .Values.infra.mlflow.inCluster }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" . }}-mlflow
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.infra.mlflow.port }}
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" . }}-mlflow
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.securityContext.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: mlflow
          image: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.infra.mlflow.image "tag" .Values.image.tag "digest" .Values.infra.mlflow.digest) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            # mlflow keeps some local state; leave the root FS writable here.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          {{- end }}
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "industryflow.fullname" . }}-config
            - secretRef:
                name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
          # The same server flags compose runs: the backend store in the DB (not the image's local
          # default, which a pod restart erases), artifacts proxied to the object store, and clients
          # handed `mlflow-artifacts:` so they never need an object-store credential (ADR-0019).
          # $(VAR)s are expanded by Kubernetes from the env below and the envFrom sources; no secret
          # goes in the args (tests/config_guards/test_no_secret_on_argv.py).
          args:
            - mlflow
            - server
            - --backend-store-uri
            - {{ printf "postgresql://$(MLFLOW_DB_USER)@%s:%v/mlflow" (include "industryflow.dbHost" .) .Values.infra.timescaledb.port | quote }}
            - --default-artifact-root
            - mlflow-artifacts:/
            - --artifacts-destination
            - {{ printf "s3://%s" .Values.notebookHub.trackingGateway.artifactBucket | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --allowed-hosts
            - "*"
            - --workers
            - {{ .Values.infra.mlflow.workers | quote }}
          env:
            # MLflow's GenAI job runner and its queue consumers: nothing here submits a job.
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            # The backend password reaches libpq here, never in the args (where `ps` shows it).
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
                  key: MLFLOW_DB_PASSWORD
            # The artifact-bucket principal (read-only on that bucket) — boto reads AWS_* names.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
                  key: MLFLOW_STORE_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "mlflow") }}
                  key: MLFLOW_STORE_SECRET_KEY
            {{- if .Values.tls.db.enabled }}
            # libpq reads these for the backend store's TLS (ADR-0017), as in compose.
            - name: PGSSLMODE
              value: {{ .Values.tls.db.sslmode | quote }}
            - name: PGSSLROOTCERT
              value: {{ printf "%s/ca.crt" .Values.tls.db.mountPath | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          {{- if .Values.tls.db.enabled }}
          # CA for the Postgres backend store over TLS (ADR-0017), named by PGSSLROOTCERT above.
          volumeMounts:
            - name: db-ca
              mountPath: {{ printf "%s/ca.crt" .Values.tls.db.mountPath }}
              subPath: ca.crt
              readOnly: true
          {{- end }}
      {{- if .Values.tls.db.enabled }}
      volumes:
        - name: db-ca
          secret:
            secretName: {{ .Values.tls.db.secretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
{{- end }}
