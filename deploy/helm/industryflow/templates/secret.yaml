{{- if .Values.secrets.create }}
# NOTE: placeholder values only. In real deployments supply these via a secrets
# backend (SealedSecrets/Vault/CSI) and set secrets.create=false with an
# existingSecret, or override secrets.data at install time. See ADR-0009.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "industryflow.secretName" . }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
