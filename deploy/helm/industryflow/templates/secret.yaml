{{- if .Values.secrets.create }}
{{- $root := . }}
{{- /*
  Fail-closed: refuse to render if any secret value is still a placeholder, so default
  credentials can never reach a cluster. Disable only for non-prod renders (CI does).
*/}}
{{- if and .Values.secrets.failOnPlaceholders (not .Values.secrets.existingSecret) }}
{{- range $k, $v := .Values.secrets.data }}
{{- if or (hasPrefix "CHANGE_ME" ($v | toString)) (hasPrefix "changeme" ($v | toString)) }}
{{- fail (printf "secrets.data.%s is still a placeholder (%q). Override every secret before deploy (SealedSecrets/Vault/CSI or --set), or set secrets.failOnPlaceholders=false for non-prod renders." $k $v) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  Per-workload scoped Secrets — each workload gets only the keys it needs (apps.<name>.secretKeys
  for app Deployments; explicit key lists for infra), instead of one bundle handed to every pod.
  Skipped entirely when an existingSecret is supplied (the operator scopes at their backend).
*/}}
{{- if not .Values.secrets.existingSecret }}
{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled $app.secretKeys }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" $name "keys" $app.secretKeys) }}
{{- end }}
{{- end }}
{{- if .Values.infra.timescaledb.inCluster }}
{{- $dbKeys := list "DB_USER" "DB_PASSWORD" "API_GATEWAY_DB_PASSWORD" "SPARK_STREAMING_DB_PASSWORD" "ALERT_SERVICE_DB_PASSWORD" "ML_SERVICE_DB_PASSWORD" "MLFLOW_DB_PASSWORD" "METRICS_DB_PASSWORD" }}
{{- /* The notebook SQL proxy role is created at DB init from this password (ADR-0015). */}}
{{- if .Values.notebookHub.enabled }}{{ $dbKeys = append $dbKeys "NOTEBOOK_SQL_PROXY_DB_PASSWORD" }}{{- end }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "timescaledb" "keys" $dbKeys) }}
{{- end }}
{{- if .Values.observability.exporters.postgres.enabled }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "postgres-exporter" "keys" (list "METRICS_DB_PASSWORD")) }}
{{- end }}
{{- if .Values.infra.mlflow.inCluster }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "mlflow" "keys" (list "MLFLOW_DB_PASSWORD" "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY")) }}
{{- end }}
{{- if .Values.infra.minio.inCluster }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "minio" "keys" (list "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY")) }}
{{- end }}
{{- if .Values.backup.enabled }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "db-backup" "keys" (list "DB_USER" "DB_PASSWORD" "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY")) }}
{{- end }}
{{- if .Values.notebookHub.enabled }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-hub" "keys" (list "CONFIGPROXY_AUTH_TOKEN" "JUPYTERHUB_COOKIE_SECRET" "JUPYTERHUB_CRYPT_KEY")) }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-sql-proxy" "keys" (list "NOTEBOOK_SQL_PROXY_DB_PASSWORD")) }}
{{- end }}
{{- end }}
{{- end }}
