{{- if .Values.secrets.create }}
{{- $root := . }}
{{- /*
  Fail-closed: refuse to render if any secret value is still a placeholder, so default
  credentials can never reach a cluster. Disable only for non-prod renders (CI does).
*/}}
{{- if and .Values.secrets.failOnPlaceholders (not .Values.secrets.existingSecret) }}
{{- range $k, $v := .Values.secrets.data }}
{{- if or (hasPrefix "CHANGE_ME" ($v | toString)) (hasPrefix "changeme" ($v | toString)) }}
{{- fail (printf "secrets.data.%s is still a placeholder (%q). Override every secret before deploy (SealedSecrets/Vault/CSI or --set), or set secrets.failOnPlaceholders=false for non-prod renders." $k $v) }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  Per-workload scoped Secrets — each workload gets only the keys it needs (apps.<name>.secretKeys
  for app Deployments; explicit key lists for infra), instead of one bundle handed to every pod.
  Skipped entirely when an existingSecret is supplied (the operator scopes at their backend).
*/}}
{{- if not .Values.secrets.existingSecret }}
{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled $app.secretKeys }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" $name "keys" $app.secretKeys) }}
{{- end }}
{{- end }}
{{- if .Values.infra.timescaledb.inCluster }}
{{- /* The superuser plus every role password the DB creates at init — the same list the
       StatefulSet passes into the container (industryflow.timescaledbRoleKeys). */}}
{{- $dbKeys := concat (list "DB_USER" "DB_PASSWORD") (splitList " " (include "industryflow.timescaledbRoleKeys" .)) }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "timescaledb" "keys" $dbKeys) }}
{{- end }}
{{- if .Values.observability.exporters.postgres.enabled }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "postgres-exporter" "keys" (list "METRICS_DB_PASSWORD")) }}
{{- end }}
{{- if .Values.infra.mlflow.inCluster }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "mlflow" "keys" (list "MLFLOW_DB_PASSWORD" "MLFLOW_STORE_ACCESS_KEY" "MLFLOW_STORE_SECRET_KEY")) }}
{{- end }}
{{- if .Values.infra.minio.inCluster }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "minio" "keys" (list "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY")) }}
{{- /* The bootstrap Job: the root key to create principals, and every principal it creates. */}}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "minio-init" "keys" (concat (list "MINIO_ACCESS_KEY" "MINIO_SECRET_KEY") (splitList " " (include "industryflow.objectStorePrincipalKeys" .)))) }}
{{- end }}
{{- if .Values.backup.enabled }}
{{- /* The backup bucket's own principal (minio-init.sh), never the object store's root key. */}}
{{- $backupKeys := list "DB_USER" "DB_PASSWORD" "BACKUP_STORE_ACCESS_KEY" "BACKUP_STORE_SECRET_KEY" }}
{{- /* The cold-layer mirror reads the cold bucket with the read-only cold principal (ADR-0025). */}}
{{- if and .Values.coldExport.enabled .Values.backup.cold.enabled }}{{ $backupKeys = concat $backupKeys (list "COLD_READ_ACCESS_KEY" "COLD_READ_SECRET_KEY") }}{{- end }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "db-backup" "keys" $backupKeys) }}
{{- end }}
{{- if .Values.coldExport.enabled }}
{{- /* The exporter authenticates to the DB as cold_export_user and to the object store with its
       write-scoped principal — never the root MinIO keys (ADR-0025 dec 5/11). */}}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "cold-export" "keys" (list "COLD_EXPORT_DB_PASSWORD" "COLD_STORE_ACCESS_KEY" "COLD_STORE_SECRET_KEY")) }}
{{- end }}
{{- if .Values.notebookHub.enabled }}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-hub" "keys" (list "CONFIGPROXY_AUTH_TOKEN" "JUPYTERHUB_COOKIE_SECRET" "JUPYTERHUB_CRYPT_KEY" "NOTEBOOK_SSO_PROXY_SECRET")) }}
---
{{- /* The SSO proxy's credential to the hub (ADR-0014 dec 3): held by the proxy and the hub only. */}}
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-sso" "keys" (list "NOTEBOOK_SSO_PROXY_SECRET")) }}
---
{{- /* The tenant-login key is the proxy's alone: it derives every per-tenant SQL login's password,
       and the database (which holds only verifiers) never receives it. */}}
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-sql-proxy" "keys" (list "NOTEBOOK_SQL_PROXY_DB_PASSWORD" "NOTEBOOK_SQL_PROXY_TENANT_KEY")) }}
{{- /* The tracking gateway (ADR-0019) holds its own artifact-bucket principal — never the root
       key, never in the kernel. */}}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-tracking-gateway" "keys" (list "TRACKING_STORE_ACCESS_KEY" "TRACKING_STORE_SECRET_KEY")) }}
{{- if .Values.coldExport.enabled }}
{{- /* The cold-store broker (ADR-0025 read side) authenticates to the object store with the
       read-only cold principal — never the write principal or the root keys. */}}
---
{{ include "industryflow.scopedSecret" (dict "ctx" $root "workload" "notebook-cold-broker" "keys" (list "COLD_READ_ACCESS_KEY" "COLD_READ_SECRET_KEY")) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
