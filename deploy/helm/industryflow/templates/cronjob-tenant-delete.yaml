{{- if .Values.tenantDelete.enabled }}
{{- /*
  Tenant deletion (ADR-0033 dec 4): one pass over the requested deletions. Each tenant is removed
  store by store and each removal recorded, so a failed pass resumes where it stopped; the database
  is emptied last. It authenticates as tenant_delete_user, which acts only through the deletion
  functions of 26-company-deletion-job.sql.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "industryflow.fullname" . }}-tenant-delete
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: tenant-delete
    app.kubernetes.io/component: lifecycle
spec:
  schedule: {{ .Values.tenantDelete.schedule | quote }}
  # One pass at a time; the job's own lock makes an overlap a no-op as well.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tenant-delete
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.securityContext.enabled }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsGroup: {{ .Values.securityContext.runAsGroup }}
            fsGroup: {{ .Values.securityContext.fsGroup }}
            seccompProfile:
              type: RuntimeDefault
          {{- end }}
          initContainers:
            {{- include "industryflow.schemaReadyInitContainer" (dict "ctx" . "user" "tenant_delete_user" "workload" "tenant-delete" "passwordKey" "TENANT_DELETE_DB_PASSWORD") | nindent 12 }}
          containers:
            - name: tenant-delete
              image: {{ include "industryflow.image" (dict "registry" .Values.image.registry "image" .Values.tenantDelete.image "tag" .Values.image.tag "digest" .Values.tenantDelete.digest) | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- if .Values.securityContext.enabled }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              {{- end }}
              env:
                - name: TIMESCALEDB_HOST
                  value: {{ include "industryflow.dbHost" . | quote }}
                - name: TIMESCALEDB_PORT
                  value: {{ .Values.infra.timescaledb.port | quote }}
                - name: TIMESCALEDB_DB
                  value: "industryflow"
                - name: TENANT_DELETE_DB_USER
                  value: "tenant_delete_user"
                - name: TENANT_DELETE_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "tenant-delete") }}
                      key: TENANT_DELETE_DB_PASSWORD
                - name: TENANT_DELETE_REDIS_URL
                  value: {{ printf "redis://%s:%v/0" (include "industryflow.redisHost" .) .Values.infra.redis.port | quote }}
                {{- if .Values.coldExport.enabled }}
                # The cold layer, with its list-and-delete principal (ADR-0025 dec 14).
                - name: TENANT_DELETE_COLD_ENDPOINT
                  value: {{ .Values.coldExport.store.endpoint | default (include "industryflow.minioEndpoint" .) | quote }}
                - name: TENANT_DELETE_COLD_BUCKET
                  value: {{ .Values.coldExport.store.bucket | quote }}
                - name: TENANT_DELETE_COLD_REGION
                  value: {{ .Values.coldExport.store.region | quote }}
                - name: TENANT_DELETE_COLD_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "tenant-delete") }}
                      key: TENANT_DELETE_COLD_ACCESS_KEY
                - name: TENANT_DELETE_COLD_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "tenant-delete") }}
                      key: TENANT_DELETE_COLD_SECRET_KEY
                {{- end }}
                {{- if .Values.notebookHub.enabled }}
                # The tracking store, through the tracking gateway's operator plane (ADR-0033 dec 4).
                - name: TENANT_DELETE_TRACKING_URL
                  value: {{ printf "http://%s-notebook-tracking-gateway:%v" (include "industryflow.fullname" .) .Values.notebookHub.trackingGateway.port | quote }}
                - name: TENANT_DELETE_TRACKING_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "industryflow.workloadSecretName" (dict "ctx" . "workload" "tenant-delete") }}
                      key: TRACKING_OPERATOR_TOKEN
                {{- end }}
                {{- if .Values.ingress.mtls.enabled }}
                # The device-CA Secret the edge verifies against, with the issued register the CA
                # publishes beside its CRL: the job verifies every device certificate of the tenant
                # is revoked (device-ca.sh revoke-tenant). It holds no key of the CA.
                - name: TENANT_DELETE_DEVICE_CA_CHAIN
                  value: "/etc/industryflow/device-ca/ca.crt"
                - name: TENANT_DELETE_DEVICE_CA_CRL
                  value: "/etc/industryflow/device-ca/ca.crl"
                - name: TENANT_DELETE_DEVICE_CA_REGISTER
                  value: "/etc/industryflow/device-ca/issued.tsv"
                {{- end }}
                # The deployment's own retentions, from the values the broker and db-backup use.
                - name: TENANT_DELETE_BROKER_RETENTION_HOURS
                  value: {{ .Values.infra.kafka.retentionHours | quote }}
                - name: TENANT_DELETE_BACKUP_COPIES
                  value: {{ .Values.backup.retainPerDatabase | quote }}
                - name: TENANT_DELETE_BACKUP_INTERVAL_DAYS
                  value: {{ .Values.backup.intervalDays | quote }}
                {{- if .Values.tls.db.enabled }}
                # TLS to the DB (ADR-0017); libpq reads sslmode/sslrootcert directly.
                - name: DB_SSLMODE
                  value: {{ .Values.tls.db.sslmode | quote }}
                - name: DB_SSLROOTCERT
                  value: {{ printf "%s/ca.crt" .Values.tls.db.mountPath | quote }}
                {{- end }}
              {{- with .Values.tenantDelete.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if or .Values.tls.db.enabled .Values.ingress.mtls.enabled }}
              volumeMounts:
                {{- if .Values.tls.db.enabled }}
                - name: db-ca
                  mountPath: {{ printf "%s/ca.crt" .Values.tls.db.mountPath }}
                  subPath: ca.crt
                  readOnly: true
                {{- end }}
                {{- if .Values.ingress.mtls.enabled }}
                - name: device-ca
                  mountPath: /etc/industryflow/device-ca
                  readOnly: true
                {{- end }}
              {{- end }}
          volumes:
            {{- include "industryflow.schemaReadyVolumes" . | nindent 12 }}
            {{- if .Values.tls.db.enabled }}
            - name: db-ca
              secret:
                secretName: {{ .Values.tls.db.secretName | quote }}
                items:
                  - key: ca.crt
                    path: ca.crt
            {{- end }}
            {{- if .Values.ingress.mtls.enabled }}
            - name: device-ca
              secret:
                secretName: {{ .Values.ingress.mtls.caSecret | quote }}
            {{- end }}
{{- end }}
