{{- $m := .Values.dbMigrations }}
{{- /*
  Platform schema migrations (ADR-0034 dec 4, 7-10): applies the pending scripts in order and
  records each in the ledger, then exits. One Job per release revision, so every install and
  upgrade runs it; the runner serializes concurrent runs with an advisory lock. Database clients
  do not wait for this Job by name: their schema-ready init containers wait for the ledger it
  writes. It connects as the database owner (creating databases, roles and extensions needs it)
  over verify-full TLS (ADR-0017), and is the only workload holding the service-role passwords,
  which the role scripts set.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "industryflow.fullname" . }}-db-migrate-{{ .Release.Revision }}
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: database
spec:
  backoffLimit: {{ $m.backoffLimit }}
  ttlSecondsAfterFinished: {{ $m.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.tls.db.postgresUser }}
        runAsGroup: {{ .Values.tls.db.postgresUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          image: {{ .Values.infra.timescaledb.image | quote }}
          command: ["sh", "/opt/db-migrations/migrate.sh", "apply"]
          {{- $secret := include "industryflow.workloadSecretName" (dict "ctx" . "workload" "db-migrate") }}
          env:
            - { name: PGHOST, value: {{ include "industryflow.dbHost" . | quote }} }
            - { name: PGPORT, value: {{ .Values.infra.timescaledb.port | quote }} }
            - { name: PGDATABASE, value: {{ .Values.infra.timescaledb.database | quote }} }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: DB_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: DB_PASSWORD }
            {{- if .Values.tls.db.enabled }}
            - { name: PGSSLMODE, value: {{ .Values.tls.db.sslmode | quote }} }
            - { name: PGSSLROOTCERT, value: /opt/db-ca/ca.crt }
            {{- end }}
            - { name: MIGRATIONS_DIR, value: /opt/db-migrations }
            - { name: MIGRATE_WAIT_SECONDS, value: {{ $m.waitSeconds | quote }} }
            - { name: TMPDIR, value: /tmp }
            {{- /* The role scripts read each role's password (industryflow.timescaledbRoleKeys). */}}
            {{- range $key := splitList " " (include "industryflow.timescaledbRoleKeys" .) }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ $key }} }
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with $m.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: scripts, mountPath: /opt/db-migrations, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.tls.db.enabled }}
            - { name: db-ca, mountPath: /opt/db-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "industryflow.fullname" . }}-db-migrations
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.db.enabled }}
        - name: db-ca
          secret:
            secretName: {{ .Values.tls.db.secretName | quote }}
            items:
              - { key: ca.crt, path: ca.crt }
        {{- end }}
