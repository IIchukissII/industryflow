{{- $root := . }}
{{- $ex := .Values.observability.exporters }}
{{- /*
  Data-store exporters (postgres/redis/kafka) — app-specific, so they live with the app chart;
  node-exporter / kube-state-metrics come from the cluster monitoring stack. Each exposes a
  `metrics` port that the generated ServiceMonitors scrape. Hardened like the app workloads
  (non-root, drop caps, read-only root FS) without pinning a uid (use each image's default).
*/}}
{{- define "industryflow.exporterSecurityContext" -}}
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
{{- end -}}
{{- define "industryflow.exporterContainerSecurityContext" -}}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
{{- end -}}

{{- if $ex.postgres.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" $root }}-postgres-exporter
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      {{- if $root.Values.securityContext.enabled }}
      {{- include "industryflow.exporterSecurityContext" $root | nindent 6 }}
      {{- end }}
      containers:
        - name: postgres-exporter
          image: {{ $ex.postgres.image | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $root.Values.securityContext.enabled }}
          {{- include "industryflow.exporterContainerSecurityContext" $root | nindent 10 }}
          {{- end }}
          env:
            # Read-only monitoring role (pg_monitor), never the superuser.
            - name: DATA_SOURCE_URI
              {{- if $root.Values.tls.db.enabled }}
              # TLS to the DB (ADR-0017): the pg_hba is hostssl, so the exporter connects
              # verify-full against the internal CA (mounted below), not sslmode=disable.
              value: {{ printf "%s:%v/%s?sslmode=%s&sslrootcert=%s/ca.crt" (include "industryflow.dbHost" $root) $root.Values.infra.timescaledb.port $root.Values.infra.timescaledb.database $root.Values.tls.db.sslmode $root.Values.tls.db.mountPath | quote }}
              {{- else }}
              value: {{ printf "%s:%v/%s?sslmode=disable" (include "industryflow.dbHost" $root) $root.Values.infra.timescaledb.port $root.Values.infra.timescaledb.database | quote }}
              {{- end }}
            - name: DATA_SOURCE_USER
              value: metrics_user
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "industryflow.workloadSecretName" (dict "ctx" $root "workload" "postgres-exporter") }}
                  key: METRICS_DB_PASSWORD
          ports:
            - name: metrics
              containerPort: {{ $ex.postgres.port }}
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          {{- if $root.Values.tls.db.enabled }}
          volumeMounts:
            - name: db-ca
              mountPath: {{ printf "%s/ca.crt" $root.Values.tls.db.mountPath }}
              subPath: ca.crt
              readOnly: true
          {{- end }}
      {{- if $root.Values.tls.db.enabled }}
      volumes:
        - name: db-ca
          secret:
            secretName: {{ $root.Values.tls.db.secretName | quote }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" $root }}-postgres-exporter
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: metrics
      port: {{ $ex.postgres.port }}
      targetPort: metrics
{{- end }}

{{- if $ex.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" $root }}-redis-exporter
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      {{- if $root.Values.securityContext.enabled }}
      {{- include "industryflow.exporterSecurityContext" $root | nindent 6 }}
      {{- end }}
      containers:
        - name: redis-exporter
          image: {{ $ex.redis.image | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $root.Values.securityContext.enabled }}
          {{- include "industryflow.exporterContainerSecurityContext" $root | nindent 10 }}
          {{- end }}
          env:
            - name: REDIS_ADDR
              value: {{ printf "redis://%s:%v" (include "industryflow.redisHost" $root) $root.Values.infra.redis.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ $ex.redis.port }}
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" $root }}-redis-exporter
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: redis-exporter
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: metrics
      port: {{ $ex.redis.port }}
      targetPort: metrics
{{- end }}

{{- if $ex.kafka.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "industryflow.fullname" $root }}-kafka-exporter
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      {{- if $root.Values.securityContext.enabled }}
      {{- include "industryflow.exporterSecurityContext" $root | nindent 6 }}
      {{- end }}
      containers:
        - name: kafka-exporter
          image: {{ $ex.kafka.image | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $root.Values.securityContext.enabled }}
          {{- include "industryflow.exporterContainerSecurityContext" $root | nindent 10 }}
          {{- end }}
          args:
            - {{ printf "--kafka.server=%s" (include "industryflow.kafkaBootstrap" $root) | quote }}
          ports:
            - name: metrics
              containerPort: {{ $ex.kafka.port }}
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "industryflow.fullname" $root }}-kafka-exporter
  labels:
    {{- include "industryflow.labels" $root | nindent 4 }}
    app.kubernetes.io/name: kafka-exporter
spec:
  selector:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: metrics
      port: {{ $ex.kafka.port }}
      targetPort: metrics
{{- end }}
