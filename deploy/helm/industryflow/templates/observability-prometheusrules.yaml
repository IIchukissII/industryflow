{{- if .Values.observability.prometheusRules.enabled }}
{{- $pr := .Values.observability.prometheusRules }}
{{- /*
  Platform alert rules. The platform group is single-sourced (ADR-0016 dec 1) from
  infrastructure/prometheus/rules/platform.yml through the files/prometheus-rules.yml symlink, the
  file Compose's Prometheus loads; its selectors match the platform="industryflow" label the
  ServiceMonitors attach. The Kubernetes group holds the rules on kube-state-metrics series, which
  exist only here. Requires the Prometheus Operator CRDs.
*/}}
{{- $mtls := and .Values.ingress.enabled .Values.ingress.mtls.enabled }}
{{- $crl := and $mtls .Values.ingress.mtls.crlCheck.enabled }}
{{- $cert := and $mtls .Values.ingress.mtls.certCheck.enabled }}
{{- $backup := .Values.backup.enabled }}
{{- $rehearsal := and $backup .Values.backup.rehearsal.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "industryflow.fullname" . }}-platform
  labels:
    {{- include "industryflow.labels" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- (.Files.Get "files/prometheus-rules.yml" | fromYaml).groups | toYaml | nindent 4 }}
    {{- if or $crl $cert $backup }}
    - name: industryflow.kubernetes
      rules:
        {{- if $crl }}
        # ADR-0007 dec 8, 10: an expired device CRL or CA certificate makes the edge refuse every
        # device. Raised from the device-crl-check job no longer succeeding (kube-state-metrics),
        # well before either expires. Keyed on the last SUCCESS, so it clears on the first good run after a refresh;
        # a job that has never succeeded has no such series and is measured from its creation instead.
        - alert: IndustryFlowDeviceCrlStale
          expr: time() - (kube_cronjob_status_last_successful_time{cronjob="{{ include "industryflow.fullname" . }}-device-crl-check"} or on (namespace, cronjob) kube_cronjob_created{cronjob="{{ include "industryflow.fullname" . }}-device-crl-check"}) > {{ .Values.ingress.mtls.crlCheck.alertAfterSeconds }}
          labels:
            severity: critical
          annotations:
            summary: "Device CRL or CA certificate is close to expiry"
            description: "The device-crl-check job log names it. Refresh the CRL in the {{ .Values.ingress.mtls.caSecret }} Secret, or replace the CA certificate (docs/operations/device-mtls.md). Once either expires, every device is refused at ingestion."
        {{- end }}
        {{- if $cert }}
        # ADR-0007 dec 10: a device whose newest unrevoked certificate nears expiry owes a renewal.
        # One device, not the fleet, so a warning; keyed on the last success like the CRL rule.
        - alert: IndustryFlowDeviceCertExpiring
          expr: time() - (kube_cronjob_status_last_successful_time{cronjob="{{ include "industryflow.fullname" . }}-device-cert-check"} or on (namespace, cronjob) kube_cronjob_created{cronjob="{{ include "industryflow.fullname" . }}-device-cert-check"}) > {{ .Values.ingress.mtls.certCheck.alertAfterSeconds }}
          labels:
            severity: warning
          annotations:
            summary: "A device certificate is close to expiry"
            description: "The device-cert-check job log names the device. Renew it (docs/operations/device-mtls.md) and republish the CRL and register to the {{ .Values.ingress.mtls.caSecret }} Secret; an expired certificate is refused at ingestion."
        {{- end }}
        {{- if $backup }}
        # ADR-0032: a backup that has stopped completing is found at the restore that needed it. Keyed
        # on the last success, measured from creation for a job that never succeeded.
        - alert: IndustryFlowBackupStale
          expr: time() - (kube_cronjob_status_last_successful_time{cronjob="{{ include "industryflow.fullname" . }}-db-backup"} or on (namespace, cronjob) kube_cronjob_created{cronjob="{{ include "industryflow.fullname" . }}-db-backup"}) > {{ .Values.backup.alertAfterSeconds }}
          labels:
            severity: critical
          annotations:
            summary: "No backup has completed recently"
            description: "The db-backup CronJob has not succeeded recently, or never has; its job log names the failing step (docs/operations/backup-and-recovery.md)."
        {{- end }}
        {{- if $rehearsal }}
        # ADR-0032 dec 6: an unexercised backup counts toward no recovery objective.
        - alert: IndustryFlowRestoreRehearsalStale
          expr: time() - (kube_cronjob_status_last_successful_time{cronjob="{{ include "industryflow.fullname" . }}-restore-rehearsal"} or on (namespace, cronjob) kube_cronjob_created{cronjob="{{ include "industryflow.fullname" . }}-restore-rehearsal"}) > {{ .Values.backup.rehearsal.alertAfterSeconds }}
          labels:
            severity: warning
          annotations:
            summary: "No restore rehearsal has passed recently"
            description: "The restore-rehearsal CronJob has not passed recently, or never has; its backups count toward no recovery objective until one does. Its job log names the database or object that differed (docs/operations/backup-and-recovery.md)."
        {{- end }}
    {{- end }}
{{- end }}
