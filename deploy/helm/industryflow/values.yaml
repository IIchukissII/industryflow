# Default values for the IndustryFlow chart.
# See ADR-0009 for the decisions behind this layout.

nameOverride: ""
fullnameOverride: ""

image:
  # Registry/repo prefix for the application images. Override per environment.
  registry: ghcr.io/iichukissii
  pullPolicy: IfNotPresent
  # Default tag for all first-party app images (dev/default path). In production, pin each
  # image by immutable digest instead: set the per-image `digest:` (apps.<name>.digest,
  # infra.mlflow.digest, notebookHub.hub.digest) — a digest, when present, wins over this tag.
  # Generate a ready-made overlay with scripts/pin-image-digests.sh > values-digests.yaml,
  # then `-f values-digests.yaml` at install (ADR-0009).
  tag: "latest"
imagePullSecrets: []

# ---------------------------------------------------------------------------
# Resilience / HA for the stateless app tier (item 8). PodDisruptionBudgets keep a voluntary
# disruption (node drain/upgrade) from taking every replica at once; soft anti-affinity spreads
# replicas across nodes. Per-app autoscaling lives under apps.<name>.hpa. The stateful SPOFs
# (TimescaleDB/Kafka/ZK/Redis/MinIO) need operator/replication HA — see deploy/observability
# and docs; not addressed by these knobs.
# ---------------------------------------------------------------------------
resilience:
  podDisruptionBudgets:
    enabled: true
    # Applied to apps with >1 replica (or HPA on). maxUnavailable keeps drain working even at
    # one replica, unlike minAvailable.
    maxUnavailable: 1
  antiAffinity:
    enabled: true
    # "soft" = preferredDuringScheduling (won't block scheduling on small clusters);
    # "hard" = requiredDuringScheduling (one replica per node, needs enough nodes).
    type: soft
    topologyKey: kubernetes.io/hostname

# ---------------------------------------------------------------------------
# Container hardening applied to first-party workloads (apps + mlflow + db-backup): non-root,
# no privilege escalation, all capabilities dropped, seccomp RuntimeDefault, read-only root FS
# with writable scratch dirs (the images declare USER 10001). Per-app overrides:
# apps.<name>.{runAsUser,runAsGroup,fsGroup,readOnlyRootFilesystem,writablePaths}.
# ---------------------------------------------------------------------------
securityContext:
  enabled: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  readOnlyRootFilesystem: true
  # Writable in-memory mounts added when readOnlyRootFilesystem is true (apps still need /tmp).
  writablePaths: ["/tmp"]

# ---------------------------------------------------------------------------
# Database TLS + SCRAM (ADR-0017). The hardened pg_hba.conf is `hostssl` + scram-sha-256,
# so an in-cluster TimescaleDB *requires* a server certificate — every client connects
# verify-full (encrypt + CA-verify + hostname) and authenticates with SCRAM. This is the
# k8s mirror of the enforced compose deployment.
#
# The chart needs a Secret holding `tls.crt`, `tls.key`, `ca.crt` (the standard cert-manager
# Certificate layout). Either let the chart self-provision it with cert-manager
# (tls.db.certManager.enabled=true — needs the cert-manager CRDs), or supply your own PKI's
# Secret via tls.db.secretName. The timescaledb pod mounts all three (an initContainer stages
# them with postgres-only key perms); every DB client mounts just ca.crt.
# ---------------------------------------------------------------------------
tls:
  db:
    enabled: true
    # libpq/asyncpg sslmode for clients. verify-full = encrypt + verify CA + check hostname.
    sslmode: verify-full
    # Secret with tls.crt / tls.key / ca.crt. Created by cert-manager below, or bring your own.
    secretName: industryflow-db-tls
    # Where ca.crt (and, on the DB pod, the staged server cert) is mounted. Matches the client
    # code defaults (DB_SSLROOTCERT=<mountPath>/ca.crt).
    mountPath: /etc/ssl/industryflow
    # Numeric uid the postgres process runs as inside the timescaledb image; the cert-init
    # initContainer chowns the private key to it (postgres refuses a group/world-readable key).
    # timescale/timescaledb (Debian) runs postgres as uid 999.
    postgresUser: 999
    # BusyBox image for the cert-init initContainer (copy + chmod 600 + chown the key).
    initImage: busybox:1.36
    # Self-provision the cert + CA with cert-manager: a SelfSigned issuer bootstraps a CA, a CA
    # issuer then signs the DB server cert into secretName. Defaults OFF (needs the cert-manager
    # CRDs, like the observability CRs); enable where cert-manager is installed, otherwise set
    # secretName to a Secret you create out-of-band.
    certManager:
      enabled: false
      duration: 8760h     # server cert lifetime (1y)
      renewBefore: 720h   # renew 30d before expiry
      caDuration: 43800h  # internal CA lifetime (5y)

# ---------------------------------------------------------------------------
# Application (stateless) services — each renders a Deployment (+ Service if it
# exposes a port) via templates/apps.yaml.
# ---------------------------------------------------------------------------
apps:
  api-gateway:
    enabled: true
    image: industryflow-api-gateway
    # Immutable digest (sha256:…); when set it overrides image.tag. See values-digests.yaml.
    digest: ""
    # Secret keys this workload receives (its own scoped Secret — not the whole bundle).
    secretKeys: [API_GATEWAY_DB_PASSWORD, JWT_SECRET_KEY]
    # Exposes Prometheus metrics at /metrics → a ServiceMonitor is generated for it.
    metrics: true
    replicas: 2
    # Opt-in CPU autoscaling (needs metrics-server). When enabled, `replicas` is ignored.
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    port: 8000
    probe: { path: /health, port: 8000 }
    ingress: { host: api.industryflow.local, path: / }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

  ml-service-api:
    enabled: true
    image: industryflow-ml-service-api
    digest: ""
    # MINIO_* are also exposed as AWS_* (the MLflow client loads model artifacts from MinIO).
    secretKeys: [ML_SERVICE_DB_PASSWORD, MLFLOW_DB_PASSWORD, JWT_SECRET_KEY, INTERNAL_SERVICE_TOKEN, MINIO_ACCESS_KEY, MINIO_SECRET_KEY]
    metrics: true
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    # Models are written to /app/models at runtime — make it writable under the read-only root FS.
    writablePaths: ["/tmp", "/app/models"]
    replicas: 1
    port: 8002
    probe: { path: /health, port: 8002 }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

  alert-service-api:
    enabled: true
    image: industryflow-alert-service-api
    digest: ""
    secretKeys: [ALERT_SERVICE_DB_PASSWORD, JWT_SECRET_KEY, INTERNAL_SERVICE_TOKEN]
    metrics: true
    replicas: 1
    port: 8001
    probe: { path: /health, port: 8001 }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

  alert-service-detector:
    # Kafka consumer worker — no HTTP port/Service.
    enabled: true
    image: industryflow-alert-service-detector
    digest: ""
    secretKeys: [ALERT_SERVICE_DB_PASSWORD, JWT_SECRET_KEY, INTERNAL_SERVICE_TOKEN]
    replicas: 1
    port: null
    probe: null
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

  ingestion-service:
    enabled: true
    image: industryflow-ingestion-service
    digest: ""
    # mTLS-only, holds no DB role and no app secrets (ADR-0002) — gets no Secret.
    secretKeys: []
    # /metrics on the service port → a ServiceMonitor (scraped in-cluster, not via the edge).
    metrics: true
    replicas: 2
    port: 8003
    probe: { path: /health, port: 8003 }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

  spark-streaming:
    # Long-running PySpark job (Kafka -> TimescaleDB). No HTTP port.
    enabled: true
    image: industryflow-spark-streaming
    digest: ""
    secretKeys: [SPARK_STREAMING_DB_PASSWORD]
    # The apache/spark base runs as uid 185 and writes ivy2/work/tmp dirs, so it needs a
    # writable root FS.
    runAsUser: 185
    runAsGroup: 185
    fsGroup: 185
    readOnlyRootFilesystem: false
    replicas: 1
    port: null
    probe: null
    # Spark's native PrometheusServlet on the driver UI (item 7): a metrics-only Service on 4040,
    # scraped at /metrics/prometheus (driver) + /metrics/executors/prometheus (executors).
    metrics: true
    metricsPort: 4040
    metricsPath: /metrics/prometheus
    metricsExtraPaths: ["/metrics/executors/prometheus"]
    # Durable Structured-Streaming checkpoint (offsets + state). Without it, a restart
    # reprocesses from scratch / loses exactly-once guarantees (ADR-0006). RWO, single writer.
    persistence:
      enabled: true
      mountPath: /opt/spark/checkpoints
      size: 10Gi
      storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }

  spark-aggregations:
    enabled: true
    image: industryflow-spark-aggregations
    digest: ""
    secretKeys: [SPARK_STREAMING_DB_PASSWORD]
    runAsUser: 185
    runAsGroup: 185
    fsGroup: 185
    readOnlyRootFilesystem: false
    replicas: 1
    port: null
    probe: null
    # Spark PrometheusServlet on the driver UI (item 7) — see spark-streaming above.
    metrics: true
    metricsPort: 4040
    metricsPath: /metrics/prometheus
    metricsExtraPaths: ["/metrics/executors/prometheus"]
    persistence:
      enabled: true
      mountPath: /opt/spark/checkpoints
      size: 10Gi
      storageClass: ""
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }

  frontend:
    # The SPA served behind the TLS edge (ADR-0004/0009 dec 5). Probes hit /healthz.
    enabled: true
    image: industryflow-frontend
    digest: ""
    # Static SPA behind the TLS edge — no app secrets.
    secretKeys: []
    # Unprivileged nginx (uid 101) listening on 8080; non-root + dropped caps. Root FS stays
    # writable (nginx cache + the dev cert self-signed into /etc/nginx/certs).
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    readOnlyRootFilesystem: false
    replicas: 2
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    port: 8080
    probe: { path: /healthz, port: 8080 }
    ingress: { host: app.industryflow.local, path: / }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 200m, memory: 128Mi }

# ---------------------------------------------------------------------------
# Stateful infrastructure — `inCluster: true` renders a StatefulSet/Deployment +
# Service here; `inCluster: false` renders nothing and the app config points at
# `external.*` instead (ADR-0009 decision 3).
# ---------------------------------------------------------------------------
infra:
  timescaledb:
    inCluster: true
    # Pinned by immutable digest (the tag is kept for readability only). Re-pin on upgrade.
    image: timescale/timescaledb:latest-pg15@sha256:d621009854b8519a1bf63f81eebc979c1acc06a16843086f244edd44dcce6eea
    port: 5432
    storage: 20Gi
    database: industryflow
    external: { host: "", port: 5432 }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }

  zookeeper:
    inCluster: true
    image: confluentinc/cp-zookeeper:7.5.0@sha256:02f6c042bb9a7844382fc4cedc513a44585d8a5acae873fb9e510e3ca9dcabc6
    port: 2181
    storage: 2Gi

  kafka:
    inCluster: true
    image: confluentinc/cp-kafka:7.5.0@sha256:fbbb6fa11b258a88b83f54d4f0bddfcffbf2279f99d66a843486e3da7bdfbf41
    port: 9092
    storage: 20Gi
    external: { bootstrap: "" }
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: "1", memory: 2Gi }

  redis:
    inCluster: true
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    port: 6379
    storage: 2Gi
    external: { host: "", port: 6379 }

  minio:
    inCluster: true
    # Pinned by immutable digest (minio:latest is mutable; the tag is kept for readability).
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    apiPort: 9000
    consolePort: 9001
    storage: 20Gi
    external: { endpoint: "" }

  mlflow:
    # Stateless front to TimescaleDB + MinIO; runs as a Deployment.
    inCluster: true
    image: industryflow-mlflow
    digest: ""
    port: 5000
    external: { trackingUri: "" }

# ---------------------------------------------------------------------------
# Logical database backups (tier-1 DR) — a CronJob dumps each database to S3/MinIO
# with retention. See docs/operations/backup-and-recovery.md (incl. restore + the
# tier-2 pgBackRest/PITR path). Credentials reuse the Secret (DB_USER/DB_PASSWORD,
# MINIO_ACCESS_KEY/MINIO_SECRET_KEY).
# ---------------------------------------------------------------------------
backup:
  enabled: true
  image: industryflow-db-backup
  digest: ""
  schedule: "0 2 * * *"        # daily 02:00 UTC
  retainPerDatabase: 14        # copies kept per database (≈ days at a daily schedule)
  databases: "industryflow mlflow"
  s3:
    # Defaults to the in-cluster MinIO. For genuine disaster recovery point this at an
    # OFF-SITE / managed S3 bucket (override endpoint + bucket and supply credentials).
    endpoint: ""               # "" -> derive the in-cluster MinIO endpoint
    bucket: industryflow-backups
    region: us-east-1
    prefix: timescaledb
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# ---------------------------------------------------------------------------
# Observability integration (ADR-0009). The chart does NOT run Prometheus/Grafana/Loki —
# those are the cluster's monitoring stack (kube-prometheus-stack + Loki; see
# deploy/observability/). The app only EMITS the objects that stack discovers:
#   - ServiceMonitors  — generated for every app with `metrics: true` (data-driven)
#   - PrometheusRules   — platform alert rules
#   - Grafana dashboards — ConfigMaps the Grafana sidecar auto-loads
#   - data-store exporters (postgres/redis/kafka) that expose metrics for the above
# CR-emitting toggles default OFF (they need the Prometheus Operator CRDs); turn on where
# the operator is installed. This keeps a plain `helm install` working without the CRDs.
# ---------------------------------------------------------------------------
observability:
  serviceMonitors:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels so the operator's serviceMonitorSelector matches these (e.g. release: monitoring).
    labels: {}
  prometheusRules:
    enabled: false
    labels: {}
    # Tunable thresholds for the platform alert rules.
    targetDownFor: 5m
    kafkaConsumerLagThreshold: 1000
    kafkaConsumerLagFor: 10m
  dashboards:
    # ConfigMaps labelled for the Grafana sidecar; harmless (just ConfigMaps) without it.
    enabled: true
    label: grafana_dashboard
  # Data-store exporters — app-specific (they target our DB/Redis/Kafka). node-exporter and
  # kube-state-metrics come from the cluster stack, not here.
  exporters:
    postgres:
      enabled: true
      image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
      port: 9187
    redis:
      enabled: true
      image: oliver006/redis_exporter:v1.67.0
      port: 9121
    kafka:
      enabled: true
      image: danielqsj/kafka-exporter:v1.8.0
      port: 9308

# ---------------------------------------------------------------------------
# Non-secret configuration (rendered into a ConfigMap, consumed by every app
# via envFrom). Authoritative topic names etc. live here (ADR-0000).
# ---------------------------------------------------------------------------
config:
  DB_NAME: industryflow
  DB_PORT: "5432"
  # Per-service least-privilege DB role usernames (non-secret; passwords live in each
  # workload's scoped Secret). Each service connects as its own role, never as the superuser
  # (ADR-0003). The roles are created at DB init by 00-create-roles.sh.
  API_GATEWAY_DB_USER: api_gateway_user
  ALERT_SERVICE_DB_USER: alert_service_user
  ML_SERVICE_DB_USER: ml_service_user
  MLFLOW_DB_USER: mlflow_user
  SPARK_STREAMING_DB_USER: spark_streaming_user
  KAFKA_TOPIC_SENSOR_DATA: sensor-data-raw
  KAFKA_TOPIC_ALERTS: sensor-alerts
  KAFKA_GROUP_ID: alert-detector
  # Spark Structured-Streaming checkpoint (ADR-0006). Default = the per-pod PVC (Helm runs Spark
  # in local mode: driver = executor = one pod, so a local checkpoint is fine). To scale Spark
  # out (a real standalone/k8s cluster with separate executors), move the checkpoint to a shared
  # store: set this to `s3a://spark-checkpoints`, add MINIO_ACCESS_KEY/MINIO_SECRET_KEY to the
  # spark-streaming/spark-aggregations `secretKeys`, and set their `persistence.enabled=false`.
  CHECKPOINT_LOCATION: /opt/spark/checkpoints
  CORS_ORIGINS: "https://app.industryflow.local"
  ENVIRONMENT: production
  # Extension plugin modules the ML service loads at startup (ADR-0008/0010); empty = built-ins.
  EXTENSION_MODULES: ""

# ---------------------------------------------------------------------------
# Secrets. NEVER commit real values — these are placeholders. In real
# deployments supply them via SealedSecrets/Vault/CSI (ADR-0009 decision 4).
# If `create: false`, an existing Secret named `existingSecret` is used instead.
#
# `data` is the single source for secret VALUES; the chart renders a SEPARATE,
# scoped Secret per workload containing only the keys that workload needs
# (apps.<name>.secretKeys / infra), so no pod receives the full bundle.
# ---------------------------------------------------------------------------
secrets:
  create: true
  existingSecret: ""
  # Fail `helm install`/`template` if any value below is still a placeholder, so default
  # credentials can never reach a cluster. Set false only for non-prod renders (CI does).
  failOnPlaceholders: true
  data:
    DB_USER: postgres
    DB_PASSWORD: "CHANGE_ME"
    # Per-service least-privilege role passwords. 00-create-roles.sh consumes these at first
    # DB init to create api_gateway_user / spark_streaming_user / alert_service_user /
    # ml_service_user / mlflow_user (ADR-0003). Each service connects as its own role via
    # its scoped Secret + the *_DB_USER config keys.
    API_GATEWAY_DB_PASSWORD: "CHANGE_ME"
    SPARK_STREAMING_DB_PASSWORD: "CHANGE_ME"
    ALERT_SERVICE_DB_PASSWORD: "CHANGE_ME"
    ML_SERVICE_DB_PASSWORD: "CHANGE_ME"
    MLFLOW_DB_PASSWORD: "CHANGE_ME"
    # Read-only monitoring role used by the postgres-exporter (pg_monitor).
    METRICS_DB_PASSWORD: "CHANGE_ME"
    JWT_SECRET_KEY: "CHANGE_ME"
    INTERNAL_SERVICE_TOKEN: "CHANGE_ME"
    MINIO_ACCESS_KEY: "CHANGE_ME"
    MINIO_SECRET_KEY: "CHANGE_ME"
    # Notebook hub (ADR-0011): shared token between the hub and its proxy, and the hub cookie
    # secret. Only consumed when notebookHub.enabled.
    CONFIGPROXY_AUTH_TOKEN: "CHANGE_ME"
    JUPYTERHUB_COOKIE_SECRET: "CHANGE_ME"
    # Encrypts auth_state (the verified tenant/role the hub carries to spawn); required by
    # enable_auth_state. Generate: openssl rand -hex 32.
    JUPYTERHUB_CRYPT_KEY: "CHANGE_ME"
    # Password for the privileged notebook_sql_proxy DB role (ADR-0015). Consumed by
    # 13-notebook-sql-proxy-role.sh at DB init and by the SQL proxy to log in. notebookHub only.
    NOTEBOOK_SQL_PROXY_DB_PASSWORD: "CHANGE_ME"

# ---------------------------------------------------------------------------
# Ingress — the single TLS edge (ADR-0002 mTLS device path, ADR-0004 HTTPS).
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName: industryflow-tls
  annotations: {}
  # The mTLS device-ingestion path (ADR-0002 / ADR-0007), realized as a second Ingress.
  # The ingress-nginx controller verifies client certs against the device CA (a Secret with
  # ca.crt [+ ca.crl]) and passes the verified cert to ingestion-service as ssl-client-cert.
  # Enable per environment and supply the device-CA Secret (scripts/device-ca.sh output).
  mtls:
    enabled: false
    caSecret: industryflow-device-ca
    host: ingest.industryflow.local
    verifyDepth: 2

# ---------------------------------------------------------------------------
# NetworkPolicy restricting ingestion-service ingress to the cluster TLS edge only
# (ADR-0002 dec 3 — the service must be reachable only via the proxy). The selector for
# the ingress controller is environment-specific; default targets the common label.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: false
  ingressControllerNamespace: ingress-nginx

# Embedded notebooks (ADR-0011/0012/0014). When enabled this renders the hub runtime (hub +
# configurable-http-proxy + RBAC), the SSO reverse proxy that performs the ADR-0014 handoff,
# the single-user pod isolation NetworkPolicy, and the notebooks Ingress.
#
# NOT YET CLUSTER-VALIDATED: these manifests render (helm template) but have not been run on a
# cluster. The api-gateway session-verify endpoint the SSO proxy calls (verifyPath) is
# implemented at GET /auth/verify (ADR-0014 handoff contract).
notebookHub:
  enabled: false
  # External host for the notebooks UI (served via the SSO proxy → hub).
  host: notebooks.industryflow.local
  # The hub (JupyterHub, image built from services/notebook_hub/Dockerfile).
  hub:
    image: industryflow-notebook-hub
    digest: ""
    port: 8081
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  # The configurable HTTP proxy the hub manages (routes /hub and /user/* to servers).
  proxy:
    image: jupyterhub/configurable-http-proxy:4.6.3@sha256:3e93aaee24350050dca97bfe9a05eab8bd26781d08cd9682268a38053643d709
    port: 8000
  # SSO reverse proxy (ADR-0014): validates the platform session against api-gateway and
  # forwards the verified identity to the hub, overwriting any client-supplied identity.
  ssoProxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    port: 8080
    # api-gateway endpoint that validates the session cookie and returns the verified identity
    # in X-IF-* response headers (implemented; ADR-0014 handoff contract).
    verifyPath: /auth/verify
  # SQL access proxy (ADR-0015): authoring kernels connect with a Postgres driver using their SQL
  # capability handle as the password; the proxy logs in as the privileged notebook_sql_proxy role
  # and SET ROLEs into the tenant reader. The live relay is not yet cluster-validated (issue #19).
  sqlProxy:
    image: industryflow-notebook-sql-proxy
    digest: ""
    port: 6432
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
