# PostgreSQL Configuration for IndustryFlow
# Version: 5.0 - High-Throughput Multi-Tenant Architecture
# Date: November 7, 2025

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================
listen_addresses = '*'
max_connections = 400                    # Increased for 8-worker API Gateway
superuser_reserved_connections = 5

# =============================================================================
# MEMORY SETTINGS
# =============================================================================
shared_buffers = 512MB                   # Increased for more connections
effective_cache_size = 2GB               # Increased for better query performance
maintenance_work_mem = 256MB             # Increased for faster maintenance
work_mem = 8MB                           # Per connection (400 × 8MB = 3.2GB max)

# =============================================================================
# QUERY TUNING
# =============================================================================
random_page_cost = 1.1                   # Optimized for SSD
effective_io_concurrency = 200
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8

# =============================================================================
# WRITE AHEAD LOG
# =============================================================================
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB                       # Increased for high write throughput
min_wal_size = 2GB
wal_compression = on                     # Compress WAL for storage efficiency

# =============================================================================
# CHECKPOINTING
# =============================================================================
checkpoint_timeout = 15min
checkpoint_warning = 30s

# =============================================================================
# LOGGING
# =============================================================================
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'UTC'

# Log slow queries (>1 second)
log_min_duration_statement = 1000
log_connections = off
log_disconnections = off

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# =============================================================================
# TIMESCALEDB SETTINGS
# =============================================================================
shared_preload_libraries = 'timescaledb'
timescaledb.telemetry_level = off
timescaledb.max_background_workers = 8

# =============================================================================
# CONNECTION POOLING OPTIMIZATION
# =============================================================================
# With 400 max connections, we can handle:
# - API Gateway (8 workers): 150 connections
# - Spark Streaming: 50 connections
# - Alert Service: 10 connections
# - ML Service: 10 connections
# - MLflow: 20 connections
# - Admin/Maintenance: 10 connections
# - Buffer: 150 connections

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
# Reduce lock contention
deadlock_timeout = 1s

# Better statistics for query planner
default_statistics_target = 100

# Parallel query settings
min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB
