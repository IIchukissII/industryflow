# PostgreSQL Client Authentication Configuration
# Version: 5.0 - hardened (private networks only; no public/superuser/replication exposure)
#
# Network rules are scoped to RFC1918 private ranges (10/8, 172.16/12, 192.168/16), which
# cover Docker bridge and Kubernetes pod/service CIDRs while excluding the public internet.
# Combined with binding host-published ports to localhost (compose) and ClusterIP-only
# Services (Helm), the database is not reachable off the cluster/host network.
#
# METHOD is md5, which also accepts SCRAM-stored verifiers — so this works whether a role's
# password was created under md5 (older deploys) or scram-sha-256 (the PG15 default on fresh
# init). Hardening follow-up (tracked in docs/operations/production-readiness.md): require TLS
# (hostssl) + scram-sha-256 once a server certificate is provisioned for the DB.

# TYPE  DATABASE        USER                    ADDRESS         METHOD

# "local" is for Unix domain socket connections only (in-container admin + init scripts).
local   all             all                                     trust

# Superuser over TCP: loopback only (trust); private networks via password (admin tooling +
# the backup job). NOT reachable from the public internet.
host    all             postgres                127.0.0.1/32    trust
host    all             postgres                ::1/128         trust
host    all             postgres                10.0.0.0/8      md5
host    all             postgres                172.16.0.0/12   md5
host    all             postgres                192.168.0.0/16  md5

# Per-service least-privilege roles — each scoped to its own database, private networks only.
host    industryflow    api_gateway_user,spark_streaming_user,alert_service_user,ml_service_user   10.0.0.0/8       md5
host    industryflow    api_gateway_user,spark_streaming_user,alert_service_user,ml_service_user   172.16.0.0/12    md5
host    industryflow    api_gateway_user,spark_streaming_user,alert_service_user,ml_service_user   192.168.0.0/16   md5
host    mlflow          mlflow_user             10.0.0.0/8      md5
host    mlflow          mlflow_user             172.16.0.0/12   md5
host    mlflow          mlflow_user             192.168.0.0/16  md5

# No network replication on a single node. Add scoped hostssl rules if you introduce replicas.
local   replication     all                                     trust
