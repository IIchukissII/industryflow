# PostgreSQL Client Authentication Configuration
# Version: 6.0 — TLS-enforced (ADR-0017): every TCP connection must use TLS (hostssl) and
# authenticate with SCRAM-SHA-256. Network rules stay scoped to RFC1918 private ranges
# (10/8, 172.16/12, 192.168/16 — Docker bridge + k8s pod/service CIDRs, never the public net).
#
# Roles must carry SCRAM verifiers (password_encryption=scram-sha-256, set in postgresql.conf).
# Fresh init creates them under SCRAM automatically; existing volumes need a one-time
# `ALTER ROLE <r> PASSWORD '<same value>'` per role to re-hash from md5 (see ADR-0017).
# The Unix socket stays `trust` for in-container admin + the init scripts (never on the wire).

# TYPE  DATABASE        USER                    ADDRESS         METHOD

# "local" is for Unix domain socket connections only (in-container admin + init scripts).
local   all             all                                     trust

# Superuser over TCP: TLS + SCRAM, private networks only (admin tooling + the backup job).
# NOT reachable from the public internet, and no plaintext.
hostssl all             postgres                10.0.0.0/8      scram-sha-256
hostssl all             postgres                172.16.0.0/12   scram-sha-256
hostssl all             postgres                192.168.0.0/16  scram-sha-256

# Per-service least-privilege roles — TLS + SCRAM, each scoped to its own database, private nets.
hostssl industryflow    api_gateway_user,spark_streaming_user,alert_service_user,ml_service_user   10.0.0.0/8       scram-sha-256
hostssl industryflow    api_gateway_user,spark_streaming_user,alert_service_user,ml_service_user   172.16.0.0/12    scram-sha-256
hostssl industryflow    api_gateway_user,spark_streaming_user,alert_service_user,ml_service_user   192.168.0.0/16   scram-sha-256
hostssl mlflow          mlflow_user             10.0.0.0/8      scram-sha-256
hostssl mlflow          mlflow_user             172.16.0.0/12   scram-sha-256
hostssl mlflow          mlflow_user             192.168.0.0/16  scram-sha-256

# Notebook SQL access proxy (ADR-0015), two principals, TLS + SCRAM, private nets only:
#   * notebook_sql_proxy — the enrolment principal (a member of nothing; may only install a
#     tenant login's verifier). Never carries a kernel's session.
#   * +notebook_sql_tenants — every per-tenant login (tenant_sqlproxy_<uuid>) the proxy opens a
#     kernel's session as. `+` matches members of the group; the group holds no privilege.
# Both exist only when the notebooks profile created them (13-notebook-sql-proxy-role.sh); the
# rules are harmless no-ops otherwise.
hostssl industryflow    notebook_sql_proxy      10.0.0.0/8      scram-sha-256
hostssl industryflow    notebook_sql_proxy      172.16.0.0/12   scram-sha-256
hostssl industryflow    notebook_sql_proxy      192.168.0.0/16  scram-sha-256
hostssl industryflow    +notebook_sql_tenants   10.0.0.0/8      scram-sha-256
hostssl industryflow    +notebook_sql_tenants   172.16.0.0/12   scram-sha-256
hostssl industryflow    +notebook_sql_tenants   192.168.0.0/16  scram-sha-256

# Cold-layer exporter (ADR-0025). Reads raw measurements from `industryflow` and drops exported
# chunks via a SECURITY DEFINER function. TLS + SCRAM, private nets only. Present only when the
# cold-export role exists (00-create-roles.sh with COLD_EXPORT_DB_PASSWORD set); no-op otherwise.
hostssl industryflow    cold_export_user        10.0.0.0/8      scram-sha-256
hostssl industryflow    cold_export_user        172.16.0.0/12   scram-sha-256
hostssl industryflow    cold_export_user        192.168.0.0/16  scram-sha-256

# Read-only monitoring role (pg_monitor) for the postgres-exporter. Cluster-wide pg_stat_* views
# are reachable from any database, so it is allowed on `all` — TLS + SCRAM, private nets only.
# Both the compose and the Helm exporter connect as metrics_user.
hostssl all             metrics_user            10.0.0.0/8      scram-sha-256
hostssl all             metrics_user            172.16.0.0/12   scram-sha-256
hostssl all             metrics_user            192.168.0.0/16  scram-sha-256

# No network replication on a single node. Add scoped hostssl rules if you introduce replicas.
local   replication     all                                     trust
