# Rules on series only a Docker-host deployment has: the backup and rehearsal jobs' and the device CA
# watch's success times, which they write to node-exporter's textfile directories (backup-metrics and
# device-ca-metrics volumes). The chart raises the
# same alerts from its CronJobs' status (templates/observability-prometheusrules.yaml) and does not
# load this file.
groups:
  - name: industryflow.compose
    rules:
      # ADR-0032: a backup that has stopped completing is found at the restore that needed it.
      - alert: IndustryFlowBackupStale
        expr: time() - max by (backup) (industryflow_backup_last_success_timestamp_seconds{platform="industryflow"}) > 2 * 86400
        labels:
          severity: critical
        annotations:
          summary: "No backup has completed recently"
          description: "No {{ $labels.backup }} backup has completed in the last two days. The job's output names the failing step: docs/operations/backup-and-recovery.md."
          services: "db-backup, notebook-backup, timescaledb, minio"
      # A deployment on which no database backup has ever completed has no series at all.
      - alert: IndustryFlowBackupNeverCompleted
        expr: absent(industryflow_backup_last_success_timestamp_seconds{platform="industryflow", backup="databases"})
        for: 1d
        labels:
          severity: critical
        annotations:
          summary: "No database backup has ever completed"
          description: "No database backup has completed on this deployment. Run db-backup and schedule it: docs/operations/backup-and-recovery.md#running-backups."
          services: "db-backup, timescaledb, minio"
      # ADR-0032 dec 6: an unexercised backup counts toward no recovery objective. Weekly.
      - alert: IndustryFlowRestoreRehearsalStale
        expr: time() - max by (backup) (industryflow_restore_rehearsal_last_success_timestamp_seconds{platform="industryflow"}) > 9 * 86400
        labels:
          severity: warning
        annotations:
          summary: "No restore rehearsal has passed recently"
          description: "No {{ $labels.backup }} restore rehearsal has passed in the last nine days; its backups count toward no recovery objective until one does. Its output names the table or object that differed: docs/operations/backup-and-recovery.md."
          services: "restore-rehearsal, notebook-rehearsal, timescaledb, minio"
      - alert: IndustryFlowRestoreRehearsalNeverPassed
        expr: absent(industryflow_restore_rehearsal_last_success_timestamp_seconds{platform="industryflow", backup="databases"})
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "No restore rehearsal has ever passed"
          description: "No database restore rehearsal has passed on this deployment, so its backups count toward no recovery objective. Run restore-rehearsal and schedule it: docs/operations/backup-and-recovery.md#restore-rehearsal."
          services: "restore-rehearsal, timescaledb, minio"
      # ADR-0007 dec 8, 10: an expiring device CRL or CA certificate makes the edge refuse every device.
      # device-crl-refresh records each passing `check`; two missed six-hourly checks raise it, as the
      # chart's rule does from its CronJob. Keyed on the last success, so it clears on the next pass.
      - alert: IndustryFlowDeviceCrlStale
        expr: time() - max(industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="crl"}) > 46800
        labels:
          severity: critical
        annotations:
          summary: "Device CRL or CA certificate is close to expiry"
          description: "No device CA check has passed for 13h; docker logs industryflow-device-crl-refresh names the CRL or certificate. Re-sign the CRL or replace the CA certificate (docs/operations/device-mtls.md). Once either expires, every device is refused at ingestion."
          services: "device-crl-refresh, ingestion-edge"
      # A deployment on which the check has never passed (no device CA, or inside a window from the
      # start) has no series at all; measured from then, as the chart's from its job's creation.
      - alert: IndustryFlowDeviceCrlStale
        expr: absent(industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="crl"})
        for: 13h
        labels:
          severity: critical
        annotations:
          summary: "Device CRL or CA certificate is close to expiry"
          description: "No device CA check has ever passed on this deployment; docker logs industryflow-device-crl-refresh names the CRL or certificate, or says the device CA is not initialized (docs/operations/device-mtls.md)."
          services: "device-crl-refresh, ingestion-edge"
      # ADR-0007 dec 10: a device whose newest unrevoked certificate nears expiry owes a renewal. One
      # device, not the fleet, so a warning; keyed on the last passing `check-certs` like the CRL rule.
      - alert: IndustryFlowDeviceCertExpiring
        expr: time() - max(industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="certs"}) > 46800
        labels:
          severity: warning
        annotations:
          summary: "A device certificate is close to expiry"
          description: "No device-certificate check has passed for 13h; docker logs industryflow-device-crl-refresh names the device. Renew it (docs/operations/device-mtls.md); an expired certificate is refused at ingestion."
          services: "device-crl-refresh"
      - alert: IndustryFlowDeviceCertExpiring
        expr: absent(industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="certs"})
        for: 13h
        labels:
          severity: warning
        annotations:
          summary: "A device certificate is close to expiry"
          description: "No device-certificate check has ever passed on this deployment; docker logs industryflow-device-crl-refresh names the device or the register error (docs/operations/device-mtls.md)."
          services: "device-crl-refresh"
