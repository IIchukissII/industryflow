# Rules on series only a Docker-host deployment has: the backup and rehearsal jobs' success times,
# which they write to node-exporter's textfile directory (backup-metrics volume). The chart raises the
# same alerts from its CronJobs' status (templates/observability-prometheusrules.yaml) and does not
# load this file.
groups:
  - name: industryflow.compose
    rules:
      # ADR-0032: a backup that has stopped completing is found at the restore that needed it. A
      # deployment on which no database backup ever completed has no series and is raised after a day.
      - alert: IndustryFlowBackupStale
        expr: |
          time() - max by (backup) (industryflow_backup_last_success_timestamp_seconds{platform="industryflow"}) > 2 * 86400
          or
          absent(industryflow_backup_last_success_timestamp_seconds{platform="industryflow", backup="databases"})
        for: 1d
        labels:
          severity: critical
        annotations:
          summary: "No backup has completed recently"
          description: "No {{ $labels.backup }} backup has completed in the last two days, or none ever has. Run it and schedule it: docs/operations/backup-and-recovery.md."
          services: "db-backup, notebook-backup, timescaledb, minio"
      # ADR-0032 dec 6: an unexercised backup counts toward no recovery objective. The rehearsal runs
      # weekly; a deployment on which none has ever passed is raised after its first week.
      - alert: IndustryFlowRestoreRehearsalStale
        expr: |
          time() - max by (backup) (industryflow_restore_rehearsal_last_success_timestamp_seconds{platform="industryflow"}) > 9 * 86400
          or
          absent(industryflow_restore_rehearsal_last_success_timestamp_seconds{platform="industryflow", backup="databases"})
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "No restore rehearsal has passed recently"
          description: "No {{ $labels.backup }} restore rehearsal has passed in the last nine days, or none ever has; its backups count toward no recovery objective until one does. Run it and read its log: docs/operations/backup-and-recovery.md."
          services: "restore-rehearsal, notebook-rehearsal, timescaledb, minio"
