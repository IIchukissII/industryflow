# Platform alert rules (ADR-0016 dec 1, 4). One source: Compose's Prometheus loads this file; the
# chart renders its groups into the PrometheusRule. Built on series that always exist (`up` and the
# exporters' own), and every selector carries platform="industryflow", the target label both
# deployment shapes attach to every scrape, so a shared Prometheus never alerts on another stack.
# Operational and aggregate only (ADR-0016 dec 5): no tenant value or alert content.
# Every rule's `services` annotation names the services behind it (Compose service names), which the
# infrastructure agent reads for their logs (ADR-0046 dec 2); a scrape target's host is added to them.
groups:
  - name: industryflow.platform
    rules:
      - alert: IndustryFlowTargetDown
        expr: up{platform="industryflow"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target down"
          description: "{{ $labels.job }}/{{ $labels.instance }} has been unreachable for 5m."
          services: "{{ $labels.instance }}"
      - alert: IndustryFlowPostgresDown
        expr: pg_up{platform="industryflow"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TimescaleDB exporter reports the database down"
          description: "pg_up == 0 (postgres-exporter cannot reach TimescaleDB)."
          services: "timescaledb, postgres-exporter"
      - alert: IndustryFlowRedisDown
        expr: redis_up{platform="industryflow"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is down"
          description: "redis_up == 0 (redis-exporter cannot reach Redis)."
          services: "redis, redis-exporter"
      - alert: IndustryFlowRedisMemoryHigh
        # The capability store never evicts (ADR-0015 dec 8): at its limit it refuses mints, sign-ins and
        # cache writes, so it is watched before it gets there.
        expr: |
          redis_memory_used_bytes{platform="industryflow"}
            / (redis_memory_max_bytes{platform="industryflow"} > 0) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis is near its memory limit"
          description: "Redis uses {{ $value | humanizePercentage }} of its memory limit; at the limit it refuses writes (it never evicts)."
          services: "redis, api-gateway"
      - alert: IndustryFlowCapabilityStoreRebuilt
        # The capability store had no rebuild record (ADR-0015 dec 8): it was lost or recreated, or this is
        # a fresh install or the first start of a release that keeps the record. The API gateway re-derived
        # every suspension and ended every session issued before it.
        expr: time() - max(capability_store_rebuilt_timestamp_seconds{platform="industryflow"}) < 900
        labels:
          severity: warning
        annotations:
          summary: "The capability store was rebuilt"
          description: "The API gateway found the capability store without its rebuild record and rebuilt it: every suspension re-derived, every user signed out, every notebook server's handles gone."
          services: "redis, api-gateway"
      - alert: IndustryFlowKafkaConsumerLag
        expr: kafka_consumergroup_lag{platform="industryflow"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumergroup }} lag on {{ $labels.topic }} exceeds 1000."
          services: "kafka, spark-streaming, spark-aggregations, alert-service-detector"
      # ADR-0005: an unprocessable reading is dead-lettered, never dropped; a dead letter nobody looks
      # at is a drop with extra steps. A dead-letter topic's offset counts its letters. A topic is
      # created by its first letter, so its series starts above zero, which increase() cannot see:
      # the second term raises a dead-letter series that did not exist one window ago, but only while
      # Kafka was already being watched then, so a Prometheus that has just started (or a relabelled
      # series) does not raise letters it has merely not seen before.
      # The tenant-status stream (ADR-0033 dec 3): a partition that carried statuses within the hour and
      # none for 5m has stalled, and ingestion has forgotten every suspension it held. Per partition: a
      # producer can lose one partition's sequence while the others still publish. The topic is the
      # contract's (industryflow_contracts.tenant_status.DEFAULT_TOPIC; tests/config_guards holds them equal).
      - alert: IndustryFlowTenantStatusStalled
        expr: |
          sum by (partition) (increase(kafka_topic_partition_current_offset{platform="industryflow", topic="tenant-status"}[5m])) == 0
          and on (partition)
          sum by (partition) (increase(kafka_topic_partition_current_offset{platform="industryflow", topic="tenant-status"}[1h] offset 5m)) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The tenant-status stream has stalled"
          description: "Partition {{ $labels.partition }} of tenant-status has carried no status for 5m. Ingestion has forgotten every suspension and lets those devices through; the writers still refuse them: ADR-0033 dec 3."
          services: "alert-service-detector, kafka"
      - alert: IndustryFlowCapabilityAuditBacklog
        # The capability-use record's writer is behind (ADR-0042 dec 7): events not yet written are
        # lost if the capability store is. Every gateway replica reports the one consumer group.
        expr: max(capability_audit_backlog{platform="industryflow"}) > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Capability-use events are waiting to be recorded"
          description: "{{ $value }} capability-use events are in the capability store and not yet in the record; check the API gateway's capability audit writer."
          services: "api-gateway, redis"
      - alert: IndustryFlowCapabilityEventsDropped
        # The writer acknowledged events it could not record (ADR-0042 dec 7): an entry it could not
        # read, or a row the database refused. Each is logged with its stream id; nothing else keeps it.
        expr: sum(increase(capability_audit_events_total{platform="industryflow", result=~"unreadable|refused"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Capability-use events were dropped from the record"
          description: "Capability-use events were acknowledged without being recorded in the last 15m; the API gateway's logs (capability audit) name each stream id."
          services: "api-gateway"
      - alert: IndustryFlowDeadLetteredReadings
        expr: |
          sum by (topic) (increase(kafka_topic_partition_current_offset{platform="industryflow", topic=~".+\\.dlq"}[15m])) > 0
          or
          (
            sum by (topic) (
              kafka_topic_partition_current_offset{platform="industryflow", topic=~".+\\.dlq"}
              unless kafka_topic_partition_current_offset{platform="industryflow", topic=~".+\\.dlq"} offset 15m
            ) > 0
            and on () count(kafka_brokers{platform="industryflow"} offset 15m) > 0
          )
        labels:
          severity: warning
        annotations:
          summary: "Readings were dead-lettered"
          description: "Letters reached {{ $labels.topic }} in the last 15m. They raised no alert and were not written: ADR-0005."
          services: "spark-streaming, alert-service-detector"
      - alert: IndustryFlowStatefulFeaturesNeutralized
        # The stateful-feature kill-switch is off: every stateful slot is served neutral and every score
        # using one is degraded (ADR-0024 dec 3, 5). Deliberate, but never silent while it lasts.
        expr: sum(increase(ml_stateful_features_neutralized_total{platform="industryflow"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Stateful features are neutralized: the kill-switch is off"
          description: "Stateful feature slots were served neutral in the last 15m because the stateful-feature kill-switch is off; scores using them are degraded (ADR-0024)."
          services: "ml-service-api"
      - alert: IndustryFlowStatefulFeaturesUnavailable
        # Stateful slots served neutral because their aggregate could not be read or has no closed window
        # yet (ADR-0044 dec 3). A sensor's first window closes within its granularity, so only a sustained
        # stretch fires: the store out or overloaded, or the aggregation writer stopped for a new sensor.
        expr: sum(increase(ml_stateful_features_unavailable_total{platform="industryflow"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Stateful feature aggregates are unavailable"
          description: "Stateful feature slots have been served neutral for 15m because their aggregate was unavailable; scores using them are degraded (ADR-0044 dec 3)."
          services: "ml-service-api, timescaledb, spark-aggregations"
      - alert: IndustryFlowTenantQuotaRefusals
        # A tenant held at a quota cap is a sizing question for the operator (ADR-0049 dec 5). Per cap,
        # never per tenant (ADR-0016 dec 5): which tenants, a superuser reads from the platform API.
        # Every gateway worker reports the shared count, so its growth is read from the largest; a
        # count lost with the store falls, and a fall is no refusal. A burst does not fire; 15m does.
        expr: max by (cap) (delta(tenant_quota_refusals{platform="industryflow"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenants are being refused at a quota cap"
          description: "Demands have been refused at the {{ $labels.cap }} cap for 15m. Read which tenants at GET /api/platform/quotas/refusals, then raise a tenant's override or the default (ADR-0049)."
          services: "ingestion-service, notebook-hub, api-gateway"
      - alert: IndustryFlowTenantQuotaCountUnavailable
        # The shared count could not be read, so demands were admitted without their cap (ADR-0049 dec 8):
        # readings, counted by ingestion; SQL sessions, counted by the SQL proxy in the capability store
        # and reported by every gateway worker, so read from the largest, a fall being no admission.
        expr: >-
          (sum by (cap) (increase(tenant_quota_count_unavailable_total{platform="industryflow"}[5m])) > 0)
          or
          (max by (cap) (delta(tenant_quota_count_unavailable{platform="industryflow"}[5m])) > 0)
        labels:
          severity: warning
        annotations:
          summary: "Tenant quotas are not enforced: the shared count is unreachable"
          description: "Demands were admitted without their {{ $labels.cap }} cap in the last 5m because the shared count could not be read; no cap holds until it can (ADR-0049 dec 8)."
          services: "ingestion-service, notebook-sql-proxy, quota-redis"
      - alert: IndustryFlowNotebookSqlSessionsFull
        # Every tenant's SQL sessions together reached the notebook share of the database's connections
        # (ADR-0049 dec 10): a sizing question, as a tenant held at its cap is. Read from the largest
        # gateway worker; a burst does not fire, 15m does.
        expr: max(delta(tenant_quota_total_refusals{platform="industryflow"}[5m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Notebook SQL sessions are refused: every tenant's together are at their total"
          description: "SQL sessions have been refused at NOTEBOOK_SQL_SESSIONS_TOTAL for 15m. Raise it with max_connections, or lower tenants' sql_sessions caps (ADR-0049 dec 10)."
          services: "notebook-sql-proxy, api-gateway"
