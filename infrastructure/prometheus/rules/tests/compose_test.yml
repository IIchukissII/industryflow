# promtool test rules infrastructure/prometheus/rules/tests/compose_test.yml
rule_files:
  - ../compose.yml

evaluation_interval: 1h

tests:
  # A daily backup keeps it quiet; one that stops completing is raised two days after its last success,
  # per kind; another stack's series is not read.
  - interval: 1h
    input_series:
      # Last success at t=0, never again.
      - series: 'industryflow_backup_last_success_timestamp_seconds{platform="industryflow", backup="databases"}'
        values: '0x120'
      # Succeeds every day: the value is the time of the latest run.
      - series: 'industryflow_backup_last_success_timestamp_seconds{platform="industryflow", backup="notebooks"}'
        values: '0x23 86400x23 172800x23 259200x23 345600x23 432000x23'
      - series: 'industryflow_backup_last_success_timestamp_seconds{platform="other", backup="x"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 47h
        alertname: IndustryFlowBackupStale
        exp_alerts: []
      - eval_time: 49h
        alertname: IndustryFlowBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, backup: databases}
            exp_annotations:
              summary: "No backup has completed recently"
              description: "No databases backup has completed in the last two days. The job's output names the failing step: docs/operations/backup-and-recovery.md."
              services: "db-backup, notebook-backup, timescaledb, minio"
      - eval_time: 49h
        alertname: IndustryFlowBackupNeverCompleted
        exp_alerts: []

  # A deployment on which no database backup ever completed is raised after a day, the rehearsal after
  # a week; neither raises the stale alerts.
  - interval: 1h
    input_series:
      - series: 'up{platform="industryflow", job="node-exporter"}'
        values: '1x200'
    alert_rule_test:
      - eval_time: 23h
        alertname: IndustryFlowBackupNeverCompleted
        exp_alerts: []
      - eval_time: 25h
        alertname: IndustryFlowBackupNeverCompleted
        exp_alerts:
          - exp_labels: {severity: critical, platform: industryflow, backup: databases}
            exp_annotations:
              summary: "No database backup has ever completed"
              description: "No database backup has completed on this deployment. Run db-backup and schedule it: docs/operations/backup-and-recovery.md#running-backups."
              services: "db-backup, timescaledb, minio"
      - eval_time: 25h
        alertname: IndustryFlowBackupStale
        exp_alerts: []
      - eval_time: 6d
        alertname: IndustryFlowRestoreRehearsalNeverPassed
        exp_alerts: []
      - eval_time: 7d2h
        alertname: IndustryFlowRestoreRehearsalNeverPassed
        exp_alerts:
          - exp_labels: {severity: warning, platform: industryflow, backup: databases}
            exp_annotations:
              summary: "No restore rehearsal has ever passed"
              description: "No database restore rehearsal has passed on this deployment, so its backups count toward no recovery objective. Run restore-rehearsal and schedule it: docs/operations/backup-and-recovery.md#restore-rehearsal."
              services: "restore-rehearsal, timescaledb, minio"

  # A weekly rehearsal keeps it quiet; one that stops passing is raised nine days after its last pass.
  - interval: 1h
    input_series:
      # Passes at day 0, 7 and 14, then never again (hourly samples: a series sampled daily is stale
      # between its samples).
      - series: 'industryflow_restore_rehearsal_last_success_timestamp_seconds{platform="industryflow", backup="databases"}'
        values: '0x167 604800x167 1209600x500'
    alert_rule_test:
      - eval_time: 23d
        alertname: IndustryFlowRestoreRehearsalStale
        exp_alerts: []
      - eval_time: 23d2h
        alertname: IndustryFlowRestoreRehearsalStale
        exp_alerts:
          - exp_labels: {severity: warning, backup: databases}
            exp_annotations:
              summary: "No restore rehearsal has passed recently"
              description: "No databases restore rehearsal has passed in the last nine days; its backups count toward no recovery objective until one does. Its output names the table or object that differed: docs/operations/backup-and-recovery.md."
              services: "restore-rehearsal, notebook-rehearsal, timescaledb, minio"

  # The device CA watch is graded by what it refuses (ADR-0007 dec 10): a CRL or CA certificate check
  # that stops passing is critical, a device renewal owed is a warning, each 13h after its last pass;
  # a check that keeps passing raises nothing.
  - interval: 1h
    input_series:
      # `check` passes every 6h throughout.
      - series: 'industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="crl"}'
        values: '0x5 21600x5 43200x5 64800x5 86400x5 108000x5 129600x5 151200x5'
      # `check-certs` passes at t=0, never again.
      - series: 'industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="certs"}'
        values: '0x47'
    alert_rule_test:
      - eval_time: 12h
        alertname: IndustryFlowDeviceCertExpiring
        exp_alerts: []
      - eval_time: 14h
        alertname: IndustryFlowDeviceCertExpiring
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "A device certificate is close to expiry"
              description: "No device-certificate check has passed for 13h; docker logs industryflow-device-crl-refresh names the device. Renew it (docs/operations/device-mtls.md); an expired certificate is refused at ingestion."
              services: "device-crl-refresh"
      - eval_time: 14h
        alertname: IndustryFlowDeviceCrlStale
        exp_alerts: []
      - eval_time: 40h
        alertname: IndustryFlowDeviceCrlStale
        exp_alerts: []

  # The CRL check stops passing: critical, and the device check keeping on passing does not hide it.
  - interval: 1h
    input_series:
      - series: 'industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="crl"}'
        values: '0x47'
      - series: 'industryflow_device_ca_check_last_success_timestamp_seconds{platform="industryflow", check="certs"}'
        values: '0x5 21600x5 43200x5 64800x5 86400x5 108000x5 129600x5 151200x5'
      - series: 'industryflow_device_ca_check_last_success_timestamp_seconds{platform="other", check="crl"}'
        values: '172800x47'
    alert_rule_test:
      - eval_time: 12h
        alertname: IndustryFlowDeviceCrlStale
        exp_alerts: []
      - eval_time: 14h
        alertname: IndustryFlowDeviceCrlStale
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Device CRL or CA certificate is close to expiry"
              description: "No device CA check has passed for 13h; docker logs industryflow-device-crl-refresh names the CRL or certificate. Re-sign the CRL or replace the CA certificate (docs/operations/device-mtls.md). Once either expires, every device is refused at ingestion."
              services: "device-crl-refresh, ingestion-edge"
      - eval_time: 14h
        alertname: IndustryFlowDeviceCertExpiring
        exp_alerts: []

  # A deployment on which neither check has ever passed is raised 13h on, each at its own grade.
  - interval: 1h
    input_series:
      - series: 'up{platform="industryflow", job="node-exporter"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12h
        alertname: IndustryFlowDeviceCrlStale
        exp_alerts: []
      - eval_time: 14h
        alertname: IndustryFlowDeviceCrlStale
        exp_alerts:
          - exp_labels: {severity: critical, platform: industryflow, check: crl}
            exp_annotations:
              summary: "Device CRL or CA certificate is close to expiry"
              description: "No device CA check has ever passed on this deployment; docker logs industryflow-device-crl-refresh names the CRL or certificate, or says the device CA is not initialized (docs/operations/device-mtls.md)."
              services: "device-crl-refresh, ingestion-edge"
      - eval_time: 14h
        alertname: IndustryFlowDeviceCertExpiring
        exp_alerts:
          - exp_labels: {severity: warning, platform: industryflow, check: certs}
            exp_annotations:
              summary: "A device certificate is close to expiry"
              description: "No device-certificate check has ever passed on this deployment; docker logs industryflow-device-crl-refresh names the device or the register error (docs/operations/device-mtls.md)."
              services: "device-crl-refresh"
