# promtool test rules infrastructure/prometheus/rules/tests/platform_test.yml
rule_files:
  - ../platform.yml

evaluation_interval: 1m

tests:
  # A letter on an existing dead-letter topic raises it; the source topic and another stack do not.
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw.measurements.dlq", partition="0"}'
        values: '3x20 4x20'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw", partition="0"}'
        values: '0+100x40'
      - series: 'kafka_topic_partition_current_offset{platform="other", topic="orders.dlq", partition="0"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: sensor-data-raw.measurements.dlq
            exp_annotations:
              summary: "Readings were dead-lettered"
              description: "Letters reached sensor-data-raw.measurements.dlq in the last 15m. They raised no alert and were not written: ADR-0005."
              services: "spark-streaming, alert-service-detector"
      # The window has passed with no new letter: it clears.
      - eval_time: 39m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []

  # A topic created by its first letter starts at 1; that first letter still raises it.
  - interval: 1m
    input_series:
      - series: 'kafka_brokers{platform="industryflow"}'
        values: '1x50'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw.dlq", partition="0"}'
        values: '_x20 1x30'
    alert_rule_test:
      - eval_time: 22m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: sensor-data-raw.dlq
            exp_annotations:
              summary: "Readings were dead-lettered"
              description: "Letters reached sensor-data-raw.dlq in the last 15m. They raised no alert and were not written: ADR-0005."
              services: "spark-streaming, alert-service-detector"
      - eval_time: 45m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{platform="industryflow", job="api-gateway", instance="api-gateway:8000"}'
        values: '1x5 0x10'
      - series: 'up{platform="other", job="x", instance="x:1"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: IndustryFlowTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: industryflow
              job: api-gateway
              instance: api-gateway:8000
            exp_annotations:
              summary: "Scrape target down"
              description: "api-gateway/api-gateway:8000 has been unreachable for 5m."
              services: "api-gateway:8000"

  # A Prometheus that has just started finds old letters on an existing topic: nothing new, no alert.
  - interval: 1m
    input_series:
      - series: 'kafka_brokers{platform="industryflow"}'
        values: '1x30'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw.measurements.dlq", partition="0"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []
      - eval_time: 10m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []

  # The capability-use writer falls behind (ADR-0042 dec 7): raised after 15m above the bound, on the
  # largest report of the replicas; a backlog that drains in time, or another stack's, does not.
  - interval: 1m
    input_series:
      - series: 'capability_audit_backlog{platform="industryflow", instance="gw-1"}'
        values: '0x5 5000x30'
      - series: 'capability_audit_backlog{platform="industryflow", instance="gw-2"}'
        values: '0x5 4800x30'
      - series: 'capability_audit_backlog{platform="other", instance="x"}'
        values: '9999x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: IndustryFlowCapabilityAuditBacklog
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowCapabilityAuditBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Capability-use events are waiting to be recorded"
              description: "5000 capability-use events are in the capability store and not yet in the record; check the API gateway's capability audit writer."
              services: "api-gateway, redis"
  - interval: 1m
    input_series:
      - series: 'capability_audit_backlog{platform="industryflow", instance="gw-1"}'
        values: '5000x10 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: IndustryFlowCapabilityAuditBacklog
        exp_alerts: []
  # A rebuild within the last 15 minutes raises it; an older one and another stack's do not.
  - interval: 1m
    input_series:
      - series: 'capability_store_rebuilt_timestamp_seconds{platform="industryflow", instance="gw-1"}'
        values: '600x40'
      - series: 'capability_store_rebuilt_timestamp_seconds{platform="other", instance="x"}'
        values: '2000x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: IndustryFlowCapabilityStoreRebuilt
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The capability store was rebuilt"
              description: "The API gateway found the capability store without its rebuild record and rebuilt it: every suspension re-derived, every user signed out, every notebook server's handles gone."
              services: "redis, api-gateway"
      - eval_time: 30m
        alertname: IndustryFlowCapabilityStoreRebuilt
        exp_alerts: []
  # The store near its limit raises it; one with no limit (0) and another stack's do not.
  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{platform="industryflow", instance="redis-exporter:9121"}'
        values: '100000000x5 230000000x20'
      - series: 'redis_memory_max_bytes{platform="industryflow", instance="redis-exporter:9121"}'
        values: '268435456x25'
      - series: 'redis_memory_used_bytes{platform="industryflow", instance="external:9121"}'
        values: '900000000x25'
      - series: 'redis_memory_max_bytes{platform="industryflow", instance="external:9121"}'
        values: '0x25'
      - series: 'redis_memory_used_bytes{platform="other", instance="x"}'
        values: '250000000x25'
      - series: 'redis_memory_max_bytes{platform="other", instance="x"}'
        values: '268435456x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: IndustryFlowRedisMemoryHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: IndustryFlowRedisMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: industryflow
              instance: redis-exporter:9121
            exp_annotations:
              summary: "Redis is near its memory limit"
              description: "Redis uses 85.68% of its memory limit; at the limit it refuses writes (it never evicts)."
              services: "redis, api-gateway"
  # A dropped event fires at once; written ones, retries and another stack's drops do not.
  - interval: 1m
    input_series:
      - series: 'capability_audit_events_total{platform="industryflow", instance="gw-1", result="written"}'
        values: '0+100x40'
      - series: 'capability_audit_events_total{platform="industryflow", instance="gw-1", result="retry"}'
        values: '0+1x40'
      - series: 'capability_audit_events_total{platform="industryflow", instance="gw-1", result="refused"}'
        values: '0x20 1x20'
      - series: 'capability_audit_events_total{platform="other", instance="x", result="unreadable"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: IndustryFlowCapabilityEventsDropped
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowCapabilityEventsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Capability-use events were dropped from the record"
              description: "Capability-use events were acknowledged without being recorded in the last 15m; the API gateway's logs (capability audit) name each stream id."
              services: "api-gateway"

  # A tenant-status partition that stops carrying statuses raises it, while another still publishes;
  # a partition that never carried any, and another stack's stalled stream, do not; it clears on resume.
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="tenant-status", partition="0"}'
        values: '0+6x30 180x15 180+6x20'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="tenant-status", partition="1"}'
        values: '0+6x65'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="tenant-status", partition="2"}'
        values: '0x65'
      - series: 'kafka_topic_partition_current_offset{platform="other", topic="tenant-status", partition="0"}'
        values: '0+6x20 120x45'
    alert_rule_test:
      - eval_time: 35m
        alertname: IndustryFlowTenantStatusStalled
        exp_alerts: []
      - eval_time: 36m
        alertname: IndustryFlowTenantStatusStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              partition: "0"
            exp_annotations:
              summary: "The tenant-status stream has stalled"
              description: "Partition 0 of tenant-status has carried no status for 5m. Ingestion has forgotten every suspension and lets those devices through; the writers still refuse them: ADR-0033 dec 3."
              services: "alert-service-detector, kafka"
      - eval_time: 50m
        alertname: IndustryFlowTenantStatusStalled
        exp_alerts: []

  # Slots neutralized by the kill-switch raise it at once and it clears 15m after the last one;
  # another stack's counter does not raise it.
  - interval: 1m
    input_series:
      - series: 'ml_stateful_features_neutralized_total{platform="industryflow", job="ml-service"}'
        values: '0x10 0+5x10 50x30'
      - series: 'ml_stateful_features_neutralized_total{platform="other", job="ml-service"}'
        values: '0+5x50'
    alert_rule_test:
      - eval_time: 9m
        alertname: IndustryFlowStatefulFeaturesNeutralized
        exp_alerts: []
      - eval_time: 13m
        alertname: IndustryFlowStatefulFeaturesNeutralized
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Stateful features are neutralized: the kill-switch is off"
              description: "Stateful feature slots were served neutral in the last 15m because the stateful-feature kill-switch is off; scores using them are degraded (ADR-0024)."
              services: "ml-service-api"
      - eval_time: 40m
        alertname: IndustryFlowStatefulFeaturesNeutralized
        exp_alerts: []

  # Unavailable aggregates fire only when sustained: a 5m stretch (a sensor's first window) does not,
  # a stretch past 15m does.
  - interval: 1m
    input_series:
      - series: 'ml_stateful_features_unavailable_total{platform="industryflow", job="ml-service"}'
        values: '0x5 0+1x5 5x30 5+1x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: IndustryFlowStatefulFeaturesUnavailable
        exp_alerts: []
      - eval_time: 18m
        alertname: IndustryFlowStatefulFeaturesUnavailable
        exp_alerts: []
      - eval_time: 22m
        alertname: IndustryFlowStatefulFeaturesUnavailable
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowStatefulFeaturesUnavailable
        exp_alerts: []
      - eval_time: 55m
        alertname: IndustryFlowStatefulFeaturesUnavailable
        exp_alerts: []
      - eval_time: 75m
        alertname: IndustryFlowStatefulFeaturesUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Stateful feature aggregates are unavailable"
              description: "Stateful feature slots have been served neutral for 15m because their aggregate was unavailable; scores using them are degraded (ADR-0044 dec 3)."
              services: "ml-service-api, timescaledb, spark-aggregations"

  # Quota refusals fire per cap only when sustained: a 5m burst does not, refusals past 15m do.
  - interval: 1m
    input_series:
      - series: 'tenant_quota_refusals{platform="industryflow", job="api-gateway", pid="1", cap="readings_per_second"}'
        values: '0x5 0+10x5 50x30 50+3x40'
      - series: 'tenant_quota_refusals{platform="industryflow", job="api-gateway", pid="2", cap="readings_per_second"}'
        values: '0x5 0+10x5 50x30 50+3x40'
      - series: 'tenant_quota_refusals{platform="other", job="api-gateway", pid="1", cap="readings_per_second"}'
        values: '0+10x80'
    alert_rule_test:
      - eval_time: 12m
        alertname: IndustryFlowTenantQuotaRefusals
        exp_alerts: []
      - eval_time: 30m
        alertname: IndustryFlowTenantQuotaRefusals
        exp_alerts: []
      - eval_time: 75m
        alertname: IndustryFlowTenantQuotaRefusals
        exp_alerts:
          - exp_labels:
              severity: warning
              cap: readings_per_second
            exp_annotations:
              summary: "Tenants are being refused at a quota cap"
              description: "Demands have been refused at the readings_per_second cap for 15m. Read which tenants at GET /api/platform/quotas/refusals, then raise a tenant's override or the default (ADR-0049)."
              services: "ingestion-service, notebook-hub, api-gateway"

  # A count that cannot be read fires at once: no cap holds meanwhile.
  - interval: 1m
    input_series:
      - series: 'tenant_quota_count_unavailable_total{platform="industryflow", job="ingestion-service", cap="readings_per_second"}'
        values: '0x10 0+1x3 3x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: IndustryFlowTenantQuotaCountUnavailable
        exp_alerts: []
      - eval_time: 13m
        alertname: IndustryFlowTenantQuotaCountUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              cap: readings_per_second
            exp_annotations:
              summary: "Tenant quotas are not enforced: the shared count is unreachable"
              description: "Demands were admitted without their readings_per_second cap in the last 5m because the shared count could not be read; no cap holds until it can (ADR-0049 dec 8)."
              services: "ingestion-service, notebook-sql-proxy, quota-redis"
      - eval_time: 30m
        alertname: IndustryFlowTenantQuotaCountUnavailable
        exp_alerts: []

  # A SQL session admitted without its count, as two gateway workers report the proxy's count: fires at
  # once; the count lost with the store (a fall) is no admission.
  - interval: 1m
    input_series:
      - series: 'tenant_quota_count_unavailable{platform="industryflow", job="api-gateway", instance="w1", cap="sql_sessions"}'
        values: '0x10 1 2 2x20 0x10'
      - series: 'tenant_quota_count_unavailable{platform="industryflow", job="api-gateway", instance="w2", cap="sql_sessions"}'
        values: '0x10 1 2 2x20 0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: IndustryFlowTenantQuotaCountUnavailable
        exp_alerts: []
      - eval_time: 13m
        alertname: IndustryFlowTenantQuotaCountUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              cap: sql_sessions
            exp_annotations:
              summary: "Tenant quotas are not enforced: the shared count is unreachable"
              description: "Demands were admitted without their sql_sessions cap in the last 5m because the shared count could not be read; no cap holds until it can (ADR-0049 dec 8)."
              services: "ingestion-service, notebook-sql-proxy, quota-redis"
      - eval_time: 36m
        alertname: IndustryFlowTenantQuotaCountUnavailable
        exp_alerts: []

  # Tenants without a fresh storage measurement: a dip does not fire, 30m does.
  - interval: 1m
    input_series:
      - series: 'tenant_storage_unmeasured{platform="industryflow", job="api-gateway", instance="w1"}'
        values: '0x5 2x10 0x5 1x60'
    alert_rule_test:
      - eval_time: 14m
        alertname: IndustryFlowTenantStorageUnmeasured
        exp_alerts: []
      - eval_time: 60m
        alertname: IndustryFlowTenantStorageUnmeasured
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Stored-data caps are not enforced: tenants have no fresh storage measurement"
              description: "1 tenant(s) have had no measurement of their stored data newer than TENANT_USAGE_STALE_SECONDS for 30m; no stored-data cap holds for them (ADR-0049 dec 8)."
              services: "tenant-usage, api-gateway"

  # Every tenant's SQL sessions at their total: a burst does not fire, 15m of refusals does.
  - interval: 1m
    input_series:
      - series: 'tenant_quota_total_refusals{platform="industryflow", job="api-gateway", instance="w1"}'
        values: '0x10 1x5 1+1x60'
    alert_rule_test:
      - eval_time: 14m
        alertname: IndustryFlowNotebookSqlSessionsFull
        exp_alerts: []
      - eval_time: 40m
        alertname: IndustryFlowNotebookSqlSessionsFull
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Notebook SQL sessions are refused: every tenant's together are at their total"
              description: "SQL sessions have been refused at NOTEBOOK_SQL_SESSIONS_TOTAL for 15m. Raise it with max_connections, or lower tenants' sql_sessions caps (ADR-0049 dec 10)."
              services: "notebook-sql-proxy, api-gateway"
