# promtool test rules infrastructure/prometheus/rules/tests/platform_test.yml
rule_files:
  - ../platform.yml

evaluation_interval: 1m

tests:
  # A letter on an existing dead-letter topic raises it; the source topic and another stack do not.
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw.measurements.dlq", partition="0"}'
        values: '3x20 4x20'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw", partition="0"}'
        values: '0+100x40'
      - series: 'kafka_topic_partition_current_offset{platform="other", topic="orders.dlq", partition="0"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: sensor-data-raw.measurements.dlq
            exp_annotations:
              summary: "Readings were dead-lettered"
              description: "Letters reached sensor-data-raw.measurements.dlq in the last 15m. They raised no alert and were not written: docs/operations/dead-letters.md."
      # The window has passed with no new letter: it clears.
      - eval_time: 39m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []

  # A topic created by its first letter starts at 1; that first letter still raises it.
  - interval: 1m
    input_series:
      - series: 'kafka_brokers{platform="industryflow"}'
        values: '1x50'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw.dlq", partition="0"}'
        values: '_x20 1x30'
    alert_rule_test:
      - eval_time: 22m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: sensor-data-raw.dlq
            exp_annotations:
              summary: "Readings were dead-lettered"
              description: "Letters reached sensor-data-raw.dlq in the last 15m. They raised no alert and were not written: docs/operations/dead-letters.md."
      - eval_time: 45m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{platform="industryflow", job="api-gateway", instance="api-gateway:8000"}'
        values: '1x5 0x10'
      - series: 'up{platform="other", job="x", instance="x:1"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: IndustryFlowTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              platform: industryflow
              job: api-gateway
              instance: api-gateway:8000
            exp_annotations:
              summary: "Scrape target down"
              description: "api-gateway/api-gateway:8000 has been unreachable for 5m."

  # A Prometheus that has just started finds old letters on an existing topic: nothing new, no alert.
  - interval: 1m
    input_series:
      - series: 'kafka_brokers{platform="industryflow"}'
        values: '1x30'
      - series: 'kafka_topic_partition_current_offset{platform="industryflow", topic="sensor-data-raw.measurements.dlq", partition="0"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 1m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []
      - eval_time: 10m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowDeadLetteredReadings
        exp_alerts: []

  # The capability-use writer falls behind (ADR-0042 dec 7): raised after 15m above the bound, on the
  # largest report of the replicas; a backlog that drains in time, or another stack's, does not.
  - interval: 1m
    input_series:
      - series: 'capability_audit_backlog{platform="industryflow", instance="gw-1"}'
        values: '0x5 5000x30'
      - series: 'capability_audit_backlog{platform="industryflow", instance="gw-2"}'
        values: '0x5 4800x30'
      - series: 'capability_audit_backlog{platform="other", instance="x"}'
        values: '9999x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: IndustryFlowCapabilityAuditBacklog
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowCapabilityAuditBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Capability-use events are waiting to be recorded"
              description: "5000 capability-use events are in the capability store and not yet in the record; check the API gateway's capability audit writer."
  - interval: 1m
    input_series:
      - series: 'capability_audit_backlog{platform="industryflow", instance="gw-1"}'
        values: '5000x10 0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: IndustryFlowCapabilityAuditBacklog
        exp_alerts: []
  # The store near its limit raises it; one with no limit (0) and another stack's do not.
  - interval: 1m
    input_series:
      - series: 'redis_memory_used_bytes{platform="industryflow", instance="redis-exporter:9121"}'
        values: '100000000x5 230000000x20'
      - series: 'redis_memory_max_bytes{platform="industryflow", instance="redis-exporter:9121"}'
        values: '268435456x25'
      - series: 'redis_memory_used_bytes{platform="industryflow", instance="external:9121"}'
        values: '900000000x25'
      - series: 'redis_memory_max_bytes{platform="industryflow", instance="external:9121"}'
        values: '0x25'
      - series: 'redis_memory_used_bytes{platform="other", instance="x"}'
        values: '250000000x25'
      - series: 'redis_memory_max_bytes{platform="other", instance="x"}'
        values: '268435456x25'
    alert_rule_test:
      - eval_time: 10m
        alertname: IndustryFlowRedisMemoryHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: IndustryFlowRedisMemoryHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              platform: industryflow
              instance: redis-exporter:9121
            exp_annotations:
              summary: "Redis is near its memory limit"
              description: "Redis uses 85.68% of its memory limit; at the limit it refuses writes (it never evicts)."
  # A dropped event fires at once; written ones, retries and another stack's drops do not.
  - interval: 1m
    input_series:
      - series: 'capability_audit_events_total{platform="industryflow", instance="gw-1", result="written"}'
        values: '0+100x40'
      - series: 'capability_audit_events_total{platform="industryflow", instance="gw-1", result="retry"}'
        values: '0+1x40'
      - series: 'capability_audit_events_total{platform="industryflow", instance="gw-1", result="refused"}'
        values: '0x20 1x20'
      - series: 'capability_audit_events_total{platform="other", instance="x", result="unreadable"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: IndustryFlowCapabilityEventsDropped
        exp_alerts: []
      - eval_time: 25m
        alertname: IndustryFlowCapabilityEventsDropped
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Capability-use events were dropped from the record"
              description: "Capability-use events were acknowledged without being recorded in the last 15m; the API gateway's logs (capability audit) name each stream id."
