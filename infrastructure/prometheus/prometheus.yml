global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'industryflow'
    environment: 'production'

# The platform alert rules, one source with the chart's PrometheusRule (ADR-0016 dec 1).
rule_files:
  - /etc/prometheus/rules/*.yml

# Firing alerts go to the Alertmanager beside Prometheus (ADR-0016 dec 4); its receivers are the
# operator's (infrastructure/alertmanager/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          platform: industryflow

  # Docker containers via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          platform: industryflow

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          platform: industryflow

  # PostgreSQL/TimescaleDB
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          platform: industryflow

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          platform: industryflow

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']
        labels:
          platform: industryflow

  # ML Service
  - job_name: 'ml-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-service-api:8002']
        labels:
          platform: industryflow

  # Ingestion Service. It is reachable only from the edge (ADR-0002 dec 3), so it is scraped
  # through the edge's internal, metrics-only listener, never the public mTLS port.
  - job_name: 'ingestion-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ingestion-edge:9003']
        labels:
          platform: industryflow

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          platform: industryflow

  # Spark — native PrometheusServlet on each component's web UI (item 7). The driver UI (4040)
  # lives in each job container; the executor metrics need spark.ui.prometheus.enabled.
  - job_name: 'spark-driver'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['spark-streaming:4040', 'spark-aggregations:4040']
        labels:
          platform: industryflow
  - job_name: 'spark-executors'
    metrics_path: '/metrics/executors/prometheus'
    static_configs:
      - targets: ['spark-streaming:4040', 'spark-aggregations:4040']
        labels:
          platform: industryflow
  - job_name: 'spark-master'
    metrics_path: '/metrics/master/prometheus'
    static_configs:
      - targets: ['spark-master:8080']
        labels:
          platform: industryflow

  # Loki has no container healthcheck (distroless image), so `up` here is its health signal.
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          platform: industryflow

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
        labels:
          platform: industryflow

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          platform: industryflow
