global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'industryflow'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker containers via cAdvisor
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL/TimescaleDB
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']

  # Alert Service
  - job_name: 'alert-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['alert-service-api:8001']

  # ML Service
  - job_name: 'ml-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-service-api:8002']

  # Ingestion Service (scraped directly on the service port, not via the mTLS edge)
  - job_name: 'ingestion-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ingestion-service:8003']

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # Spark — native PrometheusServlet on each component's web UI (item 7). The driver UI (4040)
  # lives in each job container; the executor metrics need spark.ui.prometheus.enabled.
  - job_name: 'spark-driver'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['spark-streaming:4040', 'spark-aggregations:4040']
  - job_name: 'spark-executors'
    metrics_path: '/metrics/executors/prometheus'
    static_configs:
      - targets: ['spark-streaming:4040', 'spark-aggregations:4040']
  - job_name: 'spark-master'
    metrics_path: '/metrics/master/prometheus'
    static_configs:
      - targets: ['spark-master:8080']
