apiVersion: 1

providers:
  - name: 'IndustryFlow Dashboards'
    orgId: 1
    folder: 'IndustryFlow'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
