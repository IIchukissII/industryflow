apiVersion: 1

# Operator-facing platform plane only (ADR-0016): metrics and logs. There is deliberately no database
# datasource — the database holds tenant data, and a shared monitoring Grafana that can query it
# would put every tenant's readings in front of every operator (ADR-0016 dec 5). Database health
# reaches Grafana as the postgres-exporter's aggregate metrics, through Prometheus.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: Prometheus
          matcherRegex: "container_id=(\\w+)"
          name: container
          url: $${__value.raw}
