# mTLS ingestion edge (ADR-0002 dec 2): terminates TLS, verifies the device client
# certificate against the device CA chain + CRL (ADR-0007), and forwards the request to
# the ingestion service over the internal network with the VERIFIED certificate attached.
# The ingestion service is reachable only via this proxy (ADR-0002 dec 3).

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Server identity presented to the device during the handshake. Reuses the internal-CA
    # server certificate (a distinct trust direction from the device CA — ADR-0007 dec 7).
    ssl_certificate     /etc/nginx/server/tls.crt;
    ssl_certificate_key /etc/nginx/server/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Device client-certificate verification: trust anchors + revocation list.
    ssl_client_certificate /etc/nginx/device-ca/ca-chain.crt;
    ssl_crl                /etc/nginx/device-ca/crl/device-ca.crl;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    client_max_body_size 1m;

    # Re-resolve the upstream through Docker's embedded DNS (127.0.0.11) rather than caching
    # its address at startup. A static proxy_pass pins the IP nginx saw at boot, so recreating
    # ingestion-service (new container IP) strands the edge on a dead address (502). Putting
    # the upstream in a variable forces per-request resolution, honouring the short TTL below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Observability endpoints are internal-only: Prometheus scrapes ingestion-service:8003
    # directly over the cluster network, so the public mTLS edge must never serve them to
    # devices (item 7 / ADR-0002 least-exposure).
    location = /metrics { return 404; }

    location / {
        # ssl_verify_client on already fails the handshake for an absent/invalid cert;
        # this is a defence-in-depth guard.
        if ($ssl_client_verify != SUCCESS) { return 403; }

        set $ingestion_upstream ingestion-service:8003;
        proxy_pass http://$ingestion_upstream;
        proxy_set_header Host $host;
        # Forward the verified identity. Because these are set here, they overwrite any
        # X-Client-* headers a client tried to smuggle in (anti-spoofing — ADR-0002 dec 3).
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
    }
}
