# mTLS ingestion edge (ADR-0002 dec 2): terminates TLS, verifies the device client
# certificate against the device CA chain + CRL (ADR-0007), and forwards the request to
# the ingestion service over the internal network with the VERIFIED certificate attached.
# The ingestion service is reachable only via this proxy (ADR-0002 dec 3).

# One pool of kept-alive connections to the ingestion service. A connection per request leaves a
# TIME_WAIT socket each, which exhausts the edge's ephemeral ports near 430 requests/s (connect()
# fails with "Address not available", 502). `resolve` re-resolves the name through Docker's
# embedded DNS, so recreating ingestion-service (new container IP) does not strand the edge on a
# dead address. keepalive_timeout stays below uvicorn's 5 s, so nginx never reuses a connection the
# service is closing.
upstream ingestion_service {
    zone ingestion_service 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ingestion-service:8003 resolve;
    keepalive 32;
    keepalive_timeout 4s;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Server identity presented to the device during the handshake. Reuses the internal-CA
    # server certificate (a distinct trust direction from the device CA — ADR-0007 dec 7).
    ssl_certificate     /etc/nginx/server/tls.crt;
    ssl_certificate_key /etc/nginx/server/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Device client-certificate verification: trust anchors + revocation list.
    ssl_client_certificate /etc/nginx/device-ca/ca-chain.crt;
    ssl_crl                /etc/nginx/device-ca/crl/device-ca.crl;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    client_max_body_size 1m;

    # Observability endpoints are internal-only: Prometheus scrapes them on the metrics-only
    # listener below, so the public mTLS edge must never serve them to devices (item 7 /
    # ADR-0002 least-exposure).
    location = /metrics { return 404; }

    location / {
        # ssl_verify_client on already fails the handshake for an absent/invalid cert;
        # this is a defence-in-depth guard.
        if ($ssl_client_verify != SUCCESS) { return 403; }

        proxy_pass http://ingestion_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Forward the verified identity. Because these are set here, they overwrite any
        # X-Client-* headers a client tried to smuggle in (anti-spoofing — ADR-0002 dec 3).
        # This edge is the X-Client-* convention: ingestion-service runs with
        # DEVICE_IDENTITY_HEADERS=x-client and reads nothing else.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
        # Drop the other edge convention's (ingress-nginx) headers a client may have sent. An
        # empty value makes nginx omit the header. The service refuses any that slip through.
        proxy_set_header ssl-client-verify     "";
        proxy_set_header ssl-client-cert       "";
        proxy_set_header ssl-client-subject-dn "";
        proxy_set_header ssl-client-issuer-dn  "";
    }
}

# Internal metrics listener (item 7). ingestion-service sits on networks only this edge and
# Kafka share (ADR-0002 dec 3), so Prometheus scrapes its /metrics through here. This port is
# not host-published and serves nothing but /metrics: no device path is reachable on it.
server {
    listen 9003;
    server_name _;

    location = /metrics {
        proxy_pass http://ingestion_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / { return 404; }
}
