# Spark 4's base image runs as a user whose passwd home is /nonexistent, and ivy derives its cache
# directory from the JVM's user.home system property (NOT the $HOME env var) — so a `--packages`
# resolution would try to write its cache under /nonexistent and die at submit. Point ivy at a
# writable, image-baked directory instead. This is read by every spark-submit — the build-time
# pre-download, the runtime CMD — and by the driver's own package resolution, so all three agree.
spark.jars.ivy /home/spark/.ivy2
