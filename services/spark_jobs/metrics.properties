#
# Spark metrics -> Prometheus (item 7 observability). The built-in PrometheusServlet (Spark 3.0+)
# serves each component's metrics on its EXISTING web UI port — no extra exporter/agent:
#   driver       :4040/metrics/prometheus
#   executors    :4040/metrics/executors/prometheus   (needs spark.ui.prometheus.enabled=true)
#   master       :8080/metrics/master/prometheus
#   worker       :8081/metrics/prometheus
#   applications :8080/metrics/applications/prometheus
# Read automatically from $SPARK_HOME/conf/metrics.properties by every Spark JVM. Prometheus
# scrapes these in-cluster (see infrastructure/prometheus/prometheus.yml).

*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# JVM source (heap, GC, threads) on every component.
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
