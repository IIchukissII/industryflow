#
# Notebook SSO reverse proxy (ADR-0014 / ADR-0018 / ADR-0048). Everything the notebook origin serves
# passes here. The hub runs NO login of its own: the origin is entered by spending a platform-minted
# ticket for a notebook session (/enter), every request is checked against the platform's session
# verification through that notebook session, and the verified identity is forwarded to the hub,
# OVERWRITING any client-supplied identity (anti-spoofing, ADR-0014 dec 2-3).
#
# A template: the nginx image renders it at start (envsubst, NGINX_ENVSUBST_FILTER=^NOTEBOOK_),
# substituting the NOTEBOOK_BASE_URL, NOTEBOOK_PLATFORM_ORIGIN and NOTEBOOK_SSO_PROXY_SECRET
# placeholders below. Every other `$name` here is an nginx variable.

worker_processes auto;
events { worker_connections 1024; }

http {
    # WebSocket upgrade plumbing for the Lab/kernel channels.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker embedded DNS (re-resolve on recreate)

    # The proxy's credential to the hub (ADR-0014 dec 3): the hub honours a forwarded identity only
    # on a request carrying this secret, because kernels reach the hub API too. Sent on hub routes
    # only, never on /user/ traffic, which chp hands to single-user servers where user code runs.
    # Matched on the raw request path, and withheld from any path another hop might route
    # differently (dot segments, encoded separators, empty segments).
    map $request_uri $if_hub_route {
        default 0;
        "~^${NOTEBOOK_BASE_URL}hub/" 1;
    }
    map $request_uri $if_ambiguous_path {
        default 0;
        "~^[^?]*(\.\.|%2[eEfF]|%5[cC]|//|\\\\)" 1;
    }
    map "$if_hub_route$if_ambiguous_path" $if_sso_proxy_secret {
        default "";
        "10"    "${NOTEBOOK_SSO_PROXY_SECRET}";
    }
    # The notebook session cookie is the only one the session check reads; the platform's own cookies
    # reach this origin (the browser does not separate ports, and a sibling host is the same site) and
    # are honoured nowhere here (ADR-0048 dec 2). Nothing behind the proxy gets any of them: chp hands
    # /user/ traffic to the single-user server, where user code runs (ADR-0014 dec 5).
    map $http_cookie $if_notebook_session {
        default "";
        "~(?:^|;[ ]*)if_nb=([^;]*)" "if_nb=$1";
    }
    map $http_cookie $if_cookie_no_access {
        default $http_cookie;
        "~^(.*?)(?:^|;[ ]*)if_access=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_access $if_cookie_no_csrf {
        default $if_cookie_no_access;
        "~^(.*?)(?:^|;[ ]*)if_csrf=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_csrf $if_cookie_no_refresh {
        default $if_cookie_no_csrf;
        "~^(.*?)(?:^|;[ ]*)if_refresh=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_refresh $if_cookie_no_notebook {
        default $if_cookie_no_refresh;
        "~^(.*?)(?:^|;[ ]*)if_nb=[^;]*(.*)$" "$1$2";
    }
    map $if_cookie_no_notebook $if_hub_cookie {
        default $if_cookie_no_notebook;
        "~^;[ ]*(.*)$" "$1";
    }
    # A browser without a notebook session: a page in the platform's frame is told so, a top-level one
    # is sent to the platform's notebooks page, which enters again.
    map $http_sec_fetch_dest $if_no_session_top_level {
        default 0;
        document 1;
    }

    server {
        # Plain HTTP behind the platform's TLS edge, which serves the notebook origin (ADR-0048 dec 6):
        # on its own port under compose, on its own host on a Kubernetes ingress. Never exposed off the
        # internal network.
        listen 8080;
        server_name _;
        absolute_redirect off;

        # Subrequest: the notebook session, checked by api-gateway /auth/verify, which returns the
        # verified identity in X-IF-* RESPONSE headers (ADR-0014 dec 2). Body is not forwarded.
        location = /_auth_verify {
            internal;
            set $verify http://api-gateway:8000/auth/verify;
            proxy_pass $verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $if_notebook_session;
        }

        # The notebook origin's one public entry (ADR-0048 dec 3, ADR-0014 dec 6): a platform page posts
        # its ticket here; the gateway spends it and answers with the notebook session cookie. The
        # Origin and Host it judges by pass unchanged; no cookie is sent.
        location = /enter {
            limit_except POST { deny all; }
            client_max_body_size 4k;
            set $entry http://api-gateway:8000/auth/notebook-entry;
            proxy_pass $entry;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_intercept_errors on;
            error_page 401 403 = @no_session;
        }

        # The platform's sign-out signs out of the hub (ADR-0014 dec 7) without knowing its path.
        location = /logout {
            return 302 ${NOTEBOOK_BASE_URL}hub/logout;
        }

        location = / {
            return 302 ${NOTEBOOK_BASE_URL};
        }

        location / {
            auth_request /_auth_verify;
            # Lift the verified identity from the auth subrequest...
            auth_request_set $if_user $upstream_http_x_if_user;
            auth_request_set $if_company $upstream_http_x_if_company_id;
            auth_request_set $if_role $upstream_http_x_if_role;
            # ...and forward it to the hub, overwriting anything the client sent.
            proxy_set_header X-IF-User $if_user;
            proxy_set_header X-IF-Company-Id $if_company;
            proxy_set_header X-IF-Role $if_role;
            # Always set, so a client-supplied value never passes; empty (not sent) off hub routes.
            proxy_set_header X-IF-SSO-Proxy-Secret $if_sso_proxy_secret;
            # No platform cookie and not the notebook session's (the maps above).
            proxy_set_header Cookie $if_hub_cookie;

            # The hub's browser-facing proxy (chp), on an address only the platform network resolves.
            set $hub http://notebook-hub-public:8000;
            proxy_pass $hub;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            error_page 401 = @no_session;
        }

        location @no_session {
            if ($if_no_session_top_level) {
                return 302 ${NOTEBOOK_PLATFORM_ORIGIN}/notebooks;
            }
            default_type text/html;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors ${NOTEBOOK_PLATFORM_ORIGIN}" always;
            add_header Cache-Control "no-store" always;
            return 401 '<!doctype html><title>Notebooks</title><p>Your notebook session has ended. <a href="${NOTEBOOK_PLATFORM_ORIGIN}/notebooks" target="_top">Open notebooks again</a>.</p>';
        }
    }
}
