#
# Notebook SSO reverse proxy (ADR-0014 / ADR-0018). The hub runs NO login of its own; this proxy
# is its only entry point. It validates the platform session against api-gateway and forwards the
# verified identity to the hub, OVERWRITING any client-supplied identity (anti-spoofing,
# ADR-0014 dec 2-3). A logged-in platform user reaches notebooks without a second login.

worker_processes auto;
events { worker_connections 1024; }

http {
    # WebSocket upgrade plumbing for the Lab/kernel channels.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;  # Docker embedded DNS (re-resolve on recreate)

    server {
        listen 8080;
        server_name _;

        # Subrequest: validate the platform session cookie. api-gateway /auth/verify returns the
        # verified identity in X-IF-* RESPONSE headers (ADR-0014). Body is not forwarded.
        location = /_auth_verify {
            internal;
            set $verify http://api-gateway:8000/auth/verify;
            proxy_pass $verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        location / {
            auth_request /_auth_verify;
            # Lift the verified identity from the auth subrequest...
            auth_request_set $if_user $upstream_http_x_if_user;
            auth_request_set $if_company $upstream_http_x_if_company_id;
            auth_request_set $if_role $upstream_http_x_if_role;
            # ...and forward it to the hub, overwriting anything the client sent.
            proxy_set_header X-IF-User $if_user;
            proxy_set_header X-IF-Company-Id $if_company;
            proxy_set_header X-IF-Role $if_role;

            set $hub http://notebook-hub:8000;
            proxy_pass $hub;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Send an unauthenticated visitor to the platform login rather than a bare 401.
        error_page 401 = @login_redirect;
        location @login_redirect {
            return 302 /;
        }
    }
}
