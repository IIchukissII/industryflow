server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward client info to the gateway for every proxied location below.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reverse-proxy the API to the gateway so the app is same-origin: cookies are
    # first-party and no CORS is needed (ADR-0004 / ADR-0009). The gateway is the single
    # entry point and routes onward to the other services.
    location /api/         { proxy_pass http://api-gateway:8000; }
    location /auth/        { proxy_pass http://api-gateway:8000; }
    location /users/       { proxy_pass http://api-gateway:8000; }
    location = /health     { proxy_pass http://api-gateway:8000; }
    location /docs         { proxy_pass http://api-gateway:8000; }
    location /openapi.json { proxy_pass http://api-gateway:8000; }

    # WebSocket (sensor stream) — needs the HTTP/1.1 upgrade headers.
    location /ws/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Single-page app: serve index.html for any non-file route (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
