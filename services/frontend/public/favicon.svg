<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IndustryFlow">
  <!-- SPDX-FileCopyrightText: 2026 The IndustryFlow contributors -->
  <!-- SPDX-License-Identifier: CC-BY-SA-4.0 -->
  <!-- The platform core: a glowing gateway at the middle of the ground, ringed by
       strata, with sensor streams converging inward. Redesigned in brand blue. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbe6ff"/>
      <stop offset="35%" stop-color="#5b8bff"/>
      <stop offset="75%" stop-color="#2962ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2962ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0a0e27"/>

  <!-- converging sensor streams -->
  <g stroke="#5b8bff" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="59" y1="32" x2="45" y2="32"/>
    <line x1="51.1" y1="12.9" x2="41.2" y2="22.8"/>
    <line x1="32" y1="5" x2="32" y2="19"/>
    <line x1="12.9" y1="12.9" x2="22.8" y2="22.8"/>
    <line x1="5" y1="32" x2="19" y2="32"/>
    <line x1="12.9" y1="51.1" x2="22.8" y2="41.2"/>
    <line x1="32" y1="59" x2="32" y2="45"/>
    <line x1="51.1" y1="51.1" x2="41.2" y2="41.2"/>
  </g>

  <!-- ground strata rings -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#2962ff" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#3a5bd0" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.8"/>

  <!-- sensor nodes on the surface ring -->
  <g fill="#9db8ff">
    <circle cx="59" cy="32" r="2.3"/>
    <circle cx="51.1" cy="12.9" r="2.3"/>
    <circle cx="32" cy="5" r="2.3"/>
    <circle cx="12.9" cy="12.9" r="2.3"/>
    <circle cx="5" cy="32" r="2.3"/>
    <circle cx="12.9" cy="51.1" r="2.3"/>
    <circle cx="32" cy="59" r="2.3"/>
    <circle cx="51.1" cy="51.1" r="2.3"/>
  </g>

  <!-- glowing core (the "self" at the middle) -->
  <circle cx="32" cy="32" r="13" fill="url(#core)"/>
  <circle cx="32" cy="32" r="4.2" fill="#eaf1ff"/>
</svg>
