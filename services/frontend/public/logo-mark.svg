    <radialGradient id="lmcore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbf6ea"/>
      <stop offset="30%" stop-color="#e6c67c"/>
      <stop offset="72%" stop-color="#cfa94e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cfa94e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#cfa94e" stroke-width="2.4" stroke-linecap="round" opacity="0.85">
    <line x1="59" y1="32" x2="45" y2="32"/>
    <line x1="51.1" y1="12.9" x2="41.2" y2="22.8"/>
    <line x1="32" y1="5" x2="32" y2="19"/>
    <line x1="12.9" y1="12.9" x2="22.8" y2="22.8"/>
    <line x1="5" y1="32" x2="19" y2="32"/>
    <line x1="12.9" y1="51.1" x2="22.8" y2="41.2"/>
    <line x1="32" y1="59" x2="32" y2="45"/>
    <line x1="51.1" y1="51.1" x2="41.2" y2="41.2"/>
  </g>

  <circle cx="32" cy="32" r="27" fill="none" stroke="#cfa94e" stroke-width="2.2"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#b98b32" stroke-width="1.6" stroke-dasharray="2 5" opacity="0.8"/>

  <g fill="#cfa94e">
    <circle cx="59" cy="32" r="2.3"/>
    <circle cx="51.1" cy="12.9" r="2.3"/>
    <circle cx="32" cy="5" r="2.3"/>
    <circle cx="12.9" cy="12.9" r="2.3"/>
    <circle cx="5" cy="32" r="2.3"/>
    <circle cx="12.9" cy="51.1" r="2.3"/>
    <circle cx="32" cy="59" r="2.3"/>
    <circle cx="51.1" cy="51.1" r="2.3"/>
  </g>

  <circle cx="32" cy="32" r="13" fill="url(#lmcore)"/>
  <circle cx="32" cy="32" r="4.2" fill="#f6efe0"/>
