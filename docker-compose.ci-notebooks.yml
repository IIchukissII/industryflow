# CI-only overlay for the tenant-isolation proof (db-tenant-isolation.yml) and the tracking-gateway
# integration workflow.
#
# In production the SQL proxy is deliberately NOT published on a host port — only same-network
# kernels reach it at notebook-sql-proxy:6432 (see docker-compose.yml). The end-to-end isolation
# test, however, runs on the CI host and drives the proxy as a Postgres client, so it needs the
# port reachable on loopback. This overlay publishes it for CI only; it is never layered into a
# real deployment. Loopback-bound (127.0.0.1) to match how the DB and Redis are exposed.
#
# No TLS relaxation: with TLS_CERT_DIR unset, db-cert-init publishes the CA of the DB cert it staged
# to the clients' default CA mount, so the proxy and MLflow verify the server (verify-full, ADR-0017)
# here exactly as in a deployment.
services:
  notebook-sql-proxy:
    ports:
      - "127.0.0.1:6432:6432"
    environment:
      # Re-check each open session's capability every second, so the revoke-ends-an-open-session
      # proof completes in seconds rather than at the production cadence.
      SQL_PROXY_REVALIDATE_SECONDS: "1"
