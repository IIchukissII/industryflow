# CI-only overlay for the tenant-isolation proof (db-tenant-isolation.yml).
#
# In production the SQL proxy is deliberately NOT published on a host port — only same-network
# kernels reach it at notebook-sql-proxy:6432 (see docker-compose.yml). The end-to-end isolation
# test, however, runs on the CI host and drives the proxy as a Postgres client, so it needs the
# port reachable on loopback. This overlay publishes it for CI only; it is never layered into a
# real deployment. Loopback-bound (127.0.0.1) to match how the DB and Redis are exposed.
services:
  notebook-sql-proxy:
    ports:
      - "127.0.0.1:6432:6432"
    environment:
      # Upstream TLS to the DB is REQUIREd (pg_hba is hostssl-only) but not cert-verified: CI's
      # db-cert-init takes its self-signed fallback and stages ca.crt only into the db-certs
      # volume, never into the frontend-certs volume the proxy mounts for its CA — so verify-full
      # would fail on a missing /etc/ssl/industryflow/ca.crt. `require` encrypts (satisfying
      # hostssl) without a CA file. Upstream-cert *verification* (ADR-0017) is proven separately
      # by test_tls_integration.py; it is not what this tenant-isolation proof asserts.
      SQL_PROXY_DB_SSLMODE: require

  # Same CI-only TLS relaxation for MLflow (used by tracking-gateway-integration.yml): mlflow reaches
  # the hostssl DB, but CI stages no CA into its mounted cert volume, so verify-full would fail on a
  # missing ca.crt. PGSSLMODE=require encrypts without CA verification; mlflow's --backend-store-uri
  # arg carries no sslmode, so this env is what libpq honours.
  mlflow:
    environment:
      PGSSLMODE: require
