# Automated dependency updates. Everything is GROUPED so each ecosystem opens at most a couple of
# PRs across all directories, not one PR per dependency per service: a minor/patch group (safe,
# routine) and a separate major group (reviewed deliberately). Breaking runtime/library majors are
# pinned and migrated on purpose, not taken from a bot, so they are ignored here.
version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/services/**", "/infrastructure/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]
    ignore:
      # Breaking numerical/data majors — migrate deliberately with the test suite, not via the bot.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  - package-ecosystem: "docker"
    directories: ["/services/**", "/infrastructure/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Runtime and database base-image majors are pinned deliberately and migrated with testing
      # (a new Python/Node/Postgres major is a project decision, not a routine bump).
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "timescale/timescaledb"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
