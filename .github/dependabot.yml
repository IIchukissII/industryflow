# Automated dependency updates. Everything is GROUPED so each ecosystem opens at most a couple of
# PRs across all directories, not one PR per dependency per service: a minor/patch group (safe,
# routine) and a separate major group (reviewed deliberately). Breaking runtime/library majors are
# pinned and migrated on purpose, not taken from a bot, so they are ignored here.
version: 2
updates:
  # pip is split into three entries because Dependabot gives each entry one job with a ~55 min cap,
  # and a single entry over every Python directory ran out of time and was cancelled every week.
  # Each entry is still grouped, so it opens at most a minor/patch and a major PR.
  #
  # The MLflow server's requirements.txt is a pip-compile lock of requirements.in, so Dependabot
  # bumps a pin and recompiles the lock as a whole; a transitive pin never moves on its own.
  - package-ecosystem: "pip"
    directory: "/infrastructure/mlflow"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      mlflow-server-minor-patch:
        update-types: ["minor", "patch"]
      mlflow-server-major:
        update-types: ["major"]

  # The platform API, alerting and ingestion services.
  - package-ecosystem: "pip"
    directories:
      - "/services/api_gateway"
      - "/services/alert_service"
      - "/services/ingestion_service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-services-minor-patch:
        update-types: ["minor", "patch"]
      python-services-major:
        update-types: ["major"]
    ignore:
      # fastapi-users-db-sqlalchemy (7.0.0, latest) requires sqlalchemy <2.1, so a 2.1 bump cannot
      # install and breaks the whole group. Lift when it allows 2.1.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]

  # ML serving, the authoring kernel, the notebook mediators, the cold layer and Spark helpers.
  # Serving (ml_service/api) and the kernel (clients/python/kernel) are both ends of the model
  # artifact path (ADR-0027), so they share this entry and the model-stack group: a bump moves both
  # ends in ONE PR, and the round-trip gate proves the pair. Split across groups, the bot moves serving
  # alone and every model the kernel trains stops loading.
  - package-ecosystem: "pip"
    directories:
      - "/services/ml_service"
      - "/services/ml_service/api"
      - "/services/ml_service/tests"
      - "/clients/python/kernel"
      - "/services/notebook_hub"
      - "/services/notebook_sql_proxy"
      - "/services/notebook_sql_proxy/tests"
      - "/services/notebook_tracking_gateway"
      - "/services/notebook_tracking_gateway/tests"
      - "/services/notebook_cold_broker"
      - "/services/notebook_cold_broker/tests"
      - "/services/cold_export"
      - "/services/cold_export/tests"
      - "/services/tenant_delete"
      - "/services/spark_jobs"
      - "/infrastructure/timescaledb/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    groups:
      # First match wins, so the model stack is claimed before the generic groups see it.
      model-stack:
        patterns: ["numpy", "pandas", "scipy", "scikit-learn", "skops", "xgboost", "mlflow", "mlflow-skinny", "evidently"]
      python-notebooks-data-minor-patch:
        update-types: ["minor", "patch"]
      python-notebooks-data-major:
        update-types: ["major"]
    ignore:
      # Breaking numerical/data majors — migrate deliberately with the test suite, not via the bot.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      # pyspark tracks the job images' Spark (scripts/check_spark_version_parity.py), whose minors are
      # ignored in the docker entries below; a pyspark minor alone fails that guard.
      - dependency-name: "pyspark"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
    ignore:
      # eslint 10 cannot be installed here: eslint-plugin-react's peer range still stops at 9, so
      # `npm ci` fails to resolve and every check in the PR dies before it runs. The bot cannot know
      # that and re-proposed it weekly, burning a full image matrix each time. Lift this the moment
      # the plugin ships an eslint-10 peer range — tracked in #216, which is the reason this is an
      # ignore rather than a pin.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @eslint/js majors track eslint's; 10.x peers on eslint 10, so it is blocked by the same #216.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories: ["/services/**", "/infrastructure/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Runtime and database base-image majors are pinned deliberately and migrated with testing
      # (a new Python/Node/Postgres major is a project decision, not a routine bump).
      #
      # `python` is ignored for MINORS too, which the other runtimes do not need. A Python feature
      # release is a major migration wearing a minor's version number: 3.11 -> 3.14 arrives here as a
      # semver minor, and the bot proposed exactly that for the tracking image while #222 still held it
      # at 3.11. Semver ignores are
      # the only guard the bot itself respects, so the guard has to match how the tag actually numbers.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Spark is not a routine bump either. A feature release moves the JVM/Scala side and the
      # Structured-Streaming checkpoint format, which ADR-0029 makes a deliberate, resume-verified
      # exercise on a real box. Patches stay open: the image smoke pins `version 4.1`, so a 4.1.x
      # security patch still passes the gate while 4.2 correctly does not.
      - dependency-name: "apache/spark"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "timescale/timescaledb"
        update-types: ["version-update:semver-major"]

  # The root compose file's pulled images (its built ones come from the Dockerfiles above). Each is
  # pinned tag@digest and must stay identical to the Helm chart's pin of the same image, which this
  # bot does not edit: tests/config_guards fails a bump PR until values.yaml is moved with it.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # The same deliberate-migration majors as the Dockerfile entry above.
      - dependency-name: "apache/spark"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "timescale/timescaledb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "confluentinc/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
