# Automated dependency updates. Minor/patch bumps are grouped per ecosystem to limit PR noise;
# majors come as individual PRs so they can be reviewed deliberately.
version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/services/**", "/infrastructure/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/services/**", "/infrastructure/**"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
