# Build, scan, and (on main) publish every service image to GHCR.
# - PRs: build + Trivy scan (no push) — catches build breaks and CRITICAL CVEs before merge.
# - push to main: build + scan + push, tagged :latest and :sha-<short> (immutable).
# Scoped to image-relevant changes so ordinary code/test PRs don't trigger 13 builds.
name: Images

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile*"
      - "**/requirements*.txt"
      - "services/frontend/package*.json"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "**/Dockerfile*"
      - "**/requirements*.txt"
      - "services/frontend/package*.json"
      - ".github/workflows/images.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io/iichukissii

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway,            context: services/api_gateway,     file: services/api_gateway/Dockerfile }
          - { name: ingestion-service,      context: services/ingestion_service, file: services/ingestion_service/Dockerfile }
          - { name: frontend,               context: services/frontend,        file: services/frontend/Dockerfile }
          - { name: ml-service-api,         context: services/ml_service,       file: services/ml_service/api/Dockerfile }
          - { name: alert-service-api,      context: services/alert_service,    file: services/alert_service/api/Dockerfile }
          - { name: alert-service-detector, context: services/alert_service,    file: services/alert_service/worker/Dockerfile }
          - { name: spark-streaming,        context: services/spark_jobs,       file: services/spark_jobs/Dockerfile.streaming }
          - { name: spark-aggregations,     context: services/spark_jobs,       file: services/spark_jobs/Dockerfile.aggregations }
          - { name: spark-worker,           context: services/spark_jobs,       file: services/spark_jobs/Dockerfile.worker }
          - { name: mlflow,                 context: infrastructure/mlflow,     file: infrastructure/mlflow/Dockerfile }
          - { name: notebook-hub,           context: services/notebook_hub,     file: services/notebook_hub/Dockerfile }
          - { name: notebook-sql-proxy,     context: services/notebook_sql_proxy, file: services/notebook_sql_proxy/Dockerfile }
          - { name: jupyter,                context: services/ml_service,       file: services/ml_service/Dockerfile.jupyter }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/industryflow-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (load on PR, push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/industryflow-${{ matrix.name }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  deps-audit:
    # Dependency CVE audit. Report-only for now (informational) — tighten to gating later.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (runtime requirements)
        run: |
          pip install pip-audit==2.7.3
          for req in $(git ls-files '**/requirements.txt'); do
            echo "::group::pip-audit $req"
            pip-audit -r "$req" || true
            echo "::endgroup::"
          done
      - name: npm audit (frontend)
        working-directory: services/frontend
        run: npm audit --audit-level=high || true
