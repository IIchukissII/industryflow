# Build, scan, and (on main) publish every service image to GHCR.
# - PRs: build + Trivy scan (no push) — catches build breaks and CRITICAL CVEs before merge.
# - push to main: build + scan + push, tagged :latest and :sha-<short> (immutable).
# Scoped to image-relevant changes so ordinary code/test PRs don't trigger 13 builds.
name: Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io/iichukissii

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A manual dispatch builds everything; there is no diff to filter on.
      relevant: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.relevant == 'true' }}
      # The Spark version is also written outside the images (compose, manifests, code, test pins);
      # a change there runs the parity check without building every image.
      spark_parity: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.spark_parity == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - '**/Dockerfile*'
              - '**/requirements*.txt'
              - 'services/frontend/package*.json'
              - '.github/workflows/images.yml'
              - 'scripts/check_spark_version_parity.py'
              - 'scripts/tests/test_spark_version_parity.py'
              - 'scripts/check_jupyterhub_parity.py'
              - 'scripts/tests/test_jupyterhub_parity.py'
            spark_parity:
              - 'docker-compose*.yml'
              - 'deploy/**'
              - 'services/**/*.py'
              - 'clients/**/*.py'
              - '**/requirements*.txt'
              - '**/Dockerfile*'
              - 'scripts/check_spark_version_parity.py'
              - 'scripts/tests/test_spark_version_parity.py'
              - '.github/workflows/images.yml'

  # Seconds, and it gates the matrix below: a Spark image whose base tag and Kafka connector
  # coordinate disagree is not worth building, because building it is exactly what will NOT catch
  # the disagreement. The older connector still resolves, and the smoke asserts `version 4.1`, which
  # any 4.1.x base satisfies — so the image builds, starts, scans clean, and ships a Spark running a
  # connector built for a different Spark. The version lives in five places per image and a bot can
  # see one of them; this reads the other four, and every copy outside the images.
  spark-version-parity:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || needs.changes.outputs.spark_parity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest==9.1.1
      - name: The base tag and the connector coordinates must agree
        run: python scripts/check_spark_version_parity.py
      - name: The check itself must still be able to fail
        # A parity check that cannot fail is worse than none — it is a green tick asserting the
        # files were inspected. These hold it to the real diff that prompted it, including the
        # half-fix (build-time warm updated, runtime CMD forgotten).
        run: pytest scripts/tests/test_spark_version_parity.py -q
      - name: The hub and its spawn images run the same JupyterHub
        run: python scripts/check_jupyterhub_parity.py && pytest scripts/tests/test_jupyterhub_parity.py -q

  build-scan:
    needs: [changes, spark-version-parity]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `smoke` (ADR-0026 dec 5): a shell command run INSIDE the built image. Import the module the
          # container actually serves — that is the step a dependency resolve cannot take for you, and
          # the only one that fails when a Dockerfile's COPY list omits a module. Importing only the
          # libraries passes on such an image. Where settings are read at import, the smoke passes
          # placeholder values: they configure nothing, they only let the import run.
          # Images with nothing to load or start (nginx, pg_dump) carry none; the Spark images carry a
          # version/artifact check instead of an import (their risk is the JVM side — see below).
          - { name: api-gateway,            context: services/api_gateway,     file: services/api_gateway/Dockerfile,
              smoke: "env DB_HOST=x DB_PORT=5432 DB_NAME=x API_GATEWAY_DB_USER=x API_GATEWAY_DB_PASSWORD=x REDIS_HOST=x REDIS_PORT=6379 REDIS_DB=0 JWT_SECRET_KEY=smoke-only-not-a-secret-0123456789abcdef CORS_ORIGINS=https://x python -c \"import main; print('api-gateway serves', main.app.title)\"" }
          - { name: ingestion-service,      context: services/ingestion_service, file: services/ingestion_service/Dockerfile,
              smoke: "env INGESTION_SERVICE_PORT=8003 KAFKA_BOOTSTRAP_SERVERS=x:9092 DEVICE_IDENTITY_HEADERS=x-client python -c \"import main; print('ingestion serves', main.app.title)\"" }
          - { name: frontend,               context: services/frontend,        file: services/frontend/Dockerfile }
          # numpy/sklearn/xgboost are C-extension stacks: an ABI mismatch is invisible to a resolve and
          # fatal on import (this is the pyarrow-14-under-numpy-2 break, #209).
          - { name: ml-service-api,         context: services/ml_service,       file: services/ml_service/api/Dockerfile,
              smoke: "python -c \"import numpy, sklearn, xgboost, mlflow, evidently, main; print('ml-service serves', main.app.title, numpy.__version__)\"" }
          - { name: alert-service-detector, context: services/alert_service,    file: services/alert_service/worker/Dockerfile,
              smoke: "python -c \"import main; print('alert-detector imports ok')\"" }
          # The Spark images DO run a process (a PySpark job / an executor), and their migration risk
          # is the JVM side a dependency resolve never sees: the base's Spark/Scala version and the
          # S3A jars baked for the object-store checkpoint (ADR-0029 moved these to Hadoop 3.4.2 + the
          # AWS SDK v2 bundle). This smoke asserts the image IS Spark 4.1/Scala 2.13 with that stack
          # baked and psycopg2 present. It does NOT resolve the runtime `--packages` Kafka connector or
          # process a batch — that needs Kafka+TimescaleDB, which ADR-0026 keeps off CI and ADR-0029
          # dec 5 assigns to the box run.
          #
          # `patch_os: true` marks the images that patch their own OS at build (`apt-get upgrade`)
          # because the base pins an Ubuntu older than its CVEs. Those are the only images whose
          # layer cache must not be allowed to go stale — see the Build step's build-args.
          - { name: spark-streaming,        context: services/spark_jobs,       file: services/spark_jobs/Dockerfile.streaming, patch_os: true,
              smoke: "test -f /opt/spark/jars/hadoop-aws-3.4.2.jar && test -f /opt/spark/jars/bundle-2.55.14.jar && python3 -c 'import psycopg2' && /opt/spark/bin/spark-submit --version > /tmp/v 2>&1 && grep -q 'version 4.1' /tmp/v && grep -q 'Scala version 2.13' /tmp/v && echo \"from pyspark.sql import SparkSession; s = SparkSession.builder.master('local[1]').getOrCreate(); assert s.range(100).count() == 100; [s._jvm.java.lang.Class.forName(c) for c in ('org.apache.hadoop.fs.s3a.S3AFileSystem', 'software.amazon.awssdk.services.s3.S3Client')]; print('spark-local-ok')\" > /tmp/j.py && /opt/spark/bin/spark-submit /tmp/j.py > /tmp/o 2>&1; grep -q spark-local-ok /tmp/o || { tail -40 /tmp/o; exit 1; }; echo spark-4.1-image-ok" }
          - { name: spark-aggregations,     context: services/spark_jobs,       file: services/spark_jobs/Dockerfile.aggregations, patch_os: true,
              smoke: "test -f /opt/spark/jars/hadoop-aws-3.4.2.jar && test -f /opt/spark/jars/bundle-2.55.14.jar && python3 -c 'import psycopg2' && /opt/spark/bin/spark-submit --version > /tmp/v 2>&1 && grep -q 'version 4.1' /tmp/v && grep -q 'Scala version 2.13' /tmp/v && echo \"from pyspark.sql import SparkSession; s = SparkSession.builder.master('local[1]').getOrCreate(); assert s.range(100).count() == 100; [s._jvm.java.lang.Class.forName(c) for c in ('org.apache.hadoop.fs.s3a.S3AFileSystem', 'software.amazon.awssdk.services.s3.S3Client')]; print('spark-local-ok')\" > /tmp/j.py && /opt/spark/bin/spark-submit /tmp/j.py > /tmp/o 2>&1; grep -q spark-local-ok /tmp/o || { tail -40 /tmp/o; exit 1; }; echo spark-4.1-image-ok" }
          - { name: spark-worker,           context: services/spark_jobs,       file: services/spark_jobs/Dockerfile.worker, patch_os: true,
              smoke: "test -f /opt/spark/jars/hadoop-aws-3.4.2.jar && test -f /opt/spark/jars/bundle-2.55.14.jar && python3 -c 'import psycopg2' && /opt/spark/bin/spark-submit --version > /tmp/v 2>&1 && grep -q 'version 4.1' /tmp/v && grep -q 'Scala version 2.13' /tmp/v && echo \"from pyspark.sql import SparkSession; s = SparkSession.builder.master('local[1]').getOrCreate(); assert s.range(100).count() == 100; [s._jvm.java.lang.Class.forName(c) for c in ('org.apache.hadoop.fs.s3a.S3AFileSystem', 'software.amazon.awssdk.services.s3.S3Client')]; print('spark-local-ok')\" > /tmp/j.py && /opt/spark/bin/spark-submit /tmp/j.py > /tmp/o 2>&1; grep -q spark-local-ok /tmp/o || { tail -40 /tmp/o; exit 1; }; echo spark-4.1-image-ok" }
          # THE ONE THAT WOULD HAVE CAUGHT #222. mlflow is pure-python and its 95-package closure
          # resolves cleanly on 3.14 — and then the SERVER dies importing importlib.abc.Traversable.
          # Importing the client is not enough; it is `mlflow.server` that breaks.
          - { name: mlflow,                 context: infrastructure/mlflow,     file: infrastructure/mlflow/Dockerfile,
              smoke: "python -c \"import mlflow.server.fastapi_app; print('mlflow SERVER imports ok', __import__('mlflow').__version__)\"" }
          - { name: notebook-hub,           context: services/notebook_hub,     file: services/notebook_hub/Dockerfile,
              smoke: "cd /opt/hub && env NOTEBOOK_SPAWNER=docker NOTEBOOK_NETWORK=x NOTEBOOK_IMAGE=x PLATFORM_VERIFY_URL=http://x REDIS_HOST=x REDIS_PORT=6379 python -c \"import os; from traitlets.config import Config; c = Config(); f = os.path.abspath('jupyterhub_config.py'); exec(compile(open(f).read(), f, 'exec'), {'c': c, 'get_config': lambda: c, '__file__': f, '__name__': '__main__'}); print('hub config loads', c.JupyterHub.spawner_class)\" && jupyterhub --version" }
          - { name: notebook-sql-proxy,     context: services/notebook_sql_proxy, file: services/notebook_sql_proxy/Dockerfile,
              smoke: "python -c \"import server; print('sql-proxy imports ok')\"" }
          # Imports what the container SERVES, not merely what it depends on. `import fastapi, redis`
          # proves the deps installed and would have passed happily on an image whose own modules the
          # Dockerfile never copied — which is exactly how a crashloop shipped past a green build and
          # 87 green unit tests (ADR-0030). The CMD is `python -m gateway`; importing it is the
          # cheapest thing that asks the question the smoke is named for.
          - { name: notebook-tracking-gateway, context: services/notebook_tracking_gateway, file: services/notebook_tracking_gateway/Dockerfile,
              smoke: "python -c \"import gateway; print('tracking-gateway ok')\"" }
          - { name: notebook-cold-broker,   context: services/notebook_cold_broker, file: services/notebook_cold_broker/Dockerfile,
              smoke: "python -c \"import broker; print('cold-broker imports ok')\"" }
          - { name: notebook-authoring,     context: clients/python,            file: services/notebook_hub/Dockerfile.authoring,
              smoke: "python -c \"import numpy, pandas, sklearn, mlflow, industryflow; print('authoring kernel ok', numpy.__version__)\"" }
          - { name: notebook-analytics,     context: clients/python,            file: services/notebook_hub/Dockerfile.analytics,
              smoke: "python -c \"import numpy, pandas, industryflow; print('analytics kernel ok', numpy.__version__)\"" }
          - { name: db-backup,              context: infrastructure/backup,     file: infrastructure/backup/Dockerfile }
          # pyarrow is the cold layer's Parquet writer, and pyarrow-vs-numpy is a compiled ABI pair:
          # pyarrow 14 imports fine until numpy 2 arrives, then dies (#209). An import is the whole test.
          - { name: cold-export,            context: services/cold_export,      file: services/cold_export/Dockerfile,
              smoke: "python -c \"import pyarrow, pyarrow.parquet, pyarrow.fs, numpy, cold_export.main; print('cold-export imports ok', pyarrow.__version__, numpy.__version__)\"" }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/industryflow-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # A `patch_os` image fixes its base's CVEs with `apt-get upgrade` at build time, and the Trivy
      # gate below is what proves it worked. But the build restores layers from a persistent cache, so
      # with no changing input that RUN is replayed verbatim on every build and the image's patch level
      # silently freezes at whatever the last cache write held — the gate then fails on CVEs the
      # Dockerfile is supposed to have already fixed, which is how #257/#259 went red without touching
      # an image. A UTC date as the cache key keeps the patch layer at most a day stale while leaving
      # every other layer (the ~200 MB of baked S3A jars) cached. Only `patch_os` images take the arg;
      # passing it to the rest would rebuild them daily for nothing.
      - name: Security-patch cache epoch
        if: matrix.patch_os
        id: epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build (load on PR, push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.patch_os && format('SECURITY_REFRESH={0}', steps.epoch.outputs.day) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # ADR-0026 dec 5: an image must START, not merely build. Both of this sprint's failures were
      # invisible to every dependency check because a clean resolve says nothing about a run — mlflow
      # resolves perfectly on Python 3.14 and then dies importing `importlib.abc.Traversable`, which
      # 3.14 removed. So each image that serves a Python process imports the module it actually serves.
      # `smoke` is only set where there is something worth loading or starting; images without it
      # (nginx, pg_dump) skip this step. Runs on pull_request, where the build is `load`ed into the
      # local daemon — which is the merge gate, so nothing reaches main unsmoked.
      - name: Smoke — the image starts, not just builds
        if: github.event_name == 'pull_request' && matrix.smoke != ''
        # The command goes through the environment, not through the shell: every smoke string contains
        # single quotes of its own (`print('ok')`), so interpolating it into a quoted argument collides.
        env:
          SMOKE: ${{ matrix.smoke }}
          IMAGE: ${{ env.REGISTRY }}/industryflow-${{ matrix.name }}:${{ steps.meta.outputs.version }}
        run: |
          echo "::group::smoke ${{ matrix.name }}"
          echo "$SMOKE"
          docker run --rm --entrypoint sh "$IMAGE" -c "$SMOKE"
          echo "::endgroup::"

      - name: Install Trivy
        # A pinned release, checksum-verified. The previous `curl … main/install.sh | sh` ran an
        # unpinned script from a moving branch, and the pipe hid its failure until `trivy: not found`.
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL --retry 3 -o "$tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tgz}"
          echo "${TRIVY_SHA256}  ${tgz}" | sha256sum -c -
          sudo tar xzf "$tgz" -C /usr/local/bin trivy
          trivy --version
      - name: Trivy scan (gate on fixable CRITICAL)
        # Gating: fails on any fixable CRITICAL. Accepted, justified exceptions (Spark-bundled
        # JARs that need a Spark upgrade) live in .trivyignore with expiry dates.
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
          TRIVY_IGNOREFILE: .trivyignore
        run: |
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "${REGISTRY}/industryflow-${{ matrix.name }}:${{ steps.meta.outputs.version }}"

  deps-audit:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Dependency CVE audit. Report-only for now (informational) — tighten to gating later.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: pip-audit (runtime requirements)
        run: |
          pip install pip-audit==2.7.3
          for req in $(git ls-files '**/requirements.txt'); do
            echo "::group::pip-audit $req"
            pip-audit -r "$req" || true
            echo "::endgroup::"
          done
      - name: npm audit (frontend)
        working-directory: services/frontend
        run: npm audit --audit-level=high || true

  # Always present, so it can be a required check: passes when the workflow's paths did not change,
  # fails when any job it gates failed or was cancelled (ADR-0026 dec 2).
  images-gate:
    name: images-gate
    needs: [changes, spark-version-parity, build-scan, deps-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          echo "changes=${{ needs.changes.result }} relevant=${{ needs.changes.outputs.relevant }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change-detection job did not succeed"; exit 1
          fi
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a gated job failed or was cancelled"; exit 1
          fi
