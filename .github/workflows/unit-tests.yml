# In-process unit/functional tests that need no external services (no DB, broker, or edge).
# Database-backed proofs live in db-tenant-isolation.yml.
#
# This workflow always triggers (no top-level path filter) so its gate job always reports a
# status — that is what lets `unit-tests-gate` be a REQUIRED check without blocking PRs that don't
# touch services/ (a path-filtered workflow that never runs leaves a required check pending
# forever). The heavy matrix is still path-gated internally via the `changes` job, so irrelevant
# PRs skip the actual tests and the gate passes on the skip.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'scripts/ci/requirements.txt'
              - 'services/**'
              - 'libs/**'
              # The runbooks the ops-agent tests read as a contract (ADR-0046 dec 9).
              - 'docs/operations/**'
              - 'clients/python/**'
              # Read by the parity guards (e.g. the alert worker's config parity test), so an
              # edit on that side alone must run them too.
              - 'docker-compose.yml'
              - 'deploy/helm/**'
              - 'scripts/device-ca.sh'
              - 'scripts/tests/test_device_ca.py'
              - 'scripts/dead-letters.sh'
              - 'scripts/tests/test_dead_letters.py'
              - 'scripts/box-e2e.sh'
              - 'scripts/tests/test_box_e2e.py'
              # The user CLIs are tested in services/api_gateway/tests/test_user_scripts.py.
              - 'scripts/manage_users.py'
              - 'scripts/seed_users.py'
              - 'scripts/user_admin_db.py'
              - 'infrastructure/backup/**'
              # The roles and grants the streaming job writes with, and the bucket and principal its
              # checkpoint uses (spark-streaming job).
              - 'infrastructure/timescaledb/**'
              - 'infrastructure/minio/**'
              # The jobs that start compose services run on its settings (cp .env.example .env).
              - '.env.example'
              - '.github/workflows/unit-tests.yml'

  pytest:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Tests that need the capability store run against a real Redis, never quietly on the fake: the
    # fake has no client timeouts, which hid #501 (libs/industryflow_contracts/industryflow_contracts/testing.py).
    services:
      redis:
        image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      IF_TEST_REDIS_URL: redis://localhost:6379/0
      IF_REQUIRE_REAL_REDIS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The real-broker proofs of the producer and the tenant-status stream are `integration` and
          # excluded here — this job runs no broker and they would only skip. They run in alert-kafka.
          - { service: ingestion_service,   path: services/ingestion_service/tests, args: "--ignore=services/ingestion_service/tests/test_kafka_producer_integration.py --ignore=services/ingestion_service/tests/test_tenant_status_integration.py" }
          - { service: api_gateway,         path: services/api_gateway/tests }
          - { service: notebook_hub,        path: services/notebook_hub/tests }
          # The live cross-tenant isolation proof (test_sql_proxy_integration.py) is marked
          # `integration` and excluded here — it needs a real stack and would only skip in this
          # no-DB job (a false green). It runs in db-tenant-isolation.yml against a live stack.
          - { service: notebook_sql_proxy,  path: services/notebook_sql_proxy/tests, args: "--ignore=services/notebook_sql_proxy/tests/test_sql_proxy_integration.py" }
          # The live proofs (test_*_integration.py, by the same pattern the live job runs, and
          # test_offboarding_live.py) are `integration` and excluded here — they need a real MLflow +
          # MinIO + Redis and would only skip. They run in tracking-gateway-integration.yml.
          - { service: notebook_tracking_gateway, path: services/notebook_tracking_gateway/tests, args: "--ignore-glob=services/notebook_tracking_gateway/tests/test_*_integration.py --ignore=services/notebook_tracking_gateway/tests/test_offboarding_live.py" }
          # The live end-to-end proof (test_cold_broker_integration.py) is marked `integration` and
          # excluded here — it needs a real broker + MinIO + Redis and would only skip in this
          # no-infra job (a false green). It runs in cold-layer-integration.yml against a live stack.
          - { service: notebook_cold_broker, path: services/notebook_cold_broker/tests, args: "--ignore=services/notebook_cold_broker/tests/test_cold_broker_integration.py" }
          # The real-broker proof (test_kafka_consumer_integration.py) is `integration` and excluded
          # here — this job runs no broker and it would only skip. It runs in the alert-kafka job.
          - { service: alert_service,       path: services/alert_service/tests, args: "--ignore=services/alert_service/tests/test_kafka_consumer_integration.py" }
          # No `-m 'not redis'` here: not one test in the repository carries that marker, so the
          # filter deselected nothing while implying a skipped body of Redis coverage that never
          # existed. The whole suite runs.
          # The upload path's serving-half proof needs the live stack; it runs in tracking-gateway-integration.yml.
          - { service: ml_service,          path: services/ml_service/tests, args: "--ignore=services/ml_service/tests/test_upload_serving_integration.py" }
          # The routing, reading guard and windowing tests run on a local Spark (pyspark from
          # requirements-dev) on the job images' Java (`java`, held equal to their base tag by
          # scripts/check_spark_version_parity.py). test_spark_service.py is a live-stack harness
          # (TimescaleDB + the running jobs) and would only fail here, so it is excluded. The
          # real-store proof (test_streaming_integration.py) runs in the spark-streaming job.
          - { service: spark_jobs,          path: services/spark_jobs/tests, args: "--ignore=services/spark_jobs/tests/test_spark_service.py --ignore=services/spark_jobs/tests/test_streaming_integration.py --ignore=services/spark_jobs/tests/test_aggregations_integration.py", java: "21" }
          # Cold-layer exporter (ADR-0025): orchestration tests drive fakes, no DB/object store.
          # The live proof (test_cold_export_integration.py) is `integration` and excluded here —
          # it needs TimescaleDB + MinIO and would only skip. It runs in cold-layer-integration.yml.
          - { service: cold_export,         path: services/cold_export/tests, args: "--ignore=services/cold_export/tests/test_cold_export_integration.py" }
          # The cold purge's live proof (test_cold_store_live.py) needs MinIO and runs in cold-layer-integration.yml.
          - { service: tenant_delete,         path: services/tenant_delete/tests, args: "--ignore=services/tenant_delete/tests/test_cold_store_live.py" }
          # The infrastructure agent (ADR-0046): stores and model faked; its tool server also runs as
          # a real stdio subprocess. It reads the runbooks under docs/operations.
          - { service: ops_agent,           path: services/ops_agent/tests }
          # The backup image's scripts, run under bash against stand-in aws/psql/pg_* binaries.
          - { service: backup,              path: infrastructure/backup/tests, install: "pip install -r scripts/ci/requirements.txt" }
          # The notebook client is packaged (pyproject extras), so it overrides the install.
          - { service: python_client,       path: clients/python/tests, install: "pip install -e 'clients/python[dev,cold]'" }
          # The device CA's issue/renew/revoke/revoke-tenant and register, against a throwaway CA and the runner's openssl.
          - { service: device_ca,           path: scripts/tests/test_device_ca.py, install: "pip install -r scripts/ci/requirements.txt" }
          # Dead-letter inspection and replay, against stand-in Kafka console tools.
          - { service: dead_letters,        path: scripts/tests/test_dead_letters.py, install: "pip install -r scripts/ci/requirements.txt" }
          # The end-to-end run's result line, against stand-in git and docker.
          - { service: box_e2e,             path: scripts/tests/test_box_e2e.py, install: "pip install -r scripts/ci/requirements.txt" }
          # The shared contracts package itself. The repository-wide guards that every service takes
          # its tenant names and window contract from it live in tests/config_guards.
          - { service: contracts,           path: libs/industryflow_contracts/tests, install: "pip install './libs/industryflow_contracts[dev]'" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v6
        if: matrix.java
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # A service's own requirements-dev plus the shared contracts package its images install from the
      # `contracts` build context (a path, so it is installed here rather than pinned in a requirements
      # file a dependency bot reads).
      - name: Install dependencies
        run: ${{ matrix.install && matrix.install || format('pip install ./libs/industryflow_contracts -r services/{0}/requirements-dev.txt', matrix.service) }}
      - name: Run tests
        run: pytest ${{ matrix.path }} ${{ matrix.args }} -v

  # The alert worker's consumer loop against the platform's own broker, started from
  # docker-compose.yml so its image and settings are the deployed ones (ADR-0005, ADR-0026 dec 11):
  # commit, redelivery after a kill, rewind, and dead letters, read back from the broker.
  alert-kafka:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Provide compose env
        run: cp .env.example .env
      - name: Start ZooKeeper + Kafka
        run: docker compose up -d --wait zookeeper kafka
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install ./libs/industryflow_contracts -r services/alert_service/requirements-dev.txt -r services/ingestion_service/requirements-dev.txt
      - name: Run the real-broker proof
        env:
          IF_TEST_KAFKA_BOOTSTRAP: localhost:9092
          IF_REQUIRE_REAL_KAFKA: "1"
        run: pytest services/alert_service/tests/test_kafka_consumer_integration.py -m integration -v
      # Its own run: both services are flat module trees (config, main), and one process imports one of each.
      # The producer proof stops and restarts the compose broker.
      - name: Run the ingestion real-broker proofs
        env:
          IF_TEST_KAFKA_BOOTSTRAP: localhost:9092
          IF_REQUIRE_REAL_KAFKA: "1"
        run: pytest services/ingestion_service/tests/test_kafka_producer_integration.py services/ingestion_service/tests/test_tenant_status_integration.py -m integration -v
      - name: Dump broker logs on failure
        if: failure()
        run: docker compose logs zookeeper kafka
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The streaming job's own image and command against the platform's broker, database and checkpoint
  # store, all from docker-compose.yml (ADR-0005, ADR-0006, ADR-0026 dec 11): the earliest start, dead
  # letters, resume after a kill, and no offset advance while the database is down.
  spark-streaming:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Provide compose env
        run: cp .env.example .env
      # `up --wait` returns once a one-shot has started; the one-shots are run to completion.
      - name: Start Kafka, TimescaleDB, MinIO and Spark; apply the schema; create the buckets
        run: |
          docker compose up -d --wait zookeeper kafka timescaledb minio
          docker compose up -d --no-deps spark-master spark-worker
          docker compose run --rm db-migrate
          docker compose run --rm --no-deps minio-init
      - name: Build the Spark job images
        run: docker compose build spark-streaming spark-aggregations
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r infrastructure/timescaledb/tests/requirements.txt ./libs/industryflow_contracts
      - name: Run the real-store proof
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: industryflow
          IF_REQUIRE_LIVE_STACK: "1"
        run: |
          export PGPASSWORD="$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2-)"
          pytest services/spark_jobs/tests/test_streaming_integration.py services/spark_jobs/tests/test_aggregations_integration.py -m integration -v
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs kafka timescaledb minio spark-master spark-worker
          for c in $(docker ps -aq --filter name=if-stream-it- --filter name=if-agg-it-); do docker logs "$c" 2>&1 | tail -200; done
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Stable aggregate status for branch protection. Always runs; fails only if the matrix actually
  # ran and failed. A skip (irrelevant paths) passes, so this required check never blocks an
  # unrelated PR — while a real unit-test failure still red-gates the merge.
  unit-tests-gate:
    name: unit-tests-gate
    needs: [changes, pytest, alert-kafka, spark-streaming]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Gate on matrix result
        run: |
          changes="${{ needs.changes.result }}"
          result="${{ needs.pytest.result }}"
          kafka="${{ needs.alert-kafka.result }}"
          streaming="${{ needs.spark-streaming.result }}"
          echo "changes=$changes pytest=$result alert-kafka=$kafka spark-streaming=$streaming (relevant=${{ needs.changes.outputs.relevant }})"
          # Fail closed if change-detection broke — we can't prove the tests were unnecessary.
          if [ "$changes" != "success" ]; then
            echo "::error::change-detection job did not succeed ($changes)"; exit 1
          fi
          for r in "$result" "$kafka" "$streaming"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::unit tests did not pass"; exit 1
            fi
          done
          # 'success' (tests ran and passed) or 'skipped' (no relevant changes) both pass.
          exit 0
