# Static linting gates: ruff for the Python services, eslint for the frontend.
name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "services/frontend/**"
      - "ruff.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "services/frontend/**"
      - "ruff.toml"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: ruff check
        run: ruff check .

  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: eslint
        run: npx eslint src --ext .js,.jsx
