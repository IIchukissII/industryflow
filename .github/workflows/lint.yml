# Static linting gates: ruff for the Python services, eslint for the frontend, and a resolvability
# gate on the requirements files.
name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/requirements*.txt"
      - "services/frontend/**"
      - "ruff.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/requirements*.txt"
      - "services/frontend/**"
      - "ruff.toml"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: ruff check
        run: ruff check .

  # Every requirements.txt must actually be installable. A pin can be individually valid and still
  # unsatisfiable next to its neighbours (a cap in a transitive dep), and a requirements file that
  # no image or test job installs will never find that out — it just rots, resolvable-looking, until
  # someone builds it. deps-audit iterates these files too, but it is report-only (continue-on-error
  # + `|| true`), so it reports such a conflict and passes anyway. This gates.
  #
  # WHEELS ONLY, deliberately. Without --only-binary a missing wheel is not an error: pip quietly
  # falls back to building the sdist, so the gate passes for the wrong reason (and passes or fails
  # depending on which compilers the runner happens to have). Every image installs these with wheels;
  # the gate has to hold them to the same standard.
  deps-resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Resolve every requirements file
        run: |
          # The MLflow lock is resolved for the interpreter ITS image runs, which is not this job's:
          # it is held at 3.11 because mlflow does not run on 3.14 (#222). Resolving it against 3.14
          # would be asking the wrong question. Its own header records the command, and its image
          # build (build-scan) is what actually proves it.
          declare -A PYVER=( ["infrastructure/mlflow/requirements.txt"]="3.11" )
          rc=0
          for req in $(git ls-files '**/requirements.txt' 'requirements.txt'); do
            pyver="${PYVER[$req]:-3.14}"
            echo "::group::pip resolve $req (cp${pyver//./})"
            # Both manylinux tags: the cp314 scientific wheels ship manylinux_2_28 while
            # psycopg2-binary still ships only manylinux2014, and either tag alone fails to resolve.
            if pip install --dry-run --quiet --only-binary=:all: \
                 --python-version "$pyver" \
                 --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 \
                 --target /tmp/deps-resolve --report /dev/null -r "$req"; then
              echo "OK   $req"
            else
              echo "::error file=$req::$req does not resolve as wheels on CPython $pyver — its pins are mutually unsatisfiable, or one of them ships no wheel for this interpreter"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same 22 as frontend-tests and the Dockerfile that actually ships: eslint 9's toolchain
          # wants node >=20.19, and one node across lint/test/build is one thing to reason about.
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Flat config (eslint.config.js) matches files itself — `--ext` was removed in eslint 9.
      - name: eslint
        run: npx eslint src

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Vitest runs through Vite 8, which needs node >=20.19/22.12.
          node-version: "22"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: vitest
        run: npm test
