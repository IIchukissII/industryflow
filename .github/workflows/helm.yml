# Lints and renders the Helm chart so template regressions are caught in CI. This is a
# render/lint check only — it does not deploy to or validate against a real cluster.
name: Helm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'deploy/helm/**'
              # The chart renders these through symlinks under files/ (one source with compose);
              # tests/config_guards checks this list covers every symlink target.
              - 'infrastructure/timescaledb/config/**'
              - 'infrastructure/timescaledb/init-scripts/**'
              - 'infrastructure/timescaledb/migrate.sh'
              - 'infrastructure/prometheus/rules/**'
              - 'infrastructure/grafana/**'
              - 'scripts/device-ca.sh'
              - 'infrastructure/minio/**'
              - '.github/workflows/helm.yml'

  lint-and-template:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # secrets.failOnPlaceholders=false: these steps render with the placeholder defaults
      # (no real secrets in CI); the fail-closed guard is exercised separately below.
      - name: helm lint
        run: helm lint deploy/helm/industryflow --set secrets.failOnPlaceholders=false
      - name: Render (defaults)
        run: helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false > /dev/null
      - name: Render (all toggles on)
        run: |
          helm template if deploy/helm/industryflow \
            --set secrets.failOnPlaceholders=false \
            --set networkPolicy.enabled=true \
            --set notebookHub.enabled=true \
            --set ingress.mtls.enabled=true \
            --set observability.opsAgent.enabled=true \
            --set secrets.data.OPS_AGENT_WEBHOOK_SECRET=ci-only-webhook-secret-of-32-chars-or-more \
            --set observability.opsAgent.prometheusUrl=http://prometheus.monitoring:9090 \
            --set observability.opsAgent.lokiUrl=http://loki.monitoring:3100 \
            --set observability.opsAgent.alertmanagerUrl=http://alertmanager.monitoring:9093 > /dev/null
      - name: The infrastructure agent refuses to render without its webhook secret
        run: |
          if helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false \
              --set observability.opsAgent.enabled=true > /dev/null 2>&1; then
            echo "::error::expected the agent to refuse a render without OPS_AGENT_WEBHOOK_SECRET"; exit 1
          fi
      # ADR-0032 dec 7: every upgrade is preceded by a backup, and going without one is explicit.
      - name: A backup hook precedes every upgrade, and going without one is an explicit choice
        run: |
          out=$(helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false)
          printf '%s\n' "$out" | grep -q 'helm.sh/hook: pre-upgrade' \
            && printf '%s\n' "$out" | grep -q 'name: if-industryflow-pre-upgrade-backup' \
            || { echo "::error::no pre-upgrade backup hook rendered"; exit 1; }
          printf '%s\n' "$out" | grep -q 'name: MIGRATE_WITHOUT_BACKUP' \
            && { echo "::error::the migrate Job goes without a backup by default"; exit 1; }
          if helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false \
              --set backup.enabled=false > /dev/null 2>&1; then
            echo "::error::expected a render with backups off to refuse without dbMigrations.withoutBackup"; exit 1
          fi
          helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false \
            --set backup.enabled=false --set dbMigrations.withoutBackup=true | grep -q 'name: MIGRATE_WITHOUT_BACKUP, value: "1"' \
            || { echo "::error::withoutBackup did not reach the migrate Job"; exit 1; }
      # The hook backs up the databases only, and skips when the upgrade is the one that creates its
      # credentials; the scheduled jobs never skip and carry the object mirrors.
      - name: The upgrade hook skips without credentials and mirrors nothing; the schedules do the reverse
        run: |
          out=$(helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false \
            --set coldExport.enabled=true --set backup.cold.enabled=true --set backup.models.enabled=true \
            --show-only templates/cronjob-db-backup.yaml)
          doc() { printf '%s\n' "$out" | awk -v name="$1" '/^---/{n++} {d[n]=d[n] $0 "\n"} $0=="  name: " name {k=n} END{printf "%s", d[k]}'; }
          hook=$(doc if-industryflow-pre-upgrade-backup)
          printf '%s\n' "$hook" | grep -q 'helm.sh/hook: pre-upgrade' || { echo "::error::hook document not found"; exit 1; }
          printf '%s\n' "$hook" | grep -q 'name: SKIP_WITHOUT_CREDENTIALS' \
            || { echo "::error::the hook does not skip an upgrade that creates its credentials"; exit 1; }
          printf '%s\n' "$hook" | grep -qE 'name: (COLD|MODEL)_SOURCE_BUCKET' \
            && { echo "::error::the hook mirrors objects; it backs up the databases only"; exit 1; }
          for job in if-industryflow-db-backup if-industryflow-restore-rehearsal; do
            cron=$(doc "$job")
            printf '%s\n' "$cron" | grep -q '^kind: CronJob' || { echo "::error::$job not found"; exit 1; }
            printf '%s\n' "$cron" | grep -q 'name: SKIP_WITHOUT_CREDENTIALS' \
              && { echo "::error::$job skips without credentials; a scheduled run must fail"; exit 1; }
            for v in COLD_SOURCE_BUCKET MODEL_SOURCE_BUCKET; do
              printf '%s\n' "$cron" | grep -q "name: $v" || { echo "::error::$job carries no $v"; exit 1; }
            done
          done
      - name: Fail-closed guard rejects placeholder secrets
        run: |
          if helm template if deploy/helm/industryflow > /dev/null 2>&1; then
            echo "::error::expected render to fail on placeholder secrets, but it succeeded"; exit 1
          fi
          echo "OK: render correctly refused placeholder secrets"

  # Always present, so it can be a required check: passes when the workflow's paths did not change,
  # fails when any job it gates failed or was cancelled (ADR-0026 dec 2).
  helm-gate:
    name: helm-gate
    needs: [changes, lint-and-template]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          echo "changes=${{ needs.changes.result }} relevant=${{ needs.changes.outputs.relevant }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::change-detection job did not succeed"; exit 1
          fi
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a gated job failed or was cancelled"; exit 1
          fi
