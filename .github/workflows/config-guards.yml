# Guards over lists whose omission fails silently: CI path filters, compose/Helm image parity, the
# image-digest overlay, the secrets a chart creates vs the ones its pods consume, the edge's upstream
# templating. Each test reads both sides of one such list (tests/config_guards).
#
# No path filter, deliberately: these lists span the whole repository (a new service directory, a
# workflow, the compose file, the chart), so any change can break one, and the job takes seconds.
name: Config guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-guards:
    name: config-guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The chart guards render the chart (helm template, no cluster); same helm as helm.yml.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - run: pip install pytest==9.1.1 pyyaml==6.0.3
      - name: Configuration guards
        run: pytest tests/config_guards -v
