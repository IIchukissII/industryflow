# Guards over lists whose omission fails silently: CI path filters, compose/Helm image parity, the
# image-digest overlay, the secrets a chart creates vs the ones its pods consume, the edge's upstream
# templating. Each test reads both sides of one such list (tests/config_guards).
#
# No path filter, deliberately: these lists span the whole repository (a new service directory, a
# workflow, the compose file, the chart), so any change can break one, and the job takes seconds.
name: Config guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-guards:
    name: config-guards
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The chart guards render the chart (helm template, no cluster); same helm as helm.yml.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # The shared contracts package too: the tenant-contract guards read its definitions.
      - run: pip install -r scripts/ci/requirements.txt ./libs/industryflow_contracts
      - name: Configuration guards
        run: pytest tests/config_guards -v

  # The object-store principals minio-init.sh creates, enforced by a real MinIO (the pinned build both
  # deployments run): each principal must be able to do its consumer's job and be refused everything
  # else. A policy document that reads right proves nothing until the store has said no to it.
  object-store-principals:
    name: object-store-principals
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MINIO_IMAGE: cgr.dev/chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
      MC_IMAGE: cgr.dev/chainguard/minio-client:latest-dev@sha256:a8a0480cb7356bf1c1f6e348b483a161c727a5c77ca574899e5a045686492bbe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r tests/object_store/requirements.txt
      - name: Start MinIO and take the mc client out of its pinned image
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-root -e MINIO_ROOT_PASSWORD=ci-root-secret-0123456789 \
            "$MINIO_IMAGE" server /data
          id=$(docker create "$MC_IMAGE")
          mkdir -p "$RUNNER_TEMP/bin" && docker cp "$id:/usr/bin/mc" "$RUNNER_TEMP/bin/mc" && docker rm "$id"
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break; sleep 1; done
      - name: Each principal does its job and nothing else
        env:
          MINIO_TEST_ENDPOINT: http://127.0.0.1:9000
          MINIO_TEST_ROOT_USER: ci-root
          MINIO_TEST_ROOT_PASSWORD: ci-root-secret-0123456789
          IF_REQUIRE_LIVE_STACK: "1"
        run: MC="$RUNNER_TEMP/bin/mc" pytest tests/object_store -v
      - name: MinIO logs (on failure)
        if: failure()
        run: docker logs minio

  # The platform alert rules (ADR-0016 dec 1), checked by the pinned Prometheus and Alertmanager both
  # deployments run: the rules' unit tests (a dead letter raises the alert, including a topic's first
  # letter; another stack's series do not), Compose's Prometheus config with the rules resolved as
  # it mounts them, and the shipped Alertmanager config.
  alert-rules:
    name: alert-rules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    steps:
      - uses: actions/checkout@v7
      - name: Rule unit tests
        run: |
          docker run --rm --network none -v "$PWD/infrastructure/prometheus:/p:ro" -w /p/rules/tests \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules platform_test.yml
      # The chart's own group (industryflow.kubernetes) exists only in the template: render it with every
      # device check enabled and run its unit tests against what the chart actually ships.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - run: pip install -r scripts/ci/requirements.txt
      - name: Chart rule unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/k8s"
          helm template if deploy/helm/industryflow --set secrets.failOnPlaceholders=false \
            --set observability.prometheusRules.enabled=true --set ingress.enabled=true \
            --set ingress.mtls.enabled=true --set ingress.mtls.crlCheck.enabled=true \
            --set ingress.mtls.certCheck.enabled=true -s templates/observability-prometheusrules.yaml \
          | python3 -c 'import sys, yaml; groups = yaml.safe_load(sys.stdin)["spec"]["groups"]; print(yaml.safe_dump({"groups": [g for g in groups if g["name"] == "industryflow.kubernetes"]}))' \
          > "$RUNNER_TEMP/k8s/kubernetes-rules.yml"
          docker run --rm --network none -v "$PWD/deploy/observability/tests:/t:ro" -v "$RUNNER_TEMP/k8s:/k8s:ro" \
            -w /t --entrypoint promtool "$PROMETHEUS_IMAGE" test rules kubernetes_rules_test.yml
      - name: Compose's Prometheus config, rules included
        run: |
          docker run --rm --network none \
            -v "$PWD/infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/infrastructure/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
      - name: Shipped Alertmanager config
        run: |
          docker run --rm --network none -v "$PWD/infrastructure/alertmanager:/a:ro" \
            --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config /a/alertmanager.yml

  # Stable aggregate status for branch protection, matching the other workflows' gates. No path
  # filter here, so both jobs always run and the gate passes only when both did.
  config-guards-gate:
    name: config-guards-gate
    needs: [config-guards, object-store-principals, alert-rules]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Gate
        # Every job in `needs`, read from the context itself, so a job added there cannot be left
        # out of the check.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success")) | length > 0' >/dev/null; then
            echo "::error::a configuration guard failed"; exit 1
          fi
