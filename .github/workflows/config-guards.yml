# Guards over lists whose omission fails silently: CI path filters, compose/Helm image parity, the
# image-digest overlay, the secrets a chart creates vs the ones its pods consume, the edge's upstream
# templating. Each test reads both sides of one such list (tests/config_guards).
#
# No path filter, deliberately: these lists span the whole repository (a new service directory, a
# workflow, the compose file, the chart), so any change can break one, and the job takes seconds.
name: Config guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config-guards:
    name: config-guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The chart guards render the chart (helm template, no cluster); same helm as helm.yml.
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      # The shared contracts package too: the tenant-contract guards read its definitions.
      - run: pip install pytest==9.1.1 pyyaml==6.0.3 ./libs/industryflow_contracts
      - name: Configuration guards
        run: pytest tests/config_guards -v

  # The object-store principals minio-init.sh creates, enforced by a real MinIO (the pinned build both
  # deployments run): each principal must be able to do its consumer's job and be refused everything
  # else. A policy document that reads right proves nothing until the store has said no to it.
  object-store-principals:
    name: object-store-principals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINIO_IMAGE: cgr.dev/chainguard/minio:latest@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
      MC_IMAGE: cgr.dev/chainguard/minio-client:latest-dev@sha256:207b9a2045f01cef90feda8127a55f769115e060d8350dcb3a29593fc81166ac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest==9.1.1
      - name: Start MinIO and take the mc client out of its pinned image
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=ci-root -e MINIO_ROOT_PASSWORD=ci-root-secret-0123456789 \
            "$MINIO_IMAGE" server /data
          id=$(docker create "$MC_IMAGE")
          mkdir -p "$RUNNER_TEMP/bin" && docker cp "$id:/usr/bin/mc" "$RUNNER_TEMP/bin/mc" && docker rm "$id"
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break; sleep 1; done
      - name: Each principal does its job and nothing else
        env:
          MINIO_TEST_ENDPOINT: http://127.0.0.1:9000
          MINIO_TEST_ROOT_USER: ci-root
          MINIO_TEST_ROOT_PASSWORD: ci-root-secret-0123456789
          IF_REQUIRE_LIVE_STACK: "1"
        run: MC="$RUNNER_TEMP/bin/mc" pytest tests/object_store -v
      - name: MinIO logs (on failure)
        if: failure()
        run: docker logs minio

  # Stable aggregate status for branch protection, matching the other workflows' gates. No path
  # filter here, so both jobs always run and the gate passes only when both did.
  config-guards-gate:
    name: config-guards-gate
    needs: [config-guards, object-store-principals]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          echo "config-guards=${{ needs.config-guards.result }} object-store-principals=${{ needs.object-store-principals.result }}"
          if [ "${{ needs.config-guards.result }}" != "success" ] || [ "${{ needs.object-store-principals.result }}" != "success" ]; then
            echo "::error::a configuration guard failed"; exit 1
          fi
