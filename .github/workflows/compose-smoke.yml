# The gate that starts the stack (ADR-0026 dec 3, dec 4).
#
# Every other check in this repository reasons about the code or about the dependency graph: the tests
# import modules, `deps-resolve` proves the pins satisfy each other, `images.yml` proves the images
# build. Two failures in one sprint cleared all of that and still shipped a dead service:
#
#   * mlflow resolves perfectly on Python 3.14 and then the SERVER dies importing
#     `importlib.abc.Traversable`, which 3.14 removed (#222);
#   * JupyterHub 5 does not warn when it meets a 4.x state database — it EXITS, and the container
#     crash-loops. A human running `docker compose up` on the box found it; nothing in CI did, because
#     nothing in CI started the hub (#231).
#
# So this job starts the real thing and asserts it stays up.
#
# THE SEEDED STATE IS THE POINT, not an implementation detail. On empty volumes JupyterHub 5 creates a
# 5.x schema and starts happily — the bug is invisible. The upgrade path is the path that breaks, so the
# hub's state database is seeded at the PREVIOUS major's schema before the stack comes up. The seed is
# generated here by the old JupyterHub itself, never copied from a real hub: a real one carries users
# and API tokens, and a fixture with credentials in it is not a fixture.
#
# This is a SMOKE test, deliberately: converge and probe. The deep functional proofs stay in the
# targeted integration workflows (cold-layer, tracking-gateway, db-tenant-isolation) that already own
# them. What this adds is the one thing none of them cover — the stack, as a whole, actually running.
name: Compose smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `.env.example` is a template, not a working config: it ships placeholders that an operator is
      # told to fill in ("REQUIRED — the hub will not start without it"). Do exactly what an operator
      # does, and no more — the point is to start the shipped stack, not a special CI variant of it.
      - name: Provide compose env
        run: |
          cp .env.example .env
          # The hub encrypts the tenant/role it hands the spawn hook (auth_state); the placeholder is
          # not a key, and the hub exits rather than start without a real one.
          sed -i "s|^JUPYTERHUB_CRYPT_KEY=.*|JUPYTERHUB_CRYPT_KEY=$(openssl rand -hex 32)|" .env
          # The SSO proxy's credential to the hub (ADR-0014 dec 3); the hub refuses the placeholder.
          sed -i "s|^NOTEBOOK_SSO_PROXY_SECRET=.*|NOTEBOOK_SSO_PROXY_SECRET=$(openssl rand -hex 32)|" .env
          grep -q '^NOTEBOOK_SSO_PROXY_SECRET=CHANGE_ME' .env && { echo "::error::proxy secret not generated"; exit 1; } || true
          # DockerSpawner reaches the Docker socket through the host's docker group rather than as root
          # (ADR-0011); the gid differs per machine, so take this runner's.
          sed -i "s|^DOCKER_GID=.*|DOCKER_GID=$(getent group docker | cut -d: -f3)|" .env
          grep -E '^(DOCKER_GID|DB_SSLMODE)=' .env
          grep -q '^JUPYTERHUB_CRYPT_KEY=CHANGE_ME' .env && { echo "::error::crypt key not generated"; exit 1; } || true

      # ADR-0017: clients connect to TimescaleDB with sslmode=verify-full and verify the server cert
      # against the internal CA. `.env.example` ships TLS_CERT_DIR empty, so without this step the CA
      # mount is an empty volume, every DB client fails the handshake with "self-signed certificate",
      # and the stack cannot come up — which is exactly what happened the first time this job ran.
      # An operator runs this script too; running it here means the gate exercises the real verify-full
      # path rather than quietly downgrading to sslmode=require the way the other live workflows do.
      - name: Generate the internal CA (the DB clients verify against it)
        run: |
          bash scripts/gen-internal-ca.sh
          # The edges run nginx as uid/gid 101 and read tls.key through its group, which the script
          # sets only when it may (it says so); the operator does this once, and so does the gate.
          sudo chgrp 101 deploy/certs/tls.key
          sed -i "s|^TLS_CERT_DIR=.*|TLS_CERT_DIR=${PWD}/deploy/certs|" .env
          grep -E '^(TLS_CERT_DIR|DB_SSLMODE)=' .env
          test -f deploy/certs/ca.crt || { echo "::error::the CA was not generated"; exit 1; }

      # The mTLS ingestion edge verifies device certificates against the device CA and its CRL
      # (ADR-0002, ADR-0007) and will not start without them. Issue one TEST device certificate, as
      # an operator enrolling a device would, so the probe below can prove a verified device gets
      # through and an anonymous client does not.
      - name: Initialise the device CA and enrol a test device
        run: |
          sh scripts/device-ca.sh init
          sh scripts/device-ca.sh issue 00000000-0000-4000-8000-000000000001 smoke-device
          test -f deploy/device-ca/ca-chain.crt && test -f deploy/device-ca/crl/device-ca.crl
          # Issued per tenant and serial; current.* names the newest (docs/operations/device-mtls.md).
          dev=deploy/device-ca/devices/00000000-0000-4000-8000-000000000001/smoke-device
          test -f "$dev/current.chain.crt" && test -f "$dev/current.key"

      # ADR-0034 dec 6 (ADR-0026 dec 4): the platform database is seeded by the PREVIOUS release, from
      # its own commit, with a tenant written through it, so the stack below upgrades real previous
      # state rather than initialising an empty volume. The previous release keeps this run's .env, as
      # an operator's does across an upgrade. A previous release without the runner initialised the
      # database under the image's init hook and left no ledger, which is the first upgrade of every
      # live database; one with the runner left its ledger, which is every upgrade after it.
      - name: Seed the platform database at the PREVIOUS release (the upgrade path is what breaks)
        env:
          PREV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$PREV"
          git worktree add --detach "$RUNNER_TEMP/prev" "$PREV"
          cp .env "$RUNNER_TEMP/prev/.env"
          prev() { docker compose -p "$(basename "$PWD")" --project-directory "$RUNNER_TEMP/prev" -f "$RUNNER_TEMP/prev/docker-compose.yml" "$@"; }
          runner=no
          prev config --services | grep -qx db-migrate && runner=yes
          echo "previous release $PREV has the migration runner: $runner"
          prev up -d --wait --wait-timeout 300 timescaledb
          if [ "$runner" = yes ]; then
            # `up --wait` returns once a one-shot has started, not finished; run it to completion.
            prev run --rm db-migrate
          else
            # Under the init hook the server is "ready" on its socket while the scripts still run,
            # then restarts; the scripts are done once the hook says so.
            for i in $(seq 1 90); do
              prev logs timescaledb 2>&1 | grep -q "PostgreSQL init process complete" && break; sleep 2
            done
            prev logs timescaledb 2>&1 | grep -q "PostgreSQL init process complete" \
              || { echo "::error::the previous release never finished initialising"; prev logs timescaledb | tail -40; exit 1; }
            until prev exec -T timescaledb pg_isready -q; do sleep 2; done
          fi
          prev exec -T timescaledb sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT company_id FROM public.provision_company('"'"'upgrade-seed'"'"')"'
          prev exec -T timescaledb sh -c 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT coalesce(to_regclass('"'"'public.schema_ledger'"'"')::text, '"'"'no ledger'"'"')"'
          # Stop the previous release and keep its volumes: the stack below starts on them.
          prev down

      # ADR-0026 dec 4. Build the seed with the JupyterHub the hub is upgrading FROM, so the schema is
      # genuinely the old one rather than something we assert is old. `new_session_factory` creates the
      # tables and stamps alembic at that version's head — an empty database with a real previous-major schema.
      - name: Seed the hub state DB at the PREVIOUS JupyterHub major (the upgrade path is what breaks)
        env:
          # The major the hub upgrades FROM (5.x -> 6.x). Bump this when the current major moves, or the "upgrade"
          # test quietly starts upgrading from the version it is already on — i.e. testing nothing.
          PREV_JUPYTERHUB: "5.5.0"
        run: |
          mkdir -p hub-seed
          cat > hub-seed/seed.py <<'PY'
          import sqlite3
          from jupyterhub import orm

          orm.new_session_factory("sqlite:///jupyterhub.sqlite")
          db = sqlite3.connect("jupyterhub.sqlite")
          revision = db.execute("select version_num from alembic_version").fetchone()[0]
          users = db.execute("select count(*) from users").fetchone()[0]
          print(f"seeded hub state db: alembic={revision} users={users}")
          # A fixture with credentials in it is not a fixture. The seed is generated, never copied
          # from a real hub, so it must be empty of users and of API tokens.
          assert users == 0, "the seed must carry no users and no tokens"
          PY
          docker run --rm -v "$PWD/hub-seed:/seed" -w /seed python:3.12-slim \
            sh -c "pip install --quiet jupyterhub==${PREV_JUPYTERHUB} && python seed.py"
          # A root-owned database makes SQLite fail 'attempt to write a readonly database', which reads
          # like a migration bug and is not one. The volume's ownership is set in the next step, as the
          # uid the hub actually runs as.
          sudo chmod -R a+rX hub-seed

      - name: Load the seed into the hub's volume
        run: |
          docker volume create industryflow_notebook-hub-data
          # Own the whole DIRECTORY as the user the hub actually runs as — `USER 10001` in
          # services/notebook_hub/Dockerfile. Two ways to get this wrong, and I made both: a fresh
          # volume's root is owned by root, so the hub reads the seeded database fine and then dies
          # creating its cookie secret beside it ("Permission denied: .../jupyterhub_cookie_secret");
          # and the uid is not the 1000 you would assume. Seeding state into a volume means handing the
          # directory over exactly as the service will hold it.
          HUB_UID=$(grep -oP '^USER \K[0-9]+' services/notebook_hub/Dockerfile)
          echo "hub runs as uid ${HUB_UID}"
          docker run --rm -v industryflow_notebook-hub-data:/srv/jupyterhub -v "$PWD/hub-seed:/seed" \
            -e HUB_UID="$HUB_UID" alpine sh -c '
              cp /seed/jupyterhub.sqlite /srv/jupyterhub/jupyterhub.sqlite &&
              chown -R "$HUB_UID:$HUB_UID" /srv/jupyterhub &&
              ls -ld /srv/jupyterhub && ls -l /srv/jupyterhub/jupyterhub.sqlite'

      # --wait blocks until every container with a healthcheck reports healthy, and fails if one exits.
      # A hub that crash-loops on the seeded schema fails HERE, which is the whole purpose of this job.
      #
      # SCOPE, stated honestly: the application services, the three edges every outside request
      # crosses (the frontend TLS edge, the notebook SSO proxy behind it, the mTLS ingestion edge),
      # the notebooks profile, and (via depends_on) the infrastructure they need. NOT the monitoring
      # stack (grafana/prometheus/loki/exporters) and NOT the Spark JVMs — a 2-vCPU runner cannot
      # converge 31 containers, and neither of those is on the failure path this gate exists for.
      # A Spark-image break is therefore still only caught by its own build, which is a known limit.
      - name: Start the stack (notebooks profile included — the hub is the point)
        run: |
          docker compose --profile notebooks up -d --build --wait --wait-timeout 900 \
            api-gateway ingestion-service ml-service-api alert-service-detector \
            mlflow notebook-hub notebook-sql-proxy notebook-tracking-gateway notebook-cold-broker \
            frontend notebook-sso ingestion-edge

      # The signal is not WHETHER a container restarted — it is whether it KEEPS restarting.
      #
      # A cold start races: services come up before Kafka/Postgres finish accepting connections, die,
      # and are respawned by their restart policy until the dependency is there. That is ordinary, and
      # `--wait` above already proved they all reached healthy. A crash-loop looks different: the
      # restart count keeps CLIMBING, and the container is "running" every time you happen to look
      # (which is exactly how JupyterHub 5 would have slipped past a naive point-in-time check).
      #
      # So: snapshot the counts, wait, and fail on any that moved. That separates "settled after a
      # startup race" from "will never settle", which is the distinction the gate actually cares about.
      - name: Nothing is crash-looping (restart counts must be STABLE, not zero)
        run: |
          snapshot() {
            for c in $(docker ps -a --filter name=industryflow --format '{{.Names}}'); do
              echo "$c $(docker inspect -f '{{.State.Status}} {{.RestartCount}} {{.State.ExitCode}}' "$c")"
            done
          }
          snapshot > /tmp/before.txt
          echo "observing for 60s..."
          sleep 60
          snapshot > /tmp/after.txt

          rc=0
          while read -r c state restarts exitcode; do
            was=$(awk -v n="$c" '$1==n {print $3}' /tmp/before.txt)
            # One-shot init containers (minio-init, db-cert-init, cold-export) legitimately exit 0.
            if [ "$state" = "exited" ] && [ "$exitcode" = "0" ]; then
              echo "OK    $c (one-shot, exited 0)"; continue
            fi
            if [ "$state" != "running" ]; then
              echo "::error::$c is $state (exit=$exitcode)"
              docker logs --tail=40 "$c" 2>&1 | sed "s/^/    $c| /"; rc=1
            elif [ "$restarts" != "$was" ]; then
              echo "::error::$c is CRASH-LOOPING — restarts went $was -> $restarts while it was merely being watched"
              docker logs --tail=40 "$c" 2>&1 | sed "s/^/    $c| /"; rc=1
            else
              echo "OK    $c (running, stable at $restarts restart(s))"
            fi
          done < /tmp/after.txt
          exit $rc

      - name: The runner upgraded the seeded database and the ledger is current
        run: |
          docker compose logs db-migrate 2>&1 | tail -5
          docker compose logs db-migrate 2>&1 | grep -q "ledger current" \
            || { echo "::error::db-migrate did not report a current ledger"; exit 1; }
          docker compose run --rm db-migrate verify \
            || { echo "::error::the ledger is behind after the upgrade"; exit 1; }
          seed=$(docker compose exec -T timescaledb sh -c \
            'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM public.companies WHERE company_name = '"'"'upgrade-seed'"'"'"')
          [ "$seed" = 1 ] || { echo "::error::the tenant the previous release wrote is gone"; exit 1; }
          echo "OK    the previous release's tenant survived the upgrade; ledger current"

      - name: The hub migrated the seeded schema and is serving
        run: |
          # Proof the upgrade path actually ran, rather than the seed being quietly ignored.
          docker compose --profile notebooks logs notebook-hub 2>&1 | grep -q "Running upgrade" \
            && echo "OK    the hub migrated the seeded previous-major schema on start" \
            || { echo "::error::the hub never migrated the seed — the upgrade path was not exercised"; exit 1; }
          docker compose --profile notebooks exec -T notebook-hub \
            python -c "import urllib.request; print('hub health:', urllib.request.urlopen('http://localhost:8081' + __import__('os').environ.get('NOTEBOOK_BASE_URL', '/').rstrip('/') + '/hub/health', timeout=10).status)"
          # chp (the browser-facing proxy) answers on the platform-network alias, where notebook-sso
          # reaches it; the kernel network does not (asserted in the kernel-network step).
          docker compose --profile notebooks exec -T notebook-sso \
            wget -q -O /dev/null http://notebook-hub-public:8000/jupyter/hub/health \
            && echo "OK    chp serves the hub on the platform network" \
            || { echo "::error::notebook-sso cannot reach chp at notebook-hub-public:8000"; exit 1; }
          # The SSO config is a template; a variable left unrendered would send a literal to the hub.
          docker compose --profile notebooks exec -T notebook-sso sh -c \
            'nginx -t && ! grep -n "\${NOTEBOOK_" /etc/nginx/nginx.conf' \
            || { echo "::error::notebook-sso config did not render"; exit 1; }

      # Probed from inside the network (the services are not host-published), and with the container's
      # own python so no tooling has to be installed.
      - name: Probe the services that serve HTTP
        run: |
          cat > probe.py <<'PY'
          import sys, urllib.request
          TARGETS = {
              "api-gateway":               "http://localhost:8000/health",
              "ml-service-api":            "http://ml-service-api:8002/health",
              "notebook-cold-broker":      "http://notebook-cold-broker:5060/health",
              "notebook-tracking-gateway": "http://notebook-tracking-gateway:5050/health",
          }
          bad = []
          for name, url in TARGETS.items():
              try:
                  code = urllib.request.urlopen(url, timeout=10).status
                  print(f"{'OK  ' if code == 200 else 'FAIL'}  {name} -> {code}")
                  if code != 200:
                      bad.append(name)
              except Exception as e:
                  print(f"FAIL  {name} -> {e}")
                  bad.append(name)
          sys.exit(1 if bad else 0)
          PY
          docker compose cp probe.py api-gateway:/tmp/probe.py
          docker compose exec -T api-gateway python /tmp/probe.py

      # The edges are what an outside client actually talks to, and each proxies by name to a service
      # behind it — a config that names the wrong upstream starts happily and fails every request.
      # So each is probed from the host, through its real listener and certificate:
      #   frontend   /healthz (its own probe), and /health PROXIED to the gateway over TLS, with the
      #              security headers present; plain HTTP is redirected to https.
      #   notebook-sso  /jupyter/ through the frontend: with no session the SSO proxy asks the gateway,
      #              is refused, and sends the browser to /login — which proves all three hops.
      #   ingestion-edge  /health PROXIED to ingestion with the test device's certificate, and the
      #              handshake refused without one.
      - name: Probe the edges from outside
        run: |
          set -euo pipefail
          ca=deploy/certs/ca.crt
          dev=deploy/device-ca/devices/00000000-0000-4000-8000-000000000001/smoke-device
          curl -fsS http://localhost:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/alerts)" = 301
          curl -fsS --cacert "$ca" -D headers.txt -o /dev/null https://localhost:3443/health
          for h in Strict-Transport-Security Content-Security-Policy X-Content-Type-Options; do
            grep -qi "^$h:" headers.txt || { echo "::error::frontend sends no $h"; cat headers.txt; exit 1; }
          done
          echo "OK    frontend: probe, redirect, /health via the gateway, security headers"
          code=$(curl -s --cacert "$ca" -o /dev/null -w '%{http_code} %{redirect_url}' https://localhost:3443/jupyter/hub/home)
          case "$code" in
            "302 https://localhost:3443/login") echo "OK    notebook-sso: unauthenticated -> /login via the gateway" ;;
            *) echo "::error::/jupyter/ through the edge answered '$code', expected a redirect to /login"; exit 1 ;;
          esac
          curl -fsS --cacert "$ca" --cert "$dev/current.chain.crt" --key "$dev/current.key" \
            https://localhost:8443/health
          if curl -fs --cacert "$ca" -o /dev/null https://localhost:8443/health; then
            echo "::error::the ingestion edge served a client with no certificate"; exit 1
          fi
          echo "OK    ingestion-edge: verified device reaches ingestion, anonymous client refused"

      # ADR-0018 dec 4: a kernel is untrusted code on a dedicated network that holds only the hub, the
      # trusted mediators and the object store. Both halves are asserted, because each fails silently:
      # a mediator missing from the network breaks notebooks, and a platform service added to it (or a
      # kernel spawned onto the platform network) hands untrusted code the capability store, where it
      # can list or forge any tenant's capabilities (ADR-0015). The network is read from the hub's own
      # config, so this proves where kernels are actually spawned. The host-gateway probes prove the
      # internal ports are loopback-bound, not published on every interface (ADR-0004 dec 1, ADR-0013).
      - name: The kernel network reaches the mediators and nothing else
        run: |
          net=$(docker compose --profile notebooks exec -T notebook-hub printenv NOTEBOOK_NETWORK)
          gw=$(docker network inspect "$net" --format '{{(index .IPAM.Config 0).Gateway}}')
          echo "kernel network: $net (host gateway $gw)"
          cat > reach.py <<'PY'
          import socket, sys
          gw = sys.argv[1]
          MUST = [("notebook-hub", 8081), ("api-gateway", 8000), ("notebook-sql-proxy", 6432),
                  ("notebook-tracking-gateway", 5050), ("notebook-cold-broker", 5060), ("minio", 9000)]
          MUST_NOT = [("redis", 6379), ("mlflow", 5000), ("kafka", 29092), ("zookeeper", 2181),
                      ("timescaledb", 5432), ("spark-master", 7077), ("ml-service-api", 8002),
                      ("prometheus", 9090), ("loki", 3100), ("notebook-hub", 8000),
                      (gw, 5000), (gw, 9000), (gw, 9090), (gw, 3100), (gw, 8000), (gw, 6379)]
          def reach(host, port):
              try:
                  socket.create_connection((host, port), timeout=5).close()
                  return True
              except OSError:
                  return False
          bad = [f"cannot reach {h}:{p}" for h, p in MUST if not reach(h, p)]
          bad += [f"CAN reach {h}:{p}" for h, p in MUST_NOT if reach(h, p)]
          print("\n".join(bad) or "kernel network boundary holds")
          sys.exit(1 if bad else 0)
          PY
          docker run --rm --network "$net" --user 1000:1000 -v "$PWD/reach.py:/reach.py:ro" \
            python:3.12-slim python /reach.py "$gw"

      # ADR-0014 dec 3. A kernel reaches the hub API, and the login route is served by the same
      # application, so from the kernel network a forged identity must get no hub session: without
      # the SSO proxy's secret, or with a wrong one, the login is refused. The same request carrying
      # the real secret is accepted, which proves the refusals come from this check and not from
      # some other failure. Run as the kernel uid, on the network the hub spawns kernels onto.
      - name: A forged hub login from the kernel network is refused
        run: |
          net=$(docker compose --profile notebooks exec -T notebook-hub printenv NOTEBOOK_NETWORK)
          base=$(docker compose --profile notebooks exec -T notebook-hub printenv NOTEBOOK_BASE_URL)
          cat > forge.py <<'PY'
          import os, sys, urllib.error, urllib.request
          URL = "http://notebook-hub:8081" + sys.argv[1] + "hub/login"
          IDENTITY = {"X-IF-User": "forged-admin", "X-IF-Role": "admin",
                      "X-IF-Company-Id": "00000000-0000-4000-8000-000000000001"}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None
          def login(extra):
              req = urllib.request.Request(URL, headers={**IDENTITY, **extra})
              try:
                  r = urllib.request.build_opener(NoRedirect).open(req, timeout=10)
              except urllib.error.HTTPError as e:
                  r = e
              return r.status, " ".join(r.headers.get_all("Set-Cookie") or [])
          bad = []
          for name, extra in [("no secret", {}), ("wrong secret", {"X-IF-SSO-Proxy-Secret": "0" * 64})]:
              status, cookies = login(extra)
              print(f"{name}: {status}")
              if status != 401 or "jupyterhub-hub-login" in cookies:
                  bad.append(f"{name}: got {status}, a hub session was {'set' if cookies else 'not set'}")
          status, cookies = login({"X-IF-SSO-Proxy-Secret": os.environ["SECRET"]})
          print(f"proxy secret: {status}")
          if status != 302 or "jupyterhub-hub-login" not in cookies:
              bad.append(f"the real secret was not accepted ({status}): the probe measures nothing")
          print("\n".join(bad) or "forged logins refused, proxy login accepted")
          sys.exit(1 if bad else 0)
          PY
          SECRET=$(grep -oP '^NOTEBOOK_SSO_PROXY_SECRET=\K.*' .env)
          docker run --rm --network "$net" --user 1000:1000 -e SECRET="$SECRET" \
            -v "$PWD/forge.py:/forge.py:ro" python:3.12-slim python /forge.py "$base"

      - name: Dump everything on failure
        if: failure()
        run: docker compose --profile notebooks ps -a && docker compose --profile notebooks logs --tail=80

      - name: Tear down
        if: always()
        run: |
          docker compose --profile notebooks down -v
          docker volume rm -f industryflow_notebook-hub-data || true

  # Stable aggregate status for branch protection, matching the convention the other gates use.
  compose-smoke-gate:
    name: compose-smoke-gate
    needs: [compose-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the smoke result
        run: |
          result="${{ needs.compose-smoke.result }}"
          echo "compose-smoke=$result"
          if [ "$result" != "success" ]; then
            echo "::error::the stack did not come up clean"; exit 1
          fi
