# IndustryFlow - Docker Compose

# DB TLS (ADR-0017): clients verify the TimescaleDB server cert against the internal CA. The CA
# is mounted read-only into each DB client; DB_SSLMODE is overridable (.env) — default
# verify-full, set 'disable' for a bare dev stack with no generated certs.
x-db-tls-env: &db-tls-env
  DB_SSLMODE: ${DB_SSLMODE:-verify-full}
  DB_SSLROOTCERT: /etc/ssl/industryflow/ca.crt
x-ca-mount: &ca-mount "${TLS_CERT_DIR:-frontend-certs}:/etc/ssl/industryflow:ro"

# Spark checkpoint on object storage (ADR-0006). The driver reads/writes the same checkpoint as
# the executors, so on a multi-worker cluster it must live on ONE store visible to all — MinIO
# via S3A, not a local volume (docs/architecture/stream-processing.md). The job's SparkSession
# enables S3A when CHECKPOINT_LOCATION is an s3a:// URI. Set it to a local path to opt out.
x-spark-s3a-env: &spark-s3a-env
  CHECKPOINT_LOCATION: ${SPARK_CHECKPOINT_LOCATION:-s3a://spark-checkpoints}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

services:
  # ==========================================================================
  # PHASE 1: CORE INFRASTRUCTURE
  # ==========================================================================

  # Zookeeper - Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: industryflow-zookeeper
    ports:
      - "127.0.0.1:2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - industryflow-network
    restart: unless-stopped

  # Kafka - Message streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: industryflow-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - industryflow-network
    restart: unless-stopped

  # Stages the TimescaleDB TLS cert into a postgres-owned volume with 0600 perms (ADR-0017):
  # Postgres refuses a key it doesn't own / that is group-readable, which a bind mount can't
  # satisfy. Uses the CA-signed db.crt/db.key from TLS_CERT_DIR if present, else self-signs a
  # dev cert so `ssl=on` never breaks a bare `docker compose up`.
  db-cert-init:
    image: alpine:3.20
    container_name: industryflow-db-cert-init
    command:
      - sh
      - -ec
      - |
        if [ -f /src/db.key ] && [ -f /src/db.crt ]; then
          cp /src/db.crt /dst/db.crt; cp /src/db.key /dst/db.key
          { [ -f /src/ca.crt ] && cp /src/ca.crt /dst/ca.crt; } || cp /src/db.crt /dst/ca.crt
          echo "staged CA-signed DB cert"
        else
          apk add --no-cache openssl >/dev/null
          openssl req -x509 -nodes -newkey rsa:2048 -days 825 -keyout /dst/db.key -out /dst/db.crt \
            -subj /CN=timescaledb -addext subjectAltName=DNS:timescaledb,DNS:localhost,IP:127.0.0.1 2>/dev/null
          cp /dst/db.crt /dst/ca.crt
          echo "generated self-signed DB cert (dev fallback)"
        fi
        chown -R 70:70 /dst && chmod 600 /dst/db.key && chmod 644 /dst/db.crt /dst/ca.crt
    volumes:
      - "${TLS_CERT_DIR:-frontend-certs}:/src:ro"
      - db-certs:/dst
    restart: "no"
    networks:
      - industryflow-network

  # TimescaleDB - Time-series database
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: industryflow-timescaledb
    depends_on:
      db-cert-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    environment:
      # Postgres superuser credentials
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      
      # Application role passwords (for init scripts)
      API_GATEWAY_DB_PASSWORD: ${API_GATEWAY_DB_PASSWORD}
      SPARK_STREAMING_DB_PASSWORD: ${SPARK_STREAMING_DB_PASSWORD}
      ALERT_SERVICE_DB_PASSWORD: ${ALERT_SERVICE_DB_PASSWORD}
      ML_SERVICE_DB_PASSWORD: ${ML_SERVICE_DB_PASSWORD}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      # Notebook SQL proxy privileged role (ADR-0015) — created only when set (notebooks profile).
      NOTEBOOK_SQL_PROXY_DB_PASSWORD: ${NOTEBOOK_SQL_PROXY_DB_PASSWORD:-}

      # Postgres configuration - HIGH THROUGHPUT
      POSTGRES_SHARED_BUFFERS: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 2GB
      POSTGRES_MAX_CONNECTIONS: 400
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infrastructure/timescaledb/init-scripts:/docker-entrypoint-initdb.d
      - ./infrastructure/timescaledb/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/timescaledb/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - db-certs:/etc/postgresql/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - industryflow-network
    restart: unless-stopped

  # Redis - Caching layer
  redis:
    image: redis:7-alpine
    container_name: industryflow-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - industryflow-network
    restart: unless-stopped

  # MinIO - S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: industryflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - industryflow-network
    restart: unless-stopped

  # MinIO bucket bootstrap — one-shot that creates the buckets the platform needs (the Spark
  # S3A checkpoint store, plus the MLflow artifact bucket) and exits. Idempotent: `mc mb -p`
  # is a no-op if a bucket already exists, so it is safe on every `up`. Spark jobs gate on this
  # completing (depends_on: service_completed_successfully).
  minio-init:
    image: minio/mc:latest
    container_name: industryflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      SPARK_CHECKPOINT_BUCKET: ${SPARK_CHECKPOINT_BUCKET:-spark-checkpoints}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb -p "local/$$SPARK_CHECKPOINT_BUCKET"
        mc mb -p local/mlflow
        echo "buckets ready: $$SPARK_CHECKPOINT_BUCKET, mlflow"
    networks:
      - industryflow-network
    restart: "no"

  # MLflow - Experiment tracking
  mlflow:
    build:
      context: ./infrastructure/mlflow
      dockerfile: Dockerfile
    container_name: industryflow-mlflow
    ports:
      - "5000:5000"
    environment:
      BACKEND_STORE_URI: postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/mlflow?sslmode=verify-full&sslrootcert=/etc/ssl/industryflow/ca.crt
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/mlflow?sslmode=verify-full&sslrootcert=/etc/ssl/industryflow/ca.crt
      --default-artifact-root s3://mlflow
      --host 0.0.0.0
      --port 5000
    depends_on:
      timescaledb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # Slim image has no curl — use the Python stdlib. Longer start_period: mlflow boots slowly.
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    restart: unless-stopped

  # ==========================================================================
  # PHASE 2: SPARK STREAMING SERVICES
  # ==========================================================================

  # Spark Master
  spark-master:
    image: apache/spark:3.5.0
    container_name: industryflow-spark-master
    ports:
      - "7077:7077"
      - "8083:8080"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    volumes:
      # Stock image: mount the PrometheusServlet config so the master serves
      # /metrics/master/prometheus on 8080 (the built images bake it in). Item 7.
      - ./services/spark_jobs/metrics.properties:/opt/spark/conf/metrics.properties:ro
    networks:
      - industryflow-network
    restart: unless-stopped

  # Spark Worker — a SCALABLE pool: no container_name and no published port (the worker dials out
  # to the master and registers its own web UI there), so `SPARK_WORKER_REPLICAS` / `--scale
  # spark-worker=N` brings up N workers without name/port clashes. Inspect them via the master UI.
  spark-worker:
    # Built (not the stock image) so executors have psycopg2 for the TimescaleDB writes.
    build:
      context: ./services/spark_jobs
      dockerfile: Dockerfile.worker
    depends_on:
      - spark-master
    environment:
      <<: *db-tls-env
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_WEBUI_PORT: 8081
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - *ca-mount  # executor runs psycopg2 here; needs the CA to verify the DB cert (ADR-0017)
    # The executor writes Structured-Streaming STATE-store deltas to the checkpoint and the driver
    # (the spark-* job containers) reads them, so both must see ONE store. That store is now MinIO
    # via S3A (CHECKPOINT_LOCATION=s3a://…), shared by every node over the network — so this worker
    # needs NO local checkpoint volume and the cluster can scale to N workers (ADR-0006).
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-1}
    networks:
      - industryflow-network
    restart: unless-stopped

  # Spark Streaming - Raw sensor data to TimescaleDB
  spark-streaming:
    build:
      context: ./services/spark_jobs
      dockerfile: Dockerfile.streaming
    container_name: industryflow-spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: [*db-tls-env, *spark-s3a-env]
      # Spark configuration
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      # Resource budget on the shared worker (ADR-0006): cores capped so streaming +
      # aggregations coexist (sum <= SPARK_WORKER_CORES). Raise these / add workers to scale.
      SPARK_CORES_MAX: ${SPARK_STREAMING_CORES_MAX:-1}
      SPARK_SQL_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}

      # Kafka configuration
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      # TimescaleDB configuration - USE SPARK STREAMING ROLE
      TIMESCALEDB_HOST: ${DB_HOST}
      TIMESCALEDB_PORT: ${DB_PORT}
      TIMESCALEDB_DB: ${DB_NAME}
      SPARK_STREAMING_DB_USER: ${SPARK_STREAMING_DB_USER}
      SPARK_STREAMING_DB_PASSWORD: ${SPARK_STREAMING_DB_PASSWORD}
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    restart: unless-stopped

  # Spark Aggregations - Create 1min, 5min, 1hour aggregations
  spark-aggregations:
    build:
      context: ./services/spark_jobs
      dockerfile: Dockerfile.aggregations
    container_name: industryflow-spark-aggregations
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: [*db-tls-env, *spark-s3a-env]
      # Spark configuration
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      # Aggregations runs 3 windowed streams; give it the larger share of the worker
      # (sum with streaming <= SPARK_WORKER_CORES). Raise / add workers to scale.
      SPARK_CORES_MAX: ${SPARK_AGG_CORES_MAX:-3}
      SPARK_SQL_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}

      # Kafka configuration
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      # TimescaleDB configuration - USE SPARK STREAMING ROLE
      TIMESCALEDB_HOST: ${DB_HOST}
      TIMESCALEDB_PORT: ${DB_PORT}
      TIMESCALEDB_DB: ${DB_NAME}
      SPARK_STREAMING_DB_USER: ${SPARK_STREAMING_DB_USER}
      SPARK_STREAMING_DB_PASSWORD: ${SPARK_STREAMING_DB_PASSWORD}
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    restart: unless-stopped

  # ==========================================================================
  # API Gateway - REST API with schema-per-tenant routing
  # ==========================================================================

  api-gateway:
    container_name: industryflow-api-gateway
    build:
      context: ./services/api_gateway
      dockerfile: Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      <<: *db-tls-env
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      API_GATEWAY_DB_USER: ${API_GATEWAY_DB_USER}
      API_GATEWAY_DB_PASSWORD: ${API_GATEWAY_DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    healthcheck:
      # python-slim has no curl; use stdlib urllib (always present in the image).
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
    container_name: industryflow-frontend
    environment:
      # Extra SANs for the self-signed dev cert, e.g. the host LAN IP
      # ("IP:<host-ip>"). Ignored when a real cert is mounted at /etc/nginx/certs.
      CERT_EXTRA_SAN: ${CERT_EXTRA_SAN:-}
    ports:
      # Unprivileged nginx listens on 8443/8080 inside the container; host ports unchanged.
      - "${FRONTEND_HTTPS_PORT:-3443}:8443"
      - "${FRONTEND_PORT:-3000}:8080"
    volumes:
      # Default: a named volume the entrypoint self-signs into. Set TLS_CERT_DIR to a host
      # directory holding tls.crt/tls.key (e.g. the output of scripts/gen-internal-ca.sh) to
      # serve a real CA-signed certificate instead.
      - "${TLS_CERT_DIR:-frontend-certs}:/etc/nginx/certs"
    depends_on:
      - api-gateway
    networks:
      - industryflow-network
    restart: unless-stopped

  ingestion-service:
    container_name: industryflow-ingestion-service
    build:
      context: ./services/ingestion_service
      dockerfile: Dockerfile
    # No host port: ingestion is reachable only via the mTLS edge (ADR-0002 dec 3).
    expose:
      - "8003"
    environment:
      INGESTION_SERVICE_PORT: 8003
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_SENSOR_DATA: ${KAFKA_TOPIC_SENSOR_DATA}
    # Ingestion is stateless: mTLS-authenticated, Kafka-only. No database role (ADR-0002).
    depends_on:
      kafka:
        # Wait for Kafka to be READY, not just started — otherwise the producer can hit a
        # not-yet-ready broker on a recreate. (The producer also retries bootstrap as a
        # belt-and-suspenders for k8s, where there is no depends_on.)
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --workers 2
    networks:
      - industryflow-network
    restart: unless-stopped

  # mTLS ingestion edge (ADR-0002): verifies device client certs against the device CA +
  # CRL and forwards the verified identity to ingestion-service (the only way in).
  ingestion-edge:
    image: nginx:1.27-alpine
    container_name: industryflow-ingestion-edge
    ports:
      - "${INGESTION_MTLS_PORT:-8443}:8443"
    volumes:
      - ./services/ingestion_edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Server cert (handshake) — reuses the internal-CA TLS cert; device CA (verify + CRL).
      - "${TLS_CERT_DIR:-frontend-certs}:/etc/nginx/server:ro"
      - "${DEVICE_CA_DIR:-./deploy/device-ca}:/etc/nginx/device-ca:ro"
    depends_on:
      - ingestion-service
    networks:
      - industryflow-network
    restart: unless-stopped

  # ==========================================================================
  # ALERT SERVICE - Worker (Detection Engine)
  # ==========================================================================
  alert-service-detector:
    build:
      context: ./services/alert_service
      dockerfile: worker/Dockerfile
    container_name: industryflow-alert-service-detector
    environment:
      <<: *db-tls-env
      TIMESCALEDB_HOST: ${DB_HOST}
      TIMESCALEDB_PORT: ${DB_PORT}
      TIMESCALEDB_DB: ${DB_NAME}
      ALERT_SERVICE_DB_USER: ${ALERT_SERVICE_DB_USER}
      ALERT_SERVICE_DB_PASSWORD: ${ALERT_SERVICE_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_SENSOR_DATA: ${KAFKA_TOPIC_SENSOR_DATA}
      KAFKA_TOPIC_ALERTS: ${KAFKA_TOPIC_ALERTS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID}
      RULE_RELOAD_INTERVAL: ${RULE_RELOAD_INTERVAL:-60}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-300}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    restart: unless-stopped
    healthcheck:
      # No HTTP endpoint and the slim image has no ps — liveness via PID 1's cmdline (the worker
      # runs as PID 1, so if it dies the container exits anyway). Python only, no external tools.
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0 if b'main.py' in open('/proc/1/cmdline','rb').read() else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  alert-service-api:
    build:
      context: ./services/alert_service
      dockerfile: api/Dockerfile
    container_name: industryflow-alert-service-api
    ports:
      - "${ALERT_SERVICE_PORT}:8001"
    environment:
      <<: *db-tls-env
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      ALERT_SERVICE_DB_USER: ${ALERT_SERVICE_DB_USER}
      ALERT_SERVICE_DB_PASSWORD: ${ALERT_SERVICE_DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ALERT_SERVICE_PORT: ${ALERT_SERVICE_PORT}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    restart: unless-stopped
    healthcheck:
      # Slim image has no curl — use the Python stdlib (matches api-gateway/ml-service).
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # ML Service
  # ============================================================================

  ml-service-api:
    build:
      context: ./services/ml_service
      dockerfile: api/Dockerfile
    container_name: industryflow-ml-service-api
    ports:
      - "${ML_SERVICE_PORT}:8002"
    environment:
      <<: *db-tls-env
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      ML_SERVICE_DB_USER: ${ML_SERVICE_DB_USER}
      ML_SERVICE_DB_PASSWORD: ${ML_SERVICE_DB_PASSWORD}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      MODEL_DIR: /app/models
      # Extension plugin modules to import at startup (ADR-0010); empty = generic built-ins.
      EXTENSION_MODULES: ${EXTENSION_MODULES:-}
      # MinIO/S3 credentials for loading models from MLflow
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MINIO_ENDPOINT}
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
      - ml-models:/app/models
    networks:
      - industryflow-network
    depends_on:
      - timescaledb
      - mlflow
    restart: unless-stopped
    healthcheck:
      # python-slim has no curl; use stdlib urllib (always present in the image).
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # NOTEBOOK HUB (ADR-0011/0014/0018) — opt-in `notebooks` profile.
  # Multi-tenant, per-user, NON-ROOT notebooks via JupyterHub + DockerSpawner. Replaces the old
  # root, auth-disabled, shared-credential `jupyter` shim (retired, ADR-0018 dec 5). The kernel
  # holds only opaque, single-tenant, read-only capability handles minted by the hub — never a DB
  # password. Bring up:  docker compose --profile notebooks build
  #                      docker compose --profile notebooks up -d notebook-hub notebook-sso
  # ==========================================================================

  # Build-only: the two per-user images the hub spawns by role profile (ADR-0011 dec 5) — authoring
  # (JupyterLab + DS stack) and analytics (Voila read-only dashboards). Never started directly
  # (DockerSpawner runs per-user copies); `command: true` makes an accidental `up` a no-op.
  notebook-authoring:
    profiles: ["notebooks"]
    build:
      context: ./clients/python
      dockerfile: ../../services/notebook_hub/Dockerfile.authoring
    image: industryflow-notebook-authoring
    command: ["true"]
    restart: "no"

  notebook-analytics:
    profiles: ["notebooks"]
    build:
      context: ./clients/python
      dockerfile: ../../services/notebook_hub/Dockerfile.analytics
    image: industryflow-notebook-analytics
    command: ["true"]
    restart: "no"

  notebook-hub:
    profiles: ["notebooks"]
    build:
      context: ./services/notebook_hub
      dockerfile: Dockerfile
    image: industryflow-notebook-hub
    container_name: industryflow-notebook-hub
    environment:
      NOTEBOOK_SPAWNER: docker
      # Per-profile images (ADR-0011 dec 5): the hook picks one by the user's role profile.
      NOTEBOOK_IMAGE_AUTHORING: industryflow-notebook-authoring
      NOTEBOOK_IMAGE_ANALYTICS: industryflow-notebook-analytics
      NOTEBOOK_NETWORK: industryflow-network
      HUB_CONNECT_IP: notebook-hub
      # Mount the hub under a path prefix so the frontend can embed it same-origin (ADR-0014):
      # <app>/jupyter/ → notebook-sso → hub. JupyterHub propagates this to chp + single-user servers.
      NOTEBOOK_BASE_URL: ${NOTEBOOK_BASE_URL:-/jupyter/}
      REDIS_URL: redis://redis:6379/0
      # Required for enable_auth_state — the hub encrypts the verified tenant/role it carries from
      # the SSO handoff to the spawn hook (ADR-0014). Generate: openssl rand -hex 32.
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY}
      # The blessed tenant-scoped data path the kernel's client calls (ADR-0011 dec 4).
      INDUSTRYFLOW_API_URL: ${INDUSTRYFLOW_API_URL:-http://api-gateway:8000}
      # Where authoring kernels reach the SQL access proxy (ADR-0015); the kernel authenticates
      # with its SQL capability handle as the password. Forwarded to authoring spawns only.
      INDUSTRYFLOW_SQL_PROXY_URL: ${INDUSTRYFLOW_SQL_PROXY_URL:-postgresql://notebook-sql-proxy:6432/${DB_NAME}}
      # Where authoring kernels reach the experiment-tracking gateway (ADR-0019); the kernel's MLflow
      # client uses its tracking capability as the bearer token. Forwarded to authoring spawns only.
      INDUSTRYFLOW_TRACKING_URL: ${INDUSTRYFLOW_TRACKING_URL:-http://notebook-tracking-gateway:5050}
    volumes:
      # DockerSpawner talks to the Docker daemon to spawn per-user containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - notebook-hub-data:/srv/jupyterhub
    # Reach the Docker socket WITHOUT running the hub as root: add the host's docker group as a
    # supplementary group (set DOCKER_GID in .env — `getent group docker | cut -d: -f3`).
    group_add:
      - "${DOCKER_GID:-999}"
    depends_on:
      - redis
      - api-gateway
    networks:
      - industryflow-network
    restart: unless-stopped

  # SQL access proxy (ADR-0015): authoring kernels connect with a normal Postgres driver, using
  # their opaque SQL capability handle as the password. The proxy resolves the handle to a tenant,
  # connects to TimescaleDB as the privileged `notebook_sql_proxy` role, SET ROLEs into that
  # tenant's read-only role, and relays. The kernel never holds a DB password. Not exposed on a
  # host port — only the spawned kernels (same network) reach it at `notebook-sql-proxy:6432`.
  # The proxy verifies the DB server cert against the internal CA (verify-full, ADR-0017) — same
  # CA mount as every other DB client. NOTE: the live end-to-end relay against a real Postgres is
  # not yet cluster-validated (see services/notebook_sql_proxy README / issue #19).
  notebook-sql-proxy:
    profiles: ["notebooks"]
    build:
      context: ./services/notebook_sql_proxy
      dockerfile: Dockerfile
    image: industryflow-notebook-sql-proxy
    container_name: industryflow-notebook-sql-proxy
    environment:
      SQL_PROXY_HOST: 0.0.0.0
      SQL_PROXY_PORT: "6432"
      SQL_PROXY_REDIS_URL: redis://redis:6379/0
      SQL_PROXY_DB_HOST: timescaledb
      SQL_PROXY_DB_PORT: "5432"
      SQL_PROXY_DB_USER: notebook_sql_proxy
      SQL_PROXY_DB_PASSWORD: ${NOTEBOOK_SQL_PROXY_DB_PASSWORD:-}
      SQL_PROXY_DB_NAME: ${DB_NAME}
      # Upstream TLS to the hardened DB (ADR-0017): verify the server cert against the same
      # internal CA every DB client trusts. Set DB_SSLMODE=disable for a dev DB without certs.
      SQL_PROXY_DB_SSLMODE: ${DB_SSLMODE:-verify-full}
      SQL_PROXY_DB_SSLROOTCERT: /etc/ssl/industryflow/ca.crt
    volumes:
      - *ca-mount
    depends_on:
      - redis
      - timescaledb
    networks:
      - industryflow-network
    restart: unless-stopped

  # Experiment-tracking gateway (ADR-0019): authoring kernels point their MLflow client here
  # (MLFLOW_TRACKING_URI) with their tracking capability as the bearer token. The gateway scopes
  # every experiment/run/model/artifact to the caller's tenant and holds MLflow's backend +
  # object-store credentials. Artifacts come back as tenant-scoped pre-signed URLs (dec 6). Not
  # host-published — only spawned kernels (same network) reach it at notebook-tracking-gateway:5050.
  notebook-tracking-gateway:
    profiles: ["notebooks"]
    build:
      context: ./services/notebook_tracking_gateway
      dockerfile: Dockerfile
    image: industryflow-notebook-tracking-gateway
    container_name: industryflow-notebook-tracking-gateway
    environment:
      TRACKING_HOST: 0.0.0.0
      TRACKING_PORT: "5050"
      TRACKING_MLFLOW_URL: http://mlflow:5000
      TRACKING_REDIS_URL: redis://redis:6379/0
      TRACKING_ARTIFACT_BUCKET: mlflow
      TRACKING_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      TRACKING_S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      TRACKING_S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      - redis
      - mlflow
      - minio
    networks:
      - industryflow-network
    restart: unless-stopped

  # SSO reverse proxy (ADR-0014): the hub's only entry point. Validates the platform session via
  # api-gateway /auth/verify and forwards the verified identity, overwriting client-supplied values.
  # Plain HTTP on the internal network only — the frontend edge terminates TLS and reverse-proxies
  # <app>/jupyter/ here (single-origin, ADR-0014), so notebooks are embeddable in the platform UI.
  # No host port and no cert: it is never reached directly, only through the frontend.
  notebook-sso:
    profiles: ["notebooks"]
    image: nginx:1.27-alpine
    container_name: industryflow-notebook-sso
    volumes:
      - ./services/notebook_hub/sso-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - notebook-hub
      - api-gateway
    networks:
      - industryflow-network
    restart: unless-stopped

  # ==========================================================================
  # MONITORING STACK
  # ==========================================================================

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: industryflow-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - industryflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: industryflow-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
    ports:
      - "8080:8080"
    networks:
      - industryflow-network
    restart: unless-stopped
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,diskIO'

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: industryflow-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - industryflow-network
    restart: unless-stopped

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: industryflow-postgres-exporter
    environment:
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
      DATA_SOURCE_URI: "timescaledb:${DB_PORT}/${DB_NAME}?sslmode=verify-full&sslrootcert=/etc/ssl/industryflow/ca.crt"
    ports:
      - "9187:9187"
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    depends_on:
      - timescaledb
    restart: unless-stopped

  # Redis Exporter - Cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: industryflow-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    networks:
      - industryflow-network
    depends_on:
      - redis
    restart: unless-stopped

  # Kafka Exporter - Kafka metrics
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: industryflow-kafka-exporter
    command:
      - '--kafka.server=kafka:29092'
    ports:
      - "9308:9308"
    networks:
      - industryflow-network
    depends_on:
      - kafka
    restart: unless-stopped

  # Grafana - Monitoring & Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: industryflow-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./infrastructure/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./infrastructure/grafana/provisioning/complete_system_dashboard.json:/etc/grafana/provisioning/dashboards/complete_system_dashboard.json
      - ./infrastructure/grafana/provisioning/logs_dashboard.json:/etc/grafana/provisioning/dashboards/logs_dashboard.json
    networks:
      - industryflow-network
    depends_on:
      - timescaledb
      - prometheus
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: industryflow-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    networks:
      - industryflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Promtail - Log collector
  promtail:
    image: grafana/promtail:2.9.3
    container_name: industryflow-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log
    networks:
      - industryflow-network
    depends_on:
      - loki
    restart: unless-stopped

  # ==========================================================================
  # DATABASE BACKUPS (tier-1 DR) — on-demand / cron-driven, not a long-running
  # service. Enabled via the "backup" profile so it doesn't start with `up`.
  #   one-off:   docker compose run --rm db-backup
  #   restore:   docker compose run --rm --entrypoint db-restore.sh db-backup <db> latest
  #   schedule:  add a host cron calling the one-off command.
  # See docs/operations/backup-and-recovery.md.
  # ==========================================================================
  db-backup:
    build:
      context: ./infrastructure/backup
      dockerfile: Dockerfile
    container_name: industryflow-db-backup
    profiles: ["backup"]
    environment:
      PGSSLMODE: ${DB_SSLMODE:-verify-full}
      PGSSLROOTCERT: /etc/ssl/industryflow/ca.crt
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT}
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${MINIO_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-industryflow-backups}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-timescaledb}
      DATABASES: ${BACKUP_DATABASES:-industryflow mlflow}
      RETAIN_PER_DB: ${BACKUP_RETAIN_PER_DB:-14}
    volumes:
      - *ca-mount  # CA to verify the DB server cert (ADR-0017)
    networks:
      - industryflow-network
    restart: "no"


# ==========================================================================
# VOLUMES
# ==========================================================================

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  timescaledb-data:
  redis-data:
  minio-data:
  db-certs:
  ml-models:
    driver: local
  notebook-hub-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  frontend-certs:
    driver: local

# ==========================================================================
# NETWORKS
# ==========================================================================

networks:
  industryflow-network:
    name: industryflow-network
    driver: bridge
