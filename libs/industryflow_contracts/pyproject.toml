[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industryflow-contracts"
version = "1.0.0"
description = "Names and values every IndustryFlow deployment unit must agree on: tenant naming (ADR-0003) and the aggregation-window contract (ADR-0006 dec 7)"
# The Spark job images run the interpreter their base ships, older than the services' 3.14.
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# fakeredis with lupa runs the capability-audit first-use script in a real Lua interpreter.
dev = ["pytest==9.1.1", "fakeredis[lua]==2.40.0", "lupa==2.8", "redis==8.1.0"]

[tool.setuptools]
packages = ["industryflow_contracts"]
