<svg viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>IndustryFlow (mono-light)</title>
  <desc>The platform core — IndustryFlow is the centre that IndustryGrow grows from: a glowing gateway at the middle of the ground, ringed by concentric strata, with sensor streams converging inward from every direction.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cccccc" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#cccccc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#cccccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="black" stop-opacity="1.0"/>
      <stop offset="30%" stop-color="#222222" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#666666" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#666666" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <rect width="680" height="680" fill="url(#bg)"/>
  <circle cx="340" cy="340" r="280" fill="url(#centerGlow)"/>

  <!-- domain boundary: the ground / the platform's world -->
  <circle cx="340" cy="340" r="278" fill="none" stroke="#666666" stroke-width="2"/>

  <!-- concentric strata: the ground's layers (ingest / stream / store) -->
  <g fill="none" stroke="#666666">
    <circle cx="340" cy="340" r="230" stroke-width="1.4" opacity="0.55"/>
    <circle cx="340" cy="340" r="185" stroke-width="1" opacity="0.45" stroke-dasharray="3 9"/>
    <circle cx="340" cy="340" r="140" stroke-width="1.4" opacity="0.35"/>
  </g>

  <!-- streams converging inward to the core, from sensors all around -->
  <g stroke="#666666" stroke-width="1.3" opacity="0.5">
    <line x1="596.0" y1="340.0" x2="460.0" y2="340.0"/>
    <line x1="561.7" y1="468.0" x2="443.9" y2="400.0"/>
    <line x1="468.0" y1="561.7" x2="400.0" y2="443.9"/>
    <line x1="340.0" y1="596.0" x2="340.0" y2="460.0"/>
    <line x1="212.0" y1="561.7" x2="280.0" y2="443.9"/>
    <line x1="118.3" y1="468.0" x2="236.1" y2="400.0"/>
    <line x1="84.0"  y1="340.0" x2="220.0" y2="340.0"/>
    <line x1="118.3" y1="212.0" x2="236.1" y2="280.0"/>
    <line x1="212.0" y1="118.3" x2="280.0" y2="236.1"/>
    <line x1="340.0" y1="84.0"  x2="340.0" y2="220.0"/>
    <line x1="468.0" y1="118.3" x2="400.0" y2="236.1"/>
    <line x1="561.7" y1="212.0" x2="443.9" y2="280.0"/>
  </g>

  <!-- the platform core: the gateway glow (the "self" at the middle) -->
  <circle cx="340" cy="340" r="120" fill="url(#coreGlow)"/>
  <circle cx="340" cy="340" r="12" fill="#111111"/>

  <!-- sensor nodes on the surface ring -->
  <g fill="#fafafa" stroke="#666666" stroke-width="2">
    <circle cx="596.0" cy="340.0" r="6"/>
    <circle cx="561.7" cy="468.0" r="6"/>
    <circle cx="468.0" cy="561.7" r="6"/>
    <circle cx="340.0" cy="596.0" r="6"/>
    <circle cx="212.0" cy="561.7" r="6"/>
    <circle cx="118.3" cy="468.0" r="6"/>
    <circle cx="84.0"  cy="340.0" r="6"/>
    <circle cx="118.3" cy="212.0" r="6"/>
    <circle cx="212.0" cy="118.3" r="6"/>
    <circle cx="340.0" cy="84.0"  r="6"/>
    <circle cx="468.0" cy="118.3" r="6"/>
    <circle cx="561.7" cy="212.0" r="6"/>
  </g>
</svg>
