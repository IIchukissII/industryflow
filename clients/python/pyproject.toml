[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industryflow"
version = "0.0.1"
description = "Tenant-scoped notebook client for the IndustryFlow platform (phase-1 skeleton)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3"]

[tool.setuptools]
packages = ["industryflow"]
