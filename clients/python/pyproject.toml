[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industryflow"
version = "0.0.1"
description = "Tenant-scoped notebook client for the IndustryFlow platform (phase-1 skeleton)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Tenant SQL through the proxy (ADR-0015). Optional so the base client stays lean; the authoring
# notebook image installs it (industryflow[sql]).
sql = ["psycopg[binary]>=3.1"]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["industryflow"]
